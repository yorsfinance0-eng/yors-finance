                            <div style={{ fontWeight: 800, fontSize: 15, color: form.dir === "in" ? C.green : C.red, marginBottom: 12 }}>{form.dir === "in" ? "💵 Cash In" : "💸 Cash Out"}</div>
                            <DateInput value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />
                            <select style={INP} value={form.payType || ""} onChange={e => {
                                const val = e.target.value;
                                setForm(f => ({
                                    ...f,
                                    payType: val,
                                    description: val === "GST Tax Payment" ? "GST Duties & Taxes Payment to Government" : val,
                                    amount: val === "GST Tax Payment" ? String(Math.max(0, totalGstPayable)) : f.amount,
                                    linkedId: ""
                                }));
                            }}>
                                <option value="">{form.dir === "in" ? "Receipt Type" : "Payment Type"} *</option>
                                {(form.dir === "in" ? CASH_IN_TYPES : CASH_OUT_TYPES).map(t => <option key={t}>{t}</option>)}
                            </select>
                            {form.dir === "out" && form.payType === "GST Tax Payment" && (
                                <>
                                    <div style={{ fontSize: 11, color: C.teal, marginTop: 4, marginBottom: 8, background: "#042f2e", padding: "8px 12px", borderRadius: 8, border: "1px solid #14b8a6" }}>
                                        🏛️ <strong>GST Settlement:</strong> Outstanding liability is <strong>{fc(totalGstPayable)}</strong>. Paying this will settle your duties and taxes.
                                    </div>
                                    <div style={{ background: "#0f172a", borderRadius: 8, padding: 12, marginBottom: 9, border: "1px solid " + C.border, display: "grid", gap: 8 }}>
                                        <div style={{ fontSize: 11, color: C.teal, fontWeight: 700 }}>🏛️ GST Tax Payment Split</div>
                                        <div>
                                            <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>CGST Paid (₹) (Outstanding: {fc(cgstPayable)})</label>
                                            <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="CGST Paid" value={form.cgstPaid || ""} onChange={e => {
                                                const val = e.target.value;
                                                setForm(f => {
                                                    const cg = Number(val || 0);
                                                    const sg = Number(f.sgstPaid || 0);
                                                    const ig = Number(f.igstPaid || 0);
                                                    return { ...f, cgstPaid: val, amount: String(cg + sg + ig) };
                                                });
                                            }} />
                                        </div>
                                        <div>
                                            <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>SGST Paid (₹) (Outstanding: {fc(sgstPayable)})</label>
                                            <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="SGST Paid" value={form.sgstPaid || ""} onChange={e => {
                                                const val = e.target.value;
                                                setForm(f => {
                                                    const cg = Number(f.cgstPaid || 0);
                                                    const sg = Number(val || 0);
                                                    const ig = Number(f.igstPaid || 0);
                                                    return { ...f, sgstPaid: val, amount: String(cg + sg + ig) };
                                                });
                                            }} />
                                        </div>
                                        <div>
                                            <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>IGST Paid (₹) (Outstanding: {fc(igstPayable)})</label>
                                            <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="IGST Paid" value={form.igstPaid || ""} onChange={e => {
                                                const val = e.target.value;
                                                setForm(f => {
                                                    const cg = Number(f.cgstPaid || 0);
                                                    const sg = Number(f.sgstPaid || 0);
                                                    const ig = Number(val || 0);
                                                    return { ...f, igstPaid: val, amount: String(cg + sg + ig) };
                                                });
                                            }} />
                                        </div>
                                    </div>
                                </>
                            )}
                            {form.dir === "in" && form.payType === "Debtor Payment" && <select style={INP} value={form.linkedId || ""} onChange={e => { const d = debs.find(x => x.id === e.target.value); setForm(f => ({ ...f, linkedId: e.target.value, description: "Receipt from " + (d ? d.name : ""), amount: d ? String(debtorBal(d)) : f.amount })); }}>
                                <option value="">Select Debtor</option>{debs.filter(d => !d.checked).map(d => <option key={d.id} value={d.id}>{d.name} — {fc(debtorBal(d))}</option>)}
                            </select>}
                            {form.dir === "in" && form.payType === "Debtor Payment" && <input style={INP} placeholder="Bill No. (Optional)" value={form.billNo || ""} onChange={e => setForm(f => ({ ...f, billNo: e.target.value }))} />}
                            {form.dir === "out" && form.payType === "Creditor Payment" && <select style={INP} value={form.linkedId || ""} onChange={e => { const c = creds.find(x => x.id === e.target.value); setForm(f => ({ ...f, linkedId: e.target.value, description: "Payment to " + (c ? c.name : ""), amount: c ? String(creditorBal(c)) : f.amount })); }}>
                                <option value="">Select Creditor</option>{creds.filter(c => !c.checked).map(c => <option key={c.id} value={c.id}>{c.name} — {fc(creditorBal(c))}</option>)}
                            </select>}
                            {form.dir === "out" && form.payType === "Interest on Loan Repayment" && (
                                <select style={INP} value={form.linkedId || ""} onChange={e => {
                                    const loan = Object.values(state.balanceSheet?.liabilities || {}).find(x => x.id === e.target.value);
                                    const remaining = loan ? loanInterestOutstanding(loan) : 0;
                                    setForm(f => ({
                                        ...f,
                                        linkedId: e.target.value,
                                        description: "Interest Payment for " + (loan ? loan.description : ""),
                                        amount: loan ? String(remaining) : f.amount
                                    }));
                                }}>
                                    <option value="">Select Loan</option>
                                    {Object.values(state.balanceSheet?.liabilities || {})
                                        .filter(x => x.subCategory === "Long Term Borrowings" && x.interestRate)
                                        .map(loan => {
                                            const remaining = loanInterestOutstanding(loan);
                                            return (
                                                <option key={loan.id} value={loan.id}>
                                                    {loan.description} — Remaining Interest: {fc(remaining)}
                                                </option>
                                            );
                                        })
                                    }
                                </select>
                            )}
                            {form.dir === "out" && form.payType === "Loan Repayment" && (
                                <select style={INP} value={form.linkedId || ""} onChange={e => {
                                    const loan = Object.values(state.balanceSheet?.liabilities || {}).find(x => x.id === e.target.value);
                                    const remaining = loan ? loanPrincipalOutstanding(loan) : 0;
                                    setForm(f => ({
                                        ...f,
                                        linkedId: e.target.value,
                                        description: "Repayment of " + (loan ? loan.description : ""),
                                        amount: loan ? String(remaining) : f.amount
                                    }));
                                }}>
                                    <option value="">Select Loan</option>
                                    {Object.values(state.balanceSheet?.liabilities || {})
                                        .filter(x => x.subCategory === "Long Term Borrowings")
                                        .map(loan => {
                                            const remaining = loanPrincipalOutstanding(loan);
                                            return (
                                                <option key={loan.id} value={loan.id}>
                                                    {loan.description} — Remaining Principal: {fc(remaining)}
                                                </option>
                                            );
                                        })
                                    }
                                </select>
                            )}
                            <input style={INP} placeholder="Description *" value={form.description || ""} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} />
                            {form.payType !== "GST Tax Payment" && (
                                <div style={{ background: "#0a0f1e", borderRadius: 8, padding: 12, marginBottom: 9, border: "1px solid " + C.border }}>
                                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                                        <span style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700 }}>Enable GST on this entry?</span>
                                        <input type="checkbox" checked={form.enableGst === "yes"} onChange={e => setForm(f => ({ ...f, enableGst: e.target.checked ? "yes" : "no", gstRate: "18", gstType: "cgst_sgst" }))} />
                                    </div>
                                    {form.enableGst === "yes" && (<div style={{ marginTop: 8 }}>
                                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                                            <div>
                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>GST Rate (%)</label>
                                                <select style={{ ...INP, marginBottom: 0 }} value={form.gstRate || "18"} onChange={e => setForm(f => ({ ...f, gstRate: e.target.value }))}>{[0, 5, 12, 18, 28].map(r => <option key={r} value={r}>{r}%</option>)}</select>
                                            </div>
                                            <div>
                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Tax Type</label>
                                                <select style={{ ...INP, marginBottom: 0 }} value={form.gstType || "cgst_sgst"} onChange={e => setForm(f => ({ ...f, gstType: e.target.value }))}>
                                                    <option value="cgst_sgst">CGST + SGST (Local)</option>
                                                    <option value="igst">IGST (Inter-State)</option>
                                                </select>
                                            </div>
                                        </div>
                                        {form.amount && (() => {
                                            const base = Number(form.amount || 0);
                                            const rate = Number(form.gstRate || 18);
                                            const tax = Math.round(base * rate) / 100;
                                            const type = form.gstType || "cgst_sgst";
                                            if (type === "cgst_sgst") {
                                                const half = tax / 2;
                                                return <div style={{ fontSize: 11, color: C.amber, marginTop: 6 }}>
                                                    CGST ({rate / 2}%): {fc(half)} | SGST ({rate / 2}%): {fc(half)}<br />
                                                    Total GST: {fc(tax)} | Grand Total: {fc(base + tax)}
                                                </div>;
                                            } else {
                                                return <div style={{ fontSize: 11, color: C.amber, marginTop: 6 }}>
                                                    IGST ({rate}%): {fc(tax)}<br />
                                                    Total GST: {fc(tax)} | Grand Total: {fc(base + tax)}
                                                </div>;
                                            }
                                        })()}
                                    </div>)}
                                </div>
                            )}
                            <input type="number" style={INP} placeholder="Amount (Base, ex-GST) ₹" value={form.amount || ""} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} readOnly={form.payType === "GST Tax Payment"} />
                            <button style={{ ...BTNP(form.dir === "in" ? "linear-gradient(90deg,#22c55e,#16a34a)" : "linear-gradient(90deg,#ef4444,#dc2626)"), width: "100%" }} onClick={applyCash}>Save</button>
                        </div>}

                        {modal === "depr" && <div>
                            <div style={{ fontWeight: 800, fontSize: 15, color: C.amber, marginBottom: 4 }}>📉 Add Depreciation</div>
                            {Object.values(state.balanceSheet?.assets || {}).filter(a => a.subCategory === "Fixed Assets" && !a.linkedDeprId).length === 0
                                ? <div style={{ background: "#1e293b", borderRadius: 8, padding: 14, marginBottom: 12, color: C.amber, fontSize: 12, textAlign: "center" }}>No Fixed Assets found. Add one in Balance Sheet first.</div>
                                : <div>
                                    <select style={INP} value={form.bsAssetId || ""} onChange={e => setForm(f => ({ ...f, bsAssetId: e.target.value }))}>
                                        <option value="">Select Fixed Asset *</option>
                                        {Object.values(state.balanceSheet?.assets || {}).filter(a => a.subCategory === "Fixed Assets" && !a.linkedDeprId).map(a => <option key={a.id} value={a.id}>{a.description} — {fc(a.amount)}</option>)}
                                    </select>
                                    <select style={INP} value={form.method || ""} onChange={e => setForm(f => ({ ...f, method: e.target.value }))}><option value="">Method *</option>{DEPR_METHODS.map(m => <option key={m}>{m}</option>)}</select>
                                    <select style={INP} value={form.period || ""} onChange={e => setForm(f => ({ ...f, period: e.target.value }))}><option value="">Period *</option>{DEPR_PERIODS.map(p => <option key={p}>{p}</option>)}</select>
                                    <input type="number" style={INP} placeholder="Annual Depreciation Rate (%) *" value={form.depRate || ""} onChange={e => setForm(f => ({ ...f, depRate: e.target.value }))} />
                                    <button style={{ ...BTNP("linear-gradient(90deg,#f59e0b,#d97706)"), width: "100%" }} onClick={applyDepr}>Save Depreciation</button>
                                </div>}
                        </div>}

                        {modal === "addClient" && <div>
                            <div style={{ fontWeight: 800, fontSize: 15, color: C.teal, marginBottom: 12 }}>👤 Add Client</div>
                            <input style={INP} placeholder="Client Name *" value={form.name || ""} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} />
                            <select style={INP} value={form.clientType || ""} onChange={e => setForm(f => ({ ...f, clientType: e.target.value }))}>
                                <option value="">Client Type *</option>
                                {CLIENT_TYPES.map(t => <option key={t}>{t}</option>)}
                            </select>
                            <DateInput value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />
                            <input style={INP} placeholder="Phone" value={form.phone || ""} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} />
                            <input style={INP} placeholder="Address" value={form.address || ""} onChange={e => setForm(f => ({ ...f, address: e.target.value }))} />
                            <input style={INP} placeholder="GSTIN (Optional)" value={form.gstin || ""} onChange={e => setForm(f => ({ ...f, gstin: e.target.value.toUpperCase() }))} />
                            <input style={INP} placeholder="State Code (Optional)" value={form.stateCode || ""} onChange={e => setForm(f => ({ ...f, stateCode: e.target.value }))} />
                            <button style={{ ...BTNP("linear-gradient(90deg,#14b8a6,#0d9488)"), width: "100%" }} onClick={() => {
                                if (!form.name || !form.clientType) { alert("Fill name and type"); return; }
                                upd(p => ({ ...p, clients: [...(p.clients || []), { id: gid(), name: form.name, type: form.clientType, date: form.date || today(), phone: form.phone || "", address: form.address || "", gstin: form.gstin || "", stateCode: form.stateCode || "" }] })); closeM();
                            }}>Save Client</button>
                        </div>}

                        <button onClick={closeM} style={{ width: "100%", marginTop: 8, background: C.mid, color: "#94a3b8", border: "none", borderRadius: 7, padding: "7px 0", cursor: "pointer", fontSize: 12 }}>Cancel</button>
                    </div>
                </div>}

                {/* ──── MONTHLY COMPARATIVE REPORT MODAL ──── */}
                {monthlyReportModal && (() => {
                    const monthsList = [
                        "2026-04","2026-05","2026-06","2026-07","2026-08","2026-09",
                        "2026-10","2026-11","2026-12","2027-01","2027-02","2027-03"
                    ];
                    const monthNames = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar"];

                    const getMetrics = (mKey) => {
                        const siM = si.filter(x => x.date && x.date.startsWith(mKey));
                        const soM = so.filter(x => x.date && x.date.startsWith(mKey));
                        const teM = te.filter(x => x.date && x.date.startsWith(mKey));
                        const pleM = ple.filter(x => x.date && x.date.startsWith(mKey));
                        const rmsM = (state.rawMaterialPayments || []).filter(x => x.date && x.date.startsWith(mKey));

                        const grossPurchasesM = siM.filter(x => !x.isReturn).reduce((a, b) => a + Number(b.totalAmount - (b.gstAmount || 0)), 0);
                        const purchReturnsM = siM.filter(x => x.isReturn).reduce((a, b) => a + Number(b.totalAmount - (b.gstAmount || 0)), 0);
                        const netPurchasesM = grossPurchasesM - purchReturnsM;

                        const grossSalesM = soM.filter(x => !x.isReturn).reduce((a, b) => a + Number(b.totalAmount - (b.gstAmount || 0)), 0);
                        const salesReturnsM = soM.filter(x => x.isReturn).reduce((a, b) => a + Number(b.totalAmount - (b.gstAmount || 0)), 0);
                        const netSalesM = grossSalesM - salesReturnsM;

                        const rmCostsM = rmsM.reduce((sum, r) => sum + Math.max(0, Number(r.amount) - (r.usedForStockIn || 0)), 0);
                        const teDrM = teM.filter(e => e.side === "dr" && e.sourceType !== "rawMaterial").reduce((a, b) => a + Number(b.amount), 0);
                        const teCrM = teM.filter(e => e.side === "cr").reduce((a, b) => a + Number(b.amount), 0);

                        const drM = netPurchasesM + rmCostsM + teDrM;
                        const crM = netSalesM + teCrM;
                        const grossProfitM = crM - drM;

                        const plExpenseM = pleM.filter(e => e.side === "expense").reduce((a, b) => a + Number(b.amount), 0) + (grossProfitM < 0 ? Math.abs(grossProfitM) : 0);
                        const plIncomeM = pleM.filter(e => e.side === "income").reduce((a, b) => a + Number(b.amount), 0) + (grossProfitM > 0 ? grossProfitM : 0);
                        const netPLM = plIncomeM - plExpenseM;

                        return {
                            netSales: netSalesM,
                            netPurchases: netPurchasesM,
                            rmCosts: rmCostsM,
                            teDr: teDrM,
                            teCr: teCrM,
                            drTotal: drM,
                            crTotal: crM,
                            grossProfit: grossProfitM,
                            plExpense: plExpenseM,
                            plIncome: plIncomeM,
                            netPL: netPLM
                        };
                    };

                    const monthData = monthsList.map(m => getMetrics(m));

                    return (
                        <div style={{ position:"fixed", inset:0, background:"#000000e0", display:"flex", alignItems:"center", justifyContent:"center", zIndex:400, overflowY:"auto" }}>
                            <div style={{ background:"#0f172a", border:"2px solid "+C.teal, borderRadius:16, padding:24, width:"95vw", maxWidth:1100, maxHeight:"90vh", overflowY:"auto", boxShadow:"0 20px 60px rgba(0,0,0,0.8)" }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, borderBottom:"1px solid #334155", paddingBottom:10 }}>
                                    <div style={{ fontWeight:900, fontSize:18, color:C.teal }}>📊 Monthly Comparative Report — {monthlyReportModal} (FY 2026-27)</div>
                                    <button onClick={() => setMonthlyReportModal(null)} style={BTND}>✕ Close</button>
                                </div>

                                <div style={{ overflowX:"auto" }}>
                                    <table style={{ ...TBL, fontSize:11 }}>
                                        <thead>
                                            <tr>
                                                <th style={THS}>Particulars</th>
                                                {monthNames.map((m, i) => <th key={m} style={{ ...THS, textAlign:"right" }}>{m}</th>)}
                                                <th style={{ ...THS, textAlign:"right", background:"#1e293b", color:C.teal }}>Total</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {monthlyReportModal === "Trading A/C" && (<>
                                                <tr><td style={{ ...TDS, fontWeight:700, color:C.green }}>Sales (Net)</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right" }}>{fc(d.netSales)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:800, color:C.green }}>{fc(monthData.reduce((s, x) => s + x.netSales, 0))}</td></tr>
                                                <tr><td style={{ ...TDS, fontWeight:700, color:C.red }}>Purchases (Net)</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right" }}>{fc(d.netPurchases)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:800, color:C.red }}>{fc(monthData.reduce((s, x) => s + x.netPurchases, 0))}</td></tr>
                                                <tr><td style={{ ...TDS, color:C.muted }}>Raw Material Costs</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right" }}>{fc(d.rmCosts)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:700 }}>{fc(monthData.reduce((s, x) => s + x.rmCosts, 0))}</td></tr>
                                                <tr><td style={{ ...TDS, color:C.muted }}>Direct Expenses (Dr)</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right" }}>{fc(d.teDr)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:700 }}>{fc(monthData.reduce((s, x) => s + x.teDr, 0))}</td></tr>
                                                <tr style={{ background:"#1e293b", fontWeight:800 }}><td style={TDS}>Gross Profit / (Loss)</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right", color: d.grossProfit >= 0 ? C.green : C.red }}>{fc(d.grossProfit)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:900, color: monthData.reduce((s, x) => s + x.grossProfit, 0) >= 0 ? C.green : C.red }}>{fc(monthData.reduce((s, x) => s + x.grossProfit, 0))}</td></tr>
                                            </>)}

                                            {monthlyReportModal === "P&L Account" && (<>
                                                <tr><td style={{ ...TDS, fontWeight:700, color:C.teal }}>Gross Profit / (Loss)</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right" }}>{fc(d.grossProfit)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:800, color:C.teal }}>{fc(monthData.reduce((s, x) => s + x.grossProfit, 0))}</td></tr>
                                                <tr><td style={{ ...TDS, color:C.red }}>Operating Expenses (Dr)</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right" }}>{fc(d.plExpense)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:700, color:C.red }}>{fc(monthData.reduce((s, x) => s + x.plExpense, 0))}</td></tr>
                                                <tr><td style={{ ...TDS, color:C.green }}>Other Income (Cr)</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right" }}>{fc(d.plIncome)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:700, color:C.green }}>{fc(monthData.reduce((s, x) => s + x.plIncome, 0))}</td></tr>
                                                <tr style={{ background:"#1e293b", fontWeight:800 }}><td style={TDS}>Net Profit / (Loss)</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right", color: d.netPL >= 0 ? C.green : C.red }}>{fc(d.netPL)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:900, color: monthData.reduce((s, x) => s + x.netPL, 0) >= 0 ? C.green : C.red }}>{fc(monthData.reduce((s, x) => s + x.netPL, 0))}</td></tr>
                                            </>)}

                                            {monthlyReportModal === "Balance Sheet" && (<>
                                                <tr><td style={{ ...TDS, fontWeight:700, color:C.blue }}>Sales Revenue</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right" }}>{fc(d.netSales)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:800, color:C.blue }}>{fc(monthData.reduce((s, x) => s + x.netSales, 0))}</td></tr>
                                                <tr><td style={{ ...TDS, fontWeight:700, color:C.amber }}>Purchases Outflow</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right" }}>{fc(d.netPurchases)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:800, color:C.amber }}>{fc(monthData.reduce((s, x) => s + x.netPurchases, 0))}</td></tr>
                                                <tr><td style={{ ...TDS, fontWeight:700, color:C.violet }}>P&L Net Position</td>{monthData.map((d, i) => <td key={i} style={{ ...TDS, textAlign:"right", color: d.netPL >= 0 ? C.green : C.red }}>{fc(d.netPL)}</td>)}<td style={{ ...TDS, textAlign:"right", fontWeight:800, color: monthData.reduce((s, x) => s + x.netPL, 0) >= 0 ? C.green : C.red }}>{fc(monthData.reduce((s, x) => s + x.netPL, 0))}</td></tr>
                                            </>)}
                                        </tbody>
                                    </table>
                                </div>

                                <div style={{ marginTop:16, textAlign:"right" }}>
                                    <button onClick={() => setMonthlyReportModal(null)} style={{ ...BTNP(C.mid), border:"1px solid "+C.border }}>Close</button>
                                </div>
                            </div>
                        </div>
                    );
                })()}

                {/* ──── ACCEPT CHOICE MODAL ──── */}
                {quoteAcceptModal && (() => {
                    const q = (state.quotations || []).find(x => x.id === quoteAcceptModal);
                    return (
                        <div style={{ position:"fixed", inset:0, background:"#000000e0", display:"flex", alignItems:"center", justifyContent:"center", zIndex:400, overflowY:"auto" }}>
                            <div style={{ background:"linear-gradient(135deg,#0f172a,#1e1b4b)", border:"2px solid "+C.teal, borderRadius:20, padding:32, width:480, maxWidth:"95vw", boxShadow:"0 20px 60px rgba(0,0,0,0.8)", margin:"20px auto" }}>
                                <div style={{ fontSize:28, textAlign:"center", marginBottom:10 }}>✅</div>
                                <div style={{ fontWeight:900, fontSize:17, color:C.teal, marginBottom:8, textAlign:"center" }}>Quotation Accepted</div>
                                <div style={{ fontSize:12, color:C.muted, marginBottom:4, textAlign:"center" }}>{q?.quotNo} — {q?.clientName}</div>
                                <div style={{ fontSize:13, color:C.text, marginBottom:20, textAlign:"center", padding:"10px 0", borderTop:"1px solid #334155", borderBottom:"1px solid #334155", marginTop:10 }}>
                                    What would you like to do next?
                                </div>
                                <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                                    <button style={{ ...BTNP("linear-gradient(135deg,#0d9488,#0f766e)"), padding:"14px 20px", fontSize:14, borderRadius:12, textAlign:"left", display:"flex", flexDirection:"column", gap:4 }} onClick={() => convertQuotationToInvoice(quoteAcceptModal)}>
                                        <span style={{ fontWeight:900 }}>📄 Convert to Sales Invoice Now</span>
                                        <span style={{ fontSize:11, opacity:.85, fontWeight:400 }}>Opens the invoice wizard pre-filled with quotation data. Generates invoice number and posts to accounting books.</span>
                                    </button>
                                    <button style={{ ...BTNP("linear-gradient(135deg,#1e293b,#334155)"), padding:"14px 20px", fontSize:14, borderRadius:12, border:"1.5px solid "+C.border, textAlign:"left", display:"flex", flexDirection:"column", gap:4 }} onClick={() => setQuoteAcceptModal(null)}>
                                        <span style={{ fontWeight:900 }}>📌 Keep as Standalone Record</span>
                                        <span style={{ fontSize:11, opacity:.85, fontWeight:400, color:C.muted }}>Status stays "Accepted". No invoice created. No impact on Ledger, GST reports, or P&L. You can convert later.</span>
                                    </button>
                                </div>
                                <div style={{ marginTop:16, fontSize:10, color:C.muted, textAlign:"center" }}>
                                    ⚠️ Quotations in "Accepted" status do NOT feed accounting books until a Sales Invoice is created.
                                </div>
                            </div>
                        </div>
                    );
                })()}

                {loanPopup && (
                    <div onClick={() => {
                        setForm(f => ({ ...f, subCategory: "", isLoan: false, interestRate: "" }));
                        setLoanPopup(false);

                    }} style={{ position: "fixed", inset: 0, background: "#000000d0", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300, overflowY: "auto" }}>
                        <div onClick={e => e.stopPropagation()} style={{ background: C.mid, border: "1.5px solid " + C.blue, borderRadius: 16, padding: 24, width: 400, maxWidth: "95vw", boxShadow: "0 10px 30px rgba(0,0,0,0.6)", margin: "20px auto" }}>
                            <div style={{ fontWeight: 800, fontSize: 15, color: C.blue, marginBottom: 6, display: "flex", alignItems: "center", gap: 6 }}>
                                🏦 Configure Loan Details
                            </div>
                            <div style={{ fontSize: 11, color: C.muted, marginBottom: 14, borderBottom: "1px solid #334155", paddingBottom: 10 }}>
                                Fill in all loan parameters. Interest expense will be auto-accrued monthly from the start date in P&amp;L.
                            </div>

                            {/* Row 1: Loan Amount */}
                            <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Loan / Principal Amount (₹) *</label>
                            <input type="number" style={INP} placeholder="e.g. 500000" value={form.amount || ""} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} />

                            {/* Row 2: Loan Type */}
                            <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Loan Type</label>
                            <select style={INP} value={form.loanType || "Term Loan"} onChange={e => setForm(f => ({ ...f, loanType: e.target.value }))}>
                                {["Term Loan", "Vehicle Loan", "Home Loan", "Business Loan", "Machinery Loan", "Equipment Finance", "Overdraft", "Personal Loan", "Other"].map(t => <option key={t}>{t}</option>)}
                            </select>

                            {/* Row 3: Interest Rate & Tenure side-by-side */}
                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                                <div>
                                    <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Interest Rate (% p.a.) *</label>
                                    <input type="number" step="0.01" style={{ ...INP, marginBottom: 0 }} placeholder="e.g. 10.5" value={form.interestRate || ""} onChange={e => setForm(f => ({ ...f, interestRate: e.target.value }))} />
                                </div>
                                <div>
                                    <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Tenure (Months)</label>
                                    <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="e.g. 60" value={form.loanTenureMonths || ""} onChange={e => setForm(f => ({ ...f, loanTenureMonths: e.target.value }))} />
                                </div>
                            </div>
                            <div style={{ height: 9 }} />

                            {/* Row 4: Repayment Type & Grace Period */}
                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                                <div>
                                    <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Repayment Schedule</label>
                                    <select style={{ ...INP, marginBottom: 0 }} value={form.repaymentType || "EMI"} onChange={e => setForm(f => ({ ...f, repaymentType: e.target.value }))}>
                                        {["EMI", "Bullet (Lump-Sum)", "Interest Only", "Reducing Balance", "Flexible"].map(t => <option key={t}>{t}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Grace Period (Months)</label>
                                    <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="e.g. 3" value={form.gracePeriodMonths || ""} onChange={e => setForm(f => ({ ...f, gracePeriodMonths: e.target.value }))} />
                                </div>
                            </div>
                            <div style={{ height: 9 }} />

                            {/* Loan Start Date */}
                            <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Loan Start Date *</label>
                            <DateInput value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />

                            {/* Live EMI Preview */}
                            {(() => {
                                const p = Number(form.amount || 0);
                                const r = Number(form.interestRate || 0) / 1200;
                                const n = Number(form.loanTenureMonths || 0);
                                const emi = (p && r && n) ? (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1) : 0;
                                const totalPay = emi * n;
                                const totalInt = totalPay - p;
                                if (!p || !r || !n) return null;
                                return (
                                    <div style={{ background: "#0a0f1e", borderRadius: 8, padding: 12, marginBottom: 12, border: "1px solid #1e3a5f" }}>
                                        <div style={{ fontSize: 10, fontWeight: 800, color: C.blue, marginBottom: 8 }}>📊 Loan Preview ({form.repaymentType || "EMI"})</div>
                                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, fontSize: 11 }}>
                                            <span style={{ color: C.muted }}>Principal</span><span style={{ color: C.text, fontWeight: 700 }}>{fc(p)}</span>
                                            {emi > 0 && <><span style={{ color: C.muted }}>Monthly EMI</span><span style={{ color: C.green, fontWeight: 700 }}>{fc(emi)}</span></>}
                                            <span style={{ color: C.muted }}>Total Interest</span><span style={{ color: C.amber, fontWeight: 700 }}>{fc(totalInt)}</span>
                                            <span style={{ color: C.muted }}>Total Repayment</span><span style={{ color: C.red, fontWeight: 700 }}>{fc(totalPay)}</span>
                                        </div>
                                    </div>
                                );
                            })()}

                            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                                <button
                                    style={{ ...BTNP(), flex: 1 }}
                                    onClick={() => {
                                        if (!form.amount || Number(form.amount) <= 0) { alert("Please enter a valid loan amount."); return; }
                                        if (!form.interestRate || Number(form.interestRate) < 0) { alert("Please enter a valid interest rate."); return; }
                                        if (!form.date) { alert("Please enter a loan start date."); return; }
                                        setForm(f => ({ ...f, isLoan: true }));
                                        setLoanPopup(false);
                                    }}
                                >
                                    ✓ Confirm Loan
                                </button>
                                <button
                                    style={{ ...BTNP("transparent"), border: "1px solid #475569", color: "#94a3b8", flex: 1 }}
                                    onClick={() => {
                                        setForm(f => ({ ...f, subCategory: "", isLoan: false, interestRate: "" }));
                                        setLoanPopup(false);
                                    }}
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>);
        }

        // ─── Error Boundary ───────────────────────────────────
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(err) { return { hasError: true, error: err }; }
            componentDidCatch(err, info) { console.error("React ErrorBoundary caught:", err, info); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ minHeight: "100vh", background: "#0f172a", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
                            <div style={{ background: "#1e293b", border: "1.5px solid #ef4444", borderRadius: 16, padding: 32, maxWidth: 560, width: "100%" }}>
                                <div style={{ fontSize: 28, marginBottom: 12 }}>⚠️</div>
                                <div style={{ fontSize: 18, fontWeight: 800, color: "#fca5a5", marginBottom: 8 }}>Something went wrong</div>
                                <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 16, fontFamily: "monospace", background: "#0f172a", padding: 12, borderRadius: 8, wordBreak: "break-all" }}>
                                    {this.state.error && this.state.error.toString()}
                                </div>
                                <button onClick={() => { this.setState({ hasError: false, error: null }); }} style={{ background: "linear-gradient(90deg,#6366f1,#8b5cf6)", color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>Try to Recover</button>
                                <button onClick={() => window.location.reload()} style={{ background: "#334155", color: "#e2e8f0", border: "none", borderRadius: 8, padding: "10px 20px", cursor: "pointer", fontWeight: 700, fontSize: 13, marginLeft: 8 }}>Reload Page</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>

</html>
