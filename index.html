                                            {catLabel[cat]}
                                        </button>
                                    ))}
                                </div>

                                {/* Summary Cards */}
                                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 16 }}>
                                    {[["Orders", clOrders.length, "#6366f1,#8b5cf6"], ["Total Qty", totalQty, "#0ea5e9,#0284c7"], ["Revenue", fc(totalAmt), "#8b5cf6,#7c3aed"], ["Avg Order", fc(avgOrder), "#14b8a6,#0d9488"], ["Outstanding", fc(outstandingBal), outstandingBal > 0 ? "#f59e0b,#d97706" : "#22c55e,#16a34a"], ["Last Order", clOrders.length > 0 ? clOrders[0].date : "—", "#7c3aed,#6d28d9"]].map(([l, v, g]) => (
                                        <div key={l} style={CARD(g)}><div style={{ fontSize: 9 }}>{l}</div><div style={{ fontSize: 12, fontWeight: 900 }}>{v}</div></div>
                                    ))}
                                </div>

                                {/* Charts */}
                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 16 }}>
                                    <div style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid " + C.border }}>
                                        <div style={{ fontSize: 12, fontWeight: 800, color: catColors[clDetailCat], marginBottom: 10 }}>📊 Monthly Revenue — {catLabel[clDetailCat]}</div>
                                        <BarChart data={monthAmtData} color={catColors[clDetailCat]} height={170} />
                                        {monthAmtData.length >= 2 && (() => { const last = monthAmtData[monthAmtData.length - 1].v, prev = monthAmtData[monthAmtData.length - 2].v, change = prev > 0 ? ((last - prev) / prev * 100).toFixed(1) : 0; return <div style={{ marginTop: 8, fontSize: 11, color: change >= 0 ? C.green : C.red, fontWeight: 700 }}>{change >= 0 ? "▲" : "▼"} {Math.abs(change)}% vs prev month</div>; })()}
                                    </div>
                                    <div style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid " + C.border }}>
                                        <div style={{ fontSize: 12, fontWeight: 800, color: catColors[clDetailCat], marginBottom: 10 }}>📈 Monthly Qty — {catLabel[clDetailCat]}</div>
                                        <BarChart data={monthQtyData} color={catColors[clDetailCat]} height={170} />
                                    </div>
                                </div>

                                {/* Product Breakdown */}
                                <div style={{ background: C.mid, borderRadius: 14, padding: 16, marginBottom: 16, border: "1px solid " + C.border }}>
                                    <div style={{ fontSize: 12, fontWeight: 800, color: C.blue, marginBottom: 10 }}>🧴 Product Breakdown — {catLabel[clDetailCat]}</div>
                                    {Object.keys(productMap).length === 0 ? <div style={{ color: C.muted, fontSize: 11, textAlign: "center", padding: 16 }}>No orders in this view</div> : (
                                        <table style={TBL}><thead><tr>{["Bottle Type", "Orders", "Total Qty", "Avg Rate", "Total Amount", "% Share"].map(h => <th key={h} style={THS}>{h}</th>)}</tr></thead>
                                            <tbody>{Object.entries(productMap).map(([bt, d]) => {
                                                const avgRate = d.rates.reduce((a, b) => a + b, 0) / d.rates.length, pct = totalAmt > 0 ? (d.amt / totalAmt * 100).toFixed(1) : 0;
                                                return <tr key={bt}><td style={TDS}><Badge label={bt} color="#6366f1" /></td><td style={TDS}>{d.count}</td><td style={{ ...TDS, fontWeight: 700 }}>{d.qty}</td><td style={TDS}>{fc(avgRate)}</td><td style={{ ...TDS, fontWeight: 700, color: C.violet }}>{fc(d.amt)}</td><td style={TDS}><span style={{ color: catColors[clDetailCat], fontWeight: 700 }}>{pct}%</span></td></tr>;
                                            })}</tbody>
                                        </table>
                                    )}
                                </div>

                                {/* Sales History (Normal) */}
                                <div style={{ background: C.mid, borderRadius: 14, padding: 16, marginBottom: 16, border: "1px solid " + C.border }}>
                                    <div style={{ fontSize: 12, fontWeight: 800, color: C.red, marginBottom: 10 }}>📦 Sales History — {catLabel[clDetailCat]} ({clSalesOrders.length})</div>
                                    {clSalesOrders.length === 0 ? <div style={{ color: C.muted, fontSize: 11, textAlign: "center", padding: 16 }}>No sales entries in this view</div> : (
                                        <div style={{ overflowX: "auto" }}><table style={TBL}><thead><tr>{["Date", "Bill No", "Godown", "Bottle", "Cat", "Qty", "Rate", "Total", "Mode", "Status"].map(h => <th key={h} style={THS}>{h}</th>)}</tr></thead>
                                            <tbody>{clSalesOrders.map(e => {
                                                const billCash = e.billNo ? relatedCash.filter(c => c.billNo === e.billNo).reduce((a, b) => a + Number(b.amount), 0) : 0;
                                                const billReturns = e.billNo ? clSalesReturns.filter(o => o.billNo === e.billNo).reduce((a, b) => a + Number(b.totalAmount), 0) : 0;
                                                const billTotal = e.billNo ? clSalesOrders.filter(o => o.billNo === e.billNo).reduce((a, b) => a + Number(b.totalAmount), 0) : Number(e.totalAmount);
                                                const billPending = billTotal - billReturns - billCash;
                                                const isPaid = e.settleMode === "cash" || (e.settleMode === "debtor" && e.billNo && billPending <= 0);
                                                return <tr key={e.id}><td style={TDS}>{e.date}</td><td style={{ ...TDS, fontWeight: 700, color: C.teal }}>{e.billNo || "—"}</td><td style={TDS}><Badge label={e.godown} color="#7c3aed" /></td><td style={TDS}><Badge label={e.bottleType} color="#6366f1" /></td><td style={TDS}><Badge label={e.category} color={e.category === "normal" ? C.teal : C.amber} /></td><td style={{ ...TDS, fontWeight: 700 }}>{e.qty}</td><td style={TDS}>{fc(e.ratePerUnit)}</td><td style={{ ...TDS, fontWeight: 700, color: C.red }}>{fc(e.totalAmount)}</td><td style={TDS}><Badge label={e.settleMode === "cash" ? "Cash" : e.settleMode === "debtor" ? "Debtor" : "Journal"} color={e.settleMode === "cash" ? C.green : C.violet} /></td><td style={TDS}>{isPaid ? <Badge label="Paid" color={C.green} /> : <span style={{ color: C.amber, fontSize: 10, fontWeight: 700 }}>{e.billNo ? "Due: " + fc(billPending) : "Pending"}</span>}</td></tr>;
                                            })}</tbody>
                                        </table></div>
                                    )}
                                </div>

                                {/* Sales Returns */}
                                {clSalesReturns.length > 0 && <div style={{ background: C.mid, borderRadius: 14, padding: 16, marginBottom: 16, border: "2px solid " + C.amber }}>
                                    <div style={{ fontSize: 12, fontWeight: 800, color: C.amber, marginBottom: 10 }}>↩️ Sales Returns ({clSalesReturns.length})</div>
                                    <div style={{ overflowX: "auto" }}><table style={TBL}><thead><tr>{["Date", "Bill No", "Godown", "Bottle", "Cat", "Qty", "Rate", "Return Amt"].map(h => <th key={h} style={THS}>{h}</th>)}</tr></thead>
                                        <tbody>{clSalesReturns.map(e => <tr key={e.id}><td style={TDS}>{e.date}</td><td style={{ ...TDS, fontWeight: 700, color: C.teal }}>{e.billNo || "—"}</td><td style={TDS}><Badge label={e.godown} color="#7c3aed" /></td><td style={TDS}><Badge label={e.bottleType} color="#6366f1" /></td><td style={TDS}><Badge label={e.category} color={e.category === "normal" ? C.teal : C.amber} /></td><td style={{ ...TDS, fontWeight: 700 }}>{e.qty}</td><td style={TDS}>{fc(e.ratePerUnit)}</td><td style={{ ...TDS, fontWeight: 700, color: C.amber }}>{fc(e.totalAmount)}</td></tr>)}
                                        </tbody></table>
                                    </div>
                                    <div style={{ marginTop: 8, textAlign: "right", fontSize: 11, fontWeight: 700, color: C.amber }}>Total Returned: {fc(clSalesReturns.reduce((a, b) => a + Number(b.totalAmount), 0))}</div>
                                </div>}

                                {relatedCash.length > 0 && <div style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid " + C.border }}>
                                    <div style={{ fontSize: 12, fontWeight: 800, color: C.green, marginBottom: 10 }}>💵 Payments Received ({relatedCash.length})</div>
                                    <table style={TBL}><thead><tr>{["Date", "Bill No", "Description", "Amount"].map(h => <th key={h} style={THS}>{h}</th>)}</tr></thead>
                                        <tbody>{relatedCash.map(e => <tr key={e.id}><td style={TDS}>{e.date}</td><td style={{ ...TDS, fontWeight: 700, color: C.teal }}>{e.billNo || "—"}</td><td style={TDS}>{e.description}</td><td style={{ ...TDS, fontWeight: 700, color: C.green }}>{fc(e.amount)}</td></tr>)}</tbody>
                                    </table>
                                </div>}
                            </div>;
                        }

                        /* ── List View ── */
                        /* Per-category enrichment */
                        const enrichedClients = clients.map(cl => {
                            const allO = so.filter(e => e.clientId === cl.id && !e.isReturn && (clGodownF === "All" || e.godown === clGodownF));
                            const catO = clCatView === "all" ? allO : allO.filter(e => e.category === clCatView);
                            const tQty = catO.reduce((a, b) => a + Number(b.qty), 0);
                            const tAmt = catO.reduce((a, b) => a + Number(b.totalAmount), 0);
                            const avgO = catO.length > 0 ? tAmt / catO.length : 0;
                            const lastDate = catO.length > 0 ? catO.sort((a, b) => new Date(b.date) - new Date(a.date))[0].date : "";
                            return { ...cl, allO, catO, tQty, tAmt, avgO, lastDate };
                        });

                        const totalClientRevenue = enrichedClients.reduce((a, c) => a + c.tAmt, 0);
                        const retailerCount = clients.filter(c => c.type === "Retailer").length;
                        const distributorCount = clients.filter(c => c.type === "Distributor").length;
                        const normalRevenue = so.filter(e => e.clientId && e.category === "normal" && !e.isReturn).reduce((a, b) => a + Number(b.totalAmount), 0);
                        const customRevenue = so.filter(e => e.clientId && e.category === "customized" && !e.isReturn).reduce((a, b) => a + Number(b.totalAmount), 0);

                        const filtered = enrichedClients.filter(cl => {
                            if (clTypeF !== "All" && cl.type !== clTypeF) return false;
                            if (clSearch && !cl.name.toLowerCase().includes(clSearch.toLowerCase()) && !(cl.phone || "").includes(clSearch)) return false;

                            const hasCustomized = cl.allO.some(o => o.category === "customized");
                            const hasNormal = cl.allO.some(o => o.category === "normal");

                            if (clCatView === "customized" && !hasCustomized) return false;
                            if (clCatView === "normal" && !hasNormal && cl.allO.length > 0) return false;
                            if (clGodownF !== "All" && cl.allO.length === 0) return false;

                            return true;
                        }).sort((a, b) => {
                            let av = a[clSort], bv = b[clSort];
                            if (clSort === "lastDate") { av = av || ""; bv = bv || ""; }
                            if (clSort === "tAmt" || clSort === "tQty" || clSort === "avgO") return (bv - av) * clSortDir;
                            return String(av).localeCompare(String(bv)) * clSortDir;
                        });

                        const hasFilter = clTypeF !== "All" || clSearch || clGodownF !== "All";
                        const viewColor = clCatView === "normal" ? C.teal : clCatView === "customized" ? C.amber : C.purple;

                        return <div>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                                <div style={{ fontSize: 16, fontWeight: 800, color: C.teal }}>👥 Clients</div>
                                {isAdmin && <button style={BTNP()} onClick={() => openM("addClient")}>+ Add Client</button>}
                            </div>

                            {/* Normal / Customized main toggle */}
                            <div style={{ display: "flex", gap: 0, marginBottom: 16, background: C.mid, borderRadius: 12, padding: 5, border: "1px solid " + C.border }}>
                                {[["normal", "🏷 Normal Clients", C.teal], ["customized", "✨ Customized Clients", C.amber]].map(([v, l, col]) => (
                                    <button key={v} onClick={() => setClCatView(v)} style={{ flex: 1, padding: "10px 8px", border: "none", borderRadius: 8, background: clCatView === v ? col + "22" : "transparent", color: clCatView === v ? col : C.muted, fontWeight: clCatView === v ? 800 : 500, fontSize: 12, cursor: "pointer", outline: clCatView === v ? "2px solid " + col : "none", transition: "all .15s" }}>
                                        {l}
                                        <div style={{ fontSize: 9, opacity: 0.8, marginTop: 2 }}>{v === "normal" ? fc(normalRevenue) + " revenue" : fc(customRevenue) + " revenue"}</div>
                                    </button>
                                ))}
                            </div>

                            {/* Summary Cards */}
                            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 16 }}>
                                {[["Total Clients", clients.length, "#6366f1,#8b5cf6"], ["Retailers", retailerCount, "#14b8a6,#0d9488"], ["Distributors", distributorCount, "#f59e0b,#d97706"], [clCatView === "normal" ? "Normal Revenue" : "Custom Revenue", fc(totalClientRevenue), clCatView === "normal" ? "#14b8a6,#0d9488" : "#f59e0b,#d97706"]].map(([l, v, g]) => (
                                    <div key={l} style={CARD(g)}><div style={{ fontSize: 9 }}>{l}</div><div style={{ fontSize: 13, fontWeight: 900 }}>{v}</div></div>
                                ))}
                            </div>

                            {/* Filter Bar */}
                            <div style={{ background: C.mid, borderRadius: 12, padding: 14, marginBottom: 14, border: "1px solid " + C.border }}>
                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                                    <div style={{ fontSize: 11, fontWeight: 700, color: C.muted }}>🔍 FILTERS</div>
                                    {hasFilter && <button onClick={() => { setClSearch(""); setClTypeF("All"); setClGodownF("All"); }} style={{ ...BTNP("#ef4444"), padding: "4px 12px", fontSize: 10 }}>✕ Clear</button>}
                                </div>
                                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
                                    <div style={{ display: "flex", flexDirection: "column", gap: 3, flex: 1, minWidth: 160 }}>
                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 600, textTransform: "uppercase" }}>Search Name / Phone</label>
                                        <input type="text" placeholder="Search…" style={{ ...INP, marginBottom: 0, border: clSearch ? "1.5px solid " + viewColor : "1.5px solid " + C.border }} value={clSearch} onChange={e => setClSearch(e.target.value)} />
                                    </div>
                                    <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 600, textTransform: "uppercase" }}>Type</label>
                                        <select style={{ ...INP, width: "auto", marginBottom: 0, minWidth: 120, border: clTypeF !== "All" ? "1.5px solid " + viewColor : "1.5px solid " + C.border }} value={clTypeF} onChange={e => setClTypeF(e.target.value)}>
                                            {["All", "Retailer", "Distributor"].map(o => <option key={o}>{o}</option>)}
                                        </select>
                                    </div>
                                    <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 600, textTransform: "uppercase" }}>Godown</label>
                                        <select style={{ ...INP, width: "auto", marginBottom: 0, minWidth: 120, border: clGodownF !== "All" ? "1.5px solid " + viewColor : "1.5px solid " + C.border }} value={clGodownF} onChange={e => setClGodownF(e.target.value)}>
                                            <option value="All">All Godowns</option>
                                            {GODOWNS.map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                    </div>
                                    <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 600, textTransform: "uppercase" }}>Sort By</label>
                                        <select style={{ ...INP, width: "auto", marginBottom: 0, minWidth: 130 }} value={clSort} onChange={e => { setClSort(e.target.value); setClSortDir(1); }}>
                                            {[["name", "Name"], ["tAmt", "Revenue"], ["tQty", "Total Qty"], ["avgO", "Avg Order"], ["lastDate", "Last Order"]].map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={() => setClSortDir(d => d * -1)} style={{ ...BTNP(C.mid), border: "1px solid " + C.border, color: C.muted, padding: "8px 14px", fontSize: 12 }}>{clSortDir === 1 ? "▲ Asc" : "▼ Desc"}</button>
                                </div>
                                {hasFilter && <div style={{ marginTop: 8, fontSize: 10, color: viewColor }}>📋 Showing {filtered.length} of {clients.length} client(s)</div>}
                            </div>

                            {clients.length === 0 ? <div style={{ background: C.mid, borderRadius: 12, padding: 32, textAlign: "center", color: C.muted }}>
                                <div style={{ fontSize: 28, marginBottom: 8 }}>👥</div>
                                <div style={{ fontSize: 13, fontWeight: 600 }}>No clients yet</div>
                                <div style={{ fontSize: 11, marginTop: 4 }}>Link a client when adding Stock Out, or add one manually</div>
                            </div> : filtered.length === 0 ? <div style={{ background: C.mid, borderRadius: 12, padding: 32, textAlign: "center", color: C.muted }}>
                                <div style={{ fontSize: 24, marginBottom: 8 }}>🔍</div>
                                <div style={{ fontSize: 13, fontWeight: 600 }}>No clients match your filters</div>
                                <div style={{ fontSize: 11, marginTop: 4, cursor: "pointer", color: viewColor }} onClick={() => { setClSearch(""); setClTypeF("All"); setClGodownF("All"); }}>Clear filters</div>
                            </div> : (
                                <div style={{ background: C.mid, borderRadius: 12, overflowX: "auto", border: "1px solid " + C.border }}>
                                    <table style={TBL}><thead><tr>
                                        {[["name", "Name"], ["type", "Type"], ["date", "Since"], ["phone", "Phone"], ["catO.length", "Orders"], ["tQty", "Qty"], ["tAmt", "Revenue"], ["avgO", "Avg Order"], ["lastDate", "Last Order"], [null, "Actions"]].map(([col, h]) => (
                                            <th key={h} style={{ ...THS, cursor: col ? "pointer" : "default", userSelect: "none", color: clSort === col ? viewColor : "#94a3b8" }} onClick={() => col && toggleSort(col)}>{h}{col ? sortArrow(col) : ""}</th>
                                        ))}
                                    </tr></thead>
                                        <tbody>{filtered.map(cl => (
                                            <tr key={cl.id} style={{ cursor: "pointer" }} onClick={() => { setClDetailCat(clCatView); setSelectedClient(cl.id); }}>
                                                <td style={{ ...TDS, fontWeight: 700, color: "#818cf8" }}>{cl.name}</td>
                                                <td style={TDS}><Badge label={cl.type} color={cl.type === "Retailer" ? C.teal : C.amber} /></td>
                                                <td style={TDS}>{cl.date}</td>
                                                <td style={TDS}>{cl.phone || "—"}</td>
                                                <td style={{ ...TDS, fontWeight: 700 }}>{cl.catO.length}<span style={{ color: C.muted, fontSize: 9, marginLeft: 3 }}>/{cl.allO.length}</span></td>
                                                <td style={TDS}>{cl.tQty}</td>
                                                <td style={{ ...TDS, fontWeight: 700, color: viewColor }}>{fc(cl.tAmt)}</td>
                                                <td style={TDS}>{fc(cl.avgO)}</td>
                                                <td style={TDS}>{cl.lastDate || "—"}</td>
                                                <td style={TDS}><button style={BTND} onClick={ev => { ev.stopPropagation(); cascadeDelete("clients", cl.id); }}>Del</button></td>
                                            </tr>
                                        ))}</tbody>
                                    </table>
                                </div>
                            )}
                        </div>;
                    })()}


                    {tab === "Balance Sheet" && <div>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                            <div style={{ fontSize: 16, fontWeight: 800, color: C.blue }}>🏛️ Balance Sheet</div>
                            {isAdmin && <button style={BTNP()} onClick={() => openM("bs")}>+ Manual Entry</button>}
                        </div>
                        <div style={{ background: "#0a1628", borderRadius: 10, padding: "10px 14px", marginBottom: 12, border: "1px solid #334155", fontSize: 10, color: "#64748b" }}>
                            <strong style={{ color: "#94a3b8" }}>ℹ️ Auto-populated items (read-only):</strong> Cash Balance, Closing Stock (FIFO), Trade Debtors, Accum. Depreciation, Trade Creditors, Net Profit/Loss — these are derived from other modules and <em>cannot be entered here</em>. Use <strong style={{ color: "#94a3b8" }}>+ Manual Entry</strong> for items like Fixed Assets, Share Capital, Long-term Loans, etc. Balance Sheet entries do <em>not</em> affect P&L.
                        </div>
                        {(() => {
                            // Detect creditors with non-zero opening balance (creates liability without matching asset)
                            const credsWithOpening = creds.filter(c => Number(c.amount || 0) > 0);
                            // Detect dangling cash entries — linkedId points to a party that no longer exists
                            const allPartyIds = new Set([...creds.map(c => c.id), ...debs.map(d => d.id)]);
                            const danglingCash = cash.filter(e => e.linkedId && !allPartyIds.has(e.linkedId));
                            return (<>
                                {Math.abs(rawBsDiff) > 0.01
                                    ? <div style={{ background: "#0f1f0f", borderRadius: 10, padding: 12, marginBottom: 12, border: "1.5px solid #22c55e" }}>
                                        <div style={{ fontWeight: 800, color: C.green, fontSize: 12 }}>✅ Balance Sheet AUTO-RECONCILED — Now Balanced</div>
                                        <div style={{ fontSize: 10, color: "#86efac", marginTop: 6, lineHeight: "1.7" }}>
                                            <strong>Raw difference detected: {fabs(rawBsDiff)}</strong> — automatically resolved without changing any entries.<br />
                                            {credsOpeningOffset > 0.01 && <><strong>Step 1:</strong> Creditor opening balances ({fc(credsOpeningOffset)}) matched with an auto "Opening Capital" asset entry.<br /></>}
                                            {(bsAdjToLiab > 0.01 || (diffAfterCredsAdj < -0.01 && -diffAfterCredsAdj > 0.01)) && <><strong>Step 2:</strong> Residual difference ({fc(bsAdjToLiab || -diffAfterCredsAdj)}) placed in "Opening Balance Adjustment" line on the {bsAdjToLiab > 0.01 ? "Liabilities" : "Assets"} side.<br /></>}
                                            <span style={{ color: "#fbbf24" }}>💡 To permanently resolve: review your Trading A/C for duplicate raw material entries, or check for Journal-Only entries without a matching opposite entry. See the 5 causes listed below if you re-enable the mismatch view.</span>
                                        </div>
                                    </div>

                                {credsWithOpening.length > 0 && (

                                        <strong style={{ color: "#f87171" }}>⚠️ Orphaned Cash Entries Detected</strong><br />
                                        {danglingCash.length} cash book entry/entries reference a Creditor or Debtor that has been deleted. This distorts the Cash Balance on the Balance Sheet.<br />
                                        <span style={{ color: "#fda4af", display: "block", marginTop: 4 }}>Entries: {danglingCash.map(e => `"${e.description}" (${fc(e.amount)}, ${e.date})`).join(" | ")}</span>
                                        <span style={{ color: "#fda4af", display: "block", marginTop: 4 }}>Fix: Go to <strong>Cash Book</strong> tab and delete these entries, or re-add the missing Creditor/Debtor in their respective tabs.</span>

                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                            {["liabilities", "assets"].map(side => {
                                const color = side === "assets" ? C.blue : C.amber;
                                const entries = side === "assets" ? Object.values(state.balanceSheet?.assets || {}) : bsManualLiabRaw;
                                const autoItems = [];
                                if (side === "assets") {
                                    if (cashBal !== 0) autoItems.push({ sub: "Cash and Cash Equivalents", label: "Cash Balance", val: cashBal, c: C.green });

                                    if (totalDebtors > 0) autoItems.push({ sub: "Trade Receivables", label: "Trade Debtors", val: totalDebtors, c: C.violet });
                                    if (totalDepreciation > 0) autoItems.push({ sub: "Fixed Assets", label: "Less: Accum. Depr", val: -totalDepreciation, c: C.red });
                                    if (gstItcReceivable > 0) autoItems.push({ sub: "Other Current Assets", label: "GST Input Tax Credit (ITC Receivable)", val: gstItcReceivable, c: C.teal });
                                    // Auto-reconciliation items (display only, not stored)
                                    if (credsOpeningOffset > 0.01) autoItems.push({ sub: "Other Current Assets", label: `Opening Capital / Pre-System Purchases (Auto — matches creditor opening balances of ${fc(credsOpeningOffset)})`, val: credsOpeningOffset, c: C.muted });
                                    const residualAssetAdj = diffAfterCredsAdj < -0.01 ? -diffAfterCredsAdj : 0;
                                    if (residualAssetAdj > 0.01) autoItems.push({ sub: "Other Current Assets", label: `Opening Balance Adjustment — Auto Reconciled (${fc(residualAssetAdj)})`, val: residualAssetAdj, c: C.muted });
                                } else {
                                    if (totalCreditors > 0) autoItems.push({ sub: "Trade Payables", label: "Trade Creditors", val: totalCreditors, c: C.amber });
                                    if (outstandingInterestLiab > 0) autoItems.push({ sub: "Other Current Liabilities", label: "Interest Outstanding on Loans", val: outstandingInterestLiab, c: C.amber });
                                    if (totalGstPayable > 0) autoItems.push({ sub: "Other Current Liabilities", label: "GST Duties & Taxes (Payable)", val: totalGstPayable, c: C.amber });
                                    autoItems.push({ sub: "Retained Earnings / Net Profit", label: netPL >= 0 ? "Net Profit (auto)" : "Net Loss (auto)", val: netPL, c: netPL >= 0 ? C.green : C.red });
                                    // Auto-reconciliation items (display only, not stored)
                                    if (bsAdjToLiab > 0.01) autoItems.push({ sub: "Retained Earnings / Net Profit", label: `Opening Balance Adjustment — Auto Reconciled (${fc(bsAdjToLiab)})`, val: bsAdjToLiab, c: C.muted });
                                }
                                const groupTotals = {};
                                Object.entries(SCHEDULE3[side]).forEach(([grp, subs]) => {
                                    let t = entries.filter(e => e.category === grp).reduce((a, b) => a + Number(b.amount), 0);
                                    autoItems.forEach(ai => { if (subs.includes(ai.sub)) t += ai.val; });
                                    groupTotals[grp] = t;
                                });
                                const grand = Object.values(groupTotals).reduce((a, b) => a + b, 0);
                                return (<div key={side} style={{ background: C.mid, borderRadius: 12, padding: 16 }}>
                                    <div style={{ fontWeight: 800, color, marginBottom: 12, fontSize: 13 }}>{side === "assets" ? "ASSETS" : "LIABILITIES & EQUITY"}</div>
                                    {Object.entries(SCHEDULE3[side]).map(([grp, subs]) => (
                                        <div key={grp} style={{ marginBottom: 12 }}>
                                            <div style={{ fontWeight: 800, color, fontSize: 12, marginBottom: 6, borderBottom: "1px solid #334155", paddingBottom: 4 }}>{grp}</div>

                                                const autoSub = autoItems.filter(a => a.sub === sub);
                                                const subTotal = subE.reduce((a, b) => a + Number(b.amount), 0) + autoSub.reduce((a, b) => a + b.val, 0);

                                                return (<div key={sub} style={{ marginBottom: 5 }}>
                                                    <div style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, marginBottom: 2, paddingLeft: 4 }}>{sub}</div>

                                                            const repaid = loanPrincipalPaid(e.id);
                                                            const original = Number(e.amount) + repaid;
                                                            return (
                                                                <div key={e.id} style={{ marginBottom: 6, paddingLeft: 12, width: "100%" }}>
                                                                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.text, alignItems: "center" }}>

                                                                            {e.description}{e.interestRate ? ` (${e.interestRate}% p.a.)` : ""}

                                                                        <span style={{ display: "flex", gap: 5 }}>
                                                                            {fc(e.amount)} {repaid > 0 && <span style={{ fontSize: 9, color: C.muted }}>(Outst. of {fc(original)})</span>}
                                                                            {!e.autoFromDepr && <button style={BTND} onClick={() => delBS(side, e.id)}>✕</button>}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            );
                                                        }
                                                        return (
                                                            <div key={e.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.text, alignItems: "center", paddingLeft: 12, marginBottom: 2 }}>
                                                                <span>{e.description}</span>
                                                                <span style={{ display: "flex", gap: 5 }}>{fc(e.amount)}{!e.autoFromDepr && <button style={BTND} onClick={() => delBS(side, e.id)}>✕</button>}</span>
                                                            </div>
                                                        );
                                                    })}
                                                    {autoSub.map((a, i) => <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, paddingLeft: 12, color: a.c }}><span>{a.label} <span style={{ color: C.muted, fontSize: 9 }}>(auto)</span></span><span style={{ fontWeight: 700 }}>{fc(a.val)}</span></div>)}
                                                    {subTotal !== 0 && <div style={{ textAlign: "right", fontSize: 11, color, fontWeight: 700, paddingRight: 4, marginTop: 3 }}>Sub-total: {fc(subTotal)}</div>}
                                                </div>);
                                            })}
                                            {groupTotals[grp] !== 0 && <div style={{ textAlign: "right", fontWeight: 800, color, fontSize: 11, marginTop: 4, borderTop: "1px dashed #334155", paddingTop: 4 }}>Group Total: {fc(groupTotals[grp])}</div>}
                                        </div>
                                    ))}
                                    <div style={{ borderTop: "2px solid #334155", paddingTop: 8, fontWeight: 900, color, textAlign: "right", fontSize: 14 }}>TOTAL: {fc(grand)}</div>
                                </div>);

                        </div>
                        <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                            {[
                                ["Total Assets", fc(bsTotalAssets), "#6366f1,#8b5cf6"],
                                ["Total Liab + Equity", fc(bsTotalLiab), "#f59e0b,#d97706"],
                                Math.abs(rawBsDiff) > 0.01

                                <div key={l} style={CARD(g)}><div style={{ fontSize: 9 }}>{l}</div><div style={{ fontSize: 14, fontWeight: 900 }}>{v}</div></div>

                    {tab === "Depreciation" && <div>

                        </div>

                            {[["Gross Cost", fc(deprCostTotal), "#f59e0b,#d97706"], ["Accum. Depr", fc(totalDepreciation), "#ef4444,#dc2626"], ["Net WDV", fc(deprWDVTotal), "#22c55e,#16a34a"]].map(([l, v, g]) => (

                    {tab === "Charts" && <div>

                            {[{ title: "📥 Purchases", data: buildTSD(si, "totalAmount"), color: C.violet }, { title: "📤 Sales", data: buildTSD(so, "totalAmount"), color: C.teal }, { title: "💵 Cash In", data: buildTSD(cash.filter(e => e.dir === "in"), "amount"), color: C.green }, { title: "💸 Cash Out", data: buildTSD(cash.filter(e => e.dir === "out"), "amount"), color: C.red }].map(({ title, data, color }) => (
                                <div key={title} style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid #334155" }}>
                                    <div style={{ fontSize: 12, fontWeight: 800, color, marginBottom: 10 }}>{title}</div>
                                    <MiniChart data={data} color={color} height={90} />

                                </div>

                        </div>
                    </div>}

                    {tab === "Trial Balance" && (() => {
                        const rows = [
                            { name: "Opening Stock", dr: state.openingStock?.amount || 0, cr: 0 },
                            { name: "Purchases", dr: si.filter(x => !x.isReturn).reduce((s, e) => s + (e.totalAmount - (e.gstAmount || 0)), 0), cr: 0 },
                            { name: "Purchase Returns", dr: 0, cr: si.filter(x => x.isReturn).reduce((s, e) => s + (e.totalAmount - (e.gstAmount || 0)), 0) },
                            { name: "Sales", dr: 0, cr: so.filter(x => !x.isReturn).reduce((s, e) => s + (e.totalAmount - (e.gstAmount || 0)), 0) },
                            { name: "Sales Returns", dr: so.filter(x => x.isReturn).reduce((s, e) => s + (e.totalAmount - (e.gstAmount || 0)), 0), cr: 0 },
                            { name: "Trading Dr (Direct Exp)", dr: te.filter(x => x.side === "dr" && x.sourceType !== "rawMaterial").reduce((s, e) => s + e.amount, 0), cr: 0 },
                            { name: "Raw Material Costs", dr: rawMaterialCosts, cr: 0 },
                            { name: "Trading Cr (Direct Inc)", dr: 0, cr: te.filter(x => x.side === "cr").reduce((s, e) => s + e.amount, 0) },
                            { name: "P&L Expenses", dr: ple.filter(x => x.side === "expense").reduce((s, e) => s + Number(e.amount), 0), cr: 0 },
                            { name: "P&L Income", dr: 0, cr: ple.filter(x => x.side === "income").reduce((s, e) => s + Number(e.amount), 0) },
                            { name: "Depreciation (Expense)", dr: totalDepreciation, cr: 0 },
                            { name: "Trade Debtors", dr: totalDebtors, cr: 0 },
                            { name: "Trade Creditors", dr: 0, cr: totalCreditors },
                            { name: "Cash Balance", dr: cashBal >= 0 ? cashBal : 0, cr: cashBal < 0 ? Math.abs(cashBal) : 0 },
                            // Manual BS Assets: raw stored cost (original)
                            { name: "Manual BS Assets", dr: bsManualAssetsRaw.reduce((s, e) => s + Number(e.amount), 0), cr: 0 },
                            // Manual BS Liab & Equity: OUTSTANDING amounts (loans already net of repayments via bsManualLiabRaw)
                            { name: "Manual BS Liab & Equity (Outstanding)", dr: 0, cr: bsManualLiabRaw.reduce((s, e) => s + Number(e.amount), 0) },
                            // Loan repayments: debit row to keep Trial Balance balanced when principal has been paid back
                            // (The cash outflow for repayments is already captured in Cash Balance above)
                            (() => { const totalRepaid = Object.values(state.balanceSheet?.liabilities || {}).filter(e => e.subCategory === "Long Term Borrowings").reduce((s, e) => s + loanPrincipalPaid(e.id), 0); return totalRepaid > 0 ? { name: "Loan Principal Repaid (reduces liability)", dr: totalRepaid, cr: 0 } : null; })(),
                            { name: "Loan Interest (Expense)", dr: totalLoanInterest, cr: 0 },
                            { name: "Interest Outstanding on Loans", dr: 0, cr: outstandingInterestLiab },

                            { name: "GST Duties & Taxes (Payable)", dr: 0, cr: totalGstPayable > 0 ? totalGstPayable : 0 },

                        const totalDr = rows.reduce((acc, r) => acc + r.dr, 0);

                                <div style={{ marginTop: 12, fontSize: 10, color: C.muted, textAlign: "center" }}>Note: This is a pre-closing Trial Balance (closing stock is not included; opening stock is).</div>
                            </div>
                        </div>;
                    })()}

                    {tab === "Cash Flow" && (() => {

                        const operatingIn = sums["Sales Receipt"] + sums["Debtor Payment"] + sums["Other Income Receipt"];
                        const operatingOut = sums["Expense Payment"] + sums["Creditor Payment"] + sums["Stock Purchase Payment"] + sums["Sales Return Refund"] + (sums["Raw Material Payment"] || 0);
                        const investingIn = sums["Purchase Return Receipt"]; // Return of capital/stock
                        const investingOut = sums["Other Payment"] + (sums["Asset Down Payment"] || 0); // Usually fixed assets
                        const financingIn = sums["Capital Introduced"] + sums["Loan Received"];
                        const financingOut = sums["Loan Repayment"] + (sums["Interest on Loan Repayment"] || 0);
                        const opNet = operatingIn - operatingOut;
                        const invNet = investingIn - investingOut;
                        const finNet = financingIn - financingOut;

                        return <div>

                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Receipts from Customers (Sales & Debtors)</span><span>{fc(sums["Sales Receipt"] + sums["Debtor Payment"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Other Income Receipts</span><span>{fc(sums["Other Income Receipt"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Payments to Suppliers (Purchases, Creditors & Raw Materials)</span><span>{fc(sums["Stock Purchase Payment"] + sums["Creditor Payment"] + (sums["Raw Material Payment"] || 0))}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Operating Expense Payments</span><span>{fc(sums["Expense Payment"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Sales Return Refunds</span><span>{fc(sums["Sales Return Refund"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700, color: opNet >= 0 ? C.green : C.red, marginTop: 6, paddingTop: 4, borderTop: "1px dashed #334155" }}><span>Net Cash from Operating Activities</span><span>{fc(opNet)}</span></div>

                            <div style={{ background: C.mid, borderRadius: 12, padding: 16, border: "1px solid #334155", marginBottom: 16 }}>
                                <div style={{ fontSize: 13, fontWeight: 800, color: C.text, marginBottom: 10, borderBottom: "1px solid #334155", paddingBottom: 4 }}>Investing Activities</div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Purchase Return Receipts (Refunds)</span><span>{fc(sums["Purchase Return Receipt"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Other Payments (Fixed Assets, etc.)</span><span>{fc(sums["Other Payment"] + (sums["Asset Down Payment"] || 0))}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700, color: invNet >= 0 ? C.green : C.red, marginTop: 6, paddingTop: 4, borderTop: "1px dashed #334155" }}><span>Net Cash from Investing Activities</span><span>{fc(invNet)}</span></div>
                            </div>

                            <div style={{ background: C.mid, borderRadius: 12, padding: 16, border: "1px solid #334155", marginBottom: 16 }}>
                                <div style={{ fontSize: 13, fontWeight: 800, color: C.text, marginBottom: 10, borderBottom: "1px solid #334155", paddingBottom: 4 }}>Financing Activities</div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Capital Introduced</span><span>{fc(sums["Capital Introduced"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Loan Received</span><span>{fc(sums["Loan Received"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Loan Repayment</span><span>{fc(sums["Loan Repayment"])}</span></div>
                                {sums["Interest on Loan Repayment"] > 0 && (
                                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Interest on Loan Repayment</span><span>{fc(sums["Interest on Loan Repayment"])}</span></div>
                                )}
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700, color: finNet >= 0 ? C.green : C.red, marginTop: 6, paddingTop: 4, borderTop: "1px dashed #334155" }}><span>Net Cash from Financing Activities</span><span>{fc(finNet)}</span></div>

                            <DateInput value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />
                            <input type="number" style={INP} placeholder="Opening Balance (₹)" value={form.amount || "0"} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} />
                            <input type="number" style={INP} placeholder="Credit Period (days) *" value={form.creditPeriod || ""} onChange={e => setForm(f => ({ ...f, creditPeriod: e.target.value }))} />
                            <button style={{ ...BTNP(), width: "100%" }} onClick={() => applyCredDeb("creditor")}>Save</button>
                        </div>}

                        {modal === "debtor" && <div>
                            <div style={{ fontWeight: 800, fontSize: 15, color: C.violet, marginBottom: 12 }}>📋 Add Debtor</div>
                            <input style={INP} placeholder="Name *" value={form.name || ""} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} />
                            <DateInput value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />
                            <input type="number" style={INP} placeholder="Opening Balance (₹)" value={form.amount || "0"} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} />
                            <input type="number" style={INP} placeholder="Credit Period (days) *" value={form.creditPeriod || ""} onChange={e => setForm(f => ({ ...f, creditPeriod: e.target.value }))} />
                            <button style={{ ...BTNP(), width: "100%" }} onClick={() => applyCredDeb("debtor")}>Save</button>
                        </div>}

                        {modal === "badDebt" && <div>
                            <div style={{ fontWeight: 800, fontSize: 15, color: "#ef4444", marginBottom: 12 }}>📝 Write Off Bad Debt</div>
                            <div style={{ fontSize: 13, color: C.text, marginBottom: 12 }}>
                                Writing off outstanding balance for debtor: <strong style={{ color: C.violet }}>{form.debtorName}</strong>
                            </div>
                            <DateInput value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />
                            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
                                <span style={{ fontSize: 12, color: C.muted }}>Write-off Amount (₹) *</span>
                            </div>
                            <input type="number" style={INP} placeholder="Amount (₹) *" value={form.amount || ""} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} />
                            <input style={INP} placeholder="Description *" value={form.description || ""} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} />
                            <button style={{ ...BTNP("linear-gradient(90deg,#ef4444,#dc2626)"), width: "100%" }} onClick={applyBadDebtWriteOff}>Write Off</button>
                        </div>}

                        {modal === "cash" && <div>
                            <div style={{ fontWeight: 800, fontSize: 15, color: form.dir === "in" ? C.green : C.red, marginBottom: 12 }}>{form.dir === "in" ? "💵 Cash In" : "💸 Cash Out"}</div>
                            <DateInput value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />
                            <select style={INP} value={form.payType || ""} onChange={e => {
                                const val = e.target.value;
                                setForm(f => ({
                                    ...f,
                                    payType: val,
                                    description: val === "GST Tax Payment" ? "GST Duties & Taxes Payment to Government" : val,
                                    amount: val === "GST Tax Payment" ? String(Math.max(0, totalGstPayable)) : f.amount,
                                    linkedId: ""
                                }));
                            }}>
                                <option value="">{form.dir === "in" ? "Receipt Type" : "Payment Type"} *</option>
                                {(form.dir === "in" ? CASH_IN_TYPES : CASH_OUT_TYPES).map(t => <option key={t}>{t}</option>)}
                            </select>
                            {form.dir === "out" && form.payType === "GST Tax Payment" && (
                                <>
                                    <div style={{ fontSize: 11, color: C.teal, marginTop: 4, marginBottom: 8, background: "#042f2e", padding: "8px 12px", borderRadius: 8, border: "1px solid #14b8a6" }}>
                                        🏛️ <strong>GST Settlement:</strong> Outstanding liability is <strong>{fc(totalGstPayable)}</strong>. Paying this will settle your duties and taxes.
                                    </div>
                                    <div style={{ background: "#0f172a", borderRadius: 8, padding: 12, marginBottom: 9, border: "1px solid " + C.border, display: "grid", gap: 8 }}>
                                        <div style={{ fontSize: 11, color: C.teal, fontWeight: 700 }}>🏛️ GST Tax Payment Split</div>
                                        <div>
                                            <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>CGST Paid (₹) (Outstanding: {fc(cgstPayable)})</label>
                                            <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="CGST Paid" value={form.cgstPaid || ""} onChange={e => {
                                                const val = e.target.value;
                                                setForm(f => {
                                                    const cg = Number(val || 0);
                                                    const sg = Number(f.sgstPaid || 0);
                                                    const ig = Number(f.igstPaid || 0);
                                                    return { ...f, cgstPaid: val, amount: String(cg + sg + ig) };
                                                });
                                            }} />
                                        </div>
                                        <div>
                                            <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>SGST Paid (₹) (Outstanding: {fc(sgstPayable)})</label>
                                            <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="SGST Paid" value={form.sgstPaid || ""} onChange={e => {
                                                const val = e.target.value;
                                                setForm(f => {
                                                    const cg = Number(f.cgstPaid || 0);
                                                    const sg = Number(val || 0);
                                                    const ig = Number(f.igstPaid || 0);
                                                    return { ...f, sgstPaid: val, amount: String(cg + sg + ig) };
                                                });
                                            }} />
                                        </div>
                                        <div>
                                            <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>IGST Paid (₹) (Outstanding: {fc(igstPayable)})</label>
                                            <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="IGST Paid" value={form.igstPaid || ""} onChange={e => {
                                                const val = e.target.value;
                                                setForm(f => {
                                                    const cg = Number(f.cgstPaid || 0);
                                                    const sg = Number(f.sgstPaid || 0);
                                                    const ig = Number(val || 0);
                                                    return { ...f, igstPaid: val, amount: String(cg + sg + ig) };
                                                });
                                            }} />
                                        </div>
                                    </div>
                                </>
                            )}
                            {form.dir === "in" && form.payType === "Debtor Payment" && <select style={INP} value={form.linkedId || ""} onChange={e => { const d = debs.find(x => x.id === e.target.value); setForm(f => ({ ...f, linkedId: e.target.value, description: "Receipt from " + (d ? d.name : ""), amount: d ? String(debtorBal(d)) : f.amount })); }}>
                                <option value="">Select Debtor</option>{debs.filter(d => !d.checked).map(d => <option key={d.id} value={d.id}>{d.name} — {fc(debtorBal(d))}</option>)}
                            </select>}
                            {form.dir === "in" && form.payType === "Debtor Payment" && <input style={INP} placeholder="Bill No. (Optional)" value={form.billNo || ""} onChange={e => setForm(f => ({ ...f, billNo: e.target.value }))} />}
                            {form.dir === "out" && form.payType === "Creditor Payment" && <select style={INP} value={form.linkedId || ""} onChange={e => { const c = creds.find(x => x.id === e.target.value); setForm(f => ({ ...f, linkedId: e.target.value, description: "Payment to " + (c ? c.name : ""), amount: c ? String(creditorBal(c)) : f.amount })); }}>
                                <option value="">Select Creditor</option>{creds.filter(c => !c.checked).map(c => <option key={c.id} value={c.id}>{c.name} — {fc(creditorBal(c))}</option>)}
                            </select>}
                            {form.dir === "out" && form.payType === "Interest on Loan Repayment" && (
                                <select style={INP} value={form.linkedId || ""} onChange={e => {
                                    const loan = Object.values(state.balanceSheet?.liabilities || {}).find(x => x.id === e.target.value);
                                    const remaining = loan ? loanInterestOutstanding(loan) : 0;
                                    setForm(f => ({
                                        ...f,
                                        linkedId: e.target.value,
                                        description: "Interest Payment for " + (loan ? loan.description : ""),
                                        amount: loan ? String(remaining) : f.amount
                                    }));
                                }}>
                                    <option value="">Select Loan</option>
                                    {Object.values(state.balanceSheet?.liabilities || {})
                                        .filter(x => x.subCategory === "Long Term Borrowings" && x.interestRate)
                                        .map(loan => {
                                            const remaining = loanInterestOutstanding(loan);
                                            return (
                                                <option key={loan.id} value={loan.id}>
                                                    {loan.description} — Remaining Interest: {fc(remaining)}
                                                </option>
                                            );
                                        })
                                    }
                                </select>
                            )}
                            {form.dir === "out" && form.payType === "Loan Repayment" && (
                                <select style={INP} value={form.linkedId || ""} onChange={e => {
                                    const loan = Object.values(state.balanceSheet?.liabilities || {}).find(x => x.id === e.target.value);
                                    const remaining = loan ? loanPrincipalOutstanding(loan) : 0;
                                    setForm(f => ({
                                        ...f,
                                        linkedId: e.target.value,
                                        description: "Repayment of " + (loan ? loan.description : ""),
                                        amount: loan ? String(remaining) : f.amount
                                    }));
                                }}>
                                    <option value="">Select Loan</option>
                                    {Object.values(state.balanceSheet?.liabilities || {})
                                        .filter(x => x.subCategory === "Long Term Borrowings")
                                        .map(loan => {
                                            const remaining = loanPrincipalOutstanding(loan);
                                            return (
                                                <option key={loan.id} value={loan.id}>
                                                    {loan.description} — Remaining Principal: {fc(remaining)}
                                                </option>
                                            );
                                        })
                                    }
                                </select>
                            )}
                            <input style={INP} placeholder="Description *" value={form.description || ""} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} />
                            {form.payType !== "GST Tax Payment" && (
                                <div style={{ background: "#0a0f1e", borderRadius: 8, padding: 12, marginBottom: 9, border: "1px solid " + C.border }}>
                                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                                        <span style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700 }}>Enable GST on this entry?</span>
                                        <input type="checkbox" checked={form.enableGst === "yes"} onChange={e => setForm(f => ({ ...f, enableGst: e.target.checked ? "yes" : "no", gstRate: "18", gstType: "cgst_sgst" }))} />
                                    </div>
                                    {form.enableGst === "yes" && (<div style={{ marginTop: 8 }}>
                                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                                            <div>
                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>GST Rate (%)</label>
                                                <select style={{ ...INP, marginBottom: 0 }} value={form.gstRate || "18"} onChange={e => setForm(f => ({ ...f, gstRate: e.target.value }))}>{[0, 5, 12, 18, 28].map(r => <option key={r} value={r}>{r}%</option>)}</select>
                                            </div>
                                            <div>
                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Tax Type</label>
                                                <select style={{ ...INP, marginBottom: 0 }} value={form.gstType || "cgst_sgst"} onChange={e => setForm(f => ({ ...f, gstType: e.target.value }))}>
                                                    <option value="cgst_sgst">CGST + SGST (Local)</option>
                                                    <option value="igst">IGST (Inter-State)</option>
                                                </select>
                                            </div>
                                        </div>
                                        {form.amount && (() => {
                                            const base = Number(form.amount || 0);
                                            const rate = Number(form.gstRate || 18);
                                            const tax = Math.round(base * rate) / 100;
                                            const type = form.gstType || "cgst_sgst";
                                            if (type === "cgst_sgst") {
                                                const half = tax / 2;
                                                return <div style={{ fontSize: 11, color: C.amber, marginTop: 6 }}>
                                                    CGST ({rate / 2}%): {fc(half)} | SGST ({rate / 2}%): {fc(half)}<br />
                                                    Total GST: {fc(tax)} | Grand Total: {fc(base + tax)}
                                                </div>;
                                            } else {
                                                return <div style={{ fontSize: 11, color: C.amber, marginTop: 6 }}>
                                                    IGST ({rate}%): {fc(tax)}<br />
                                                    Total GST: {fc(tax)} | Grand Total: {fc(base + tax)}
                                                </div>;
                                            }
                                        })()}
                                    </div>)}
                                </div>
                            )}
                            <input type="number" style={INP} placeholder="Amount (Base, ex-GST) ₹" value={form.amount || ""} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} readOnly={form.payType === "GST Tax Payment"} />
                            <button style={{ ...BTNP(form.dir === "in" ? "linear-gradient(90deg,#22c55e,#16a34a)" : "linear-gradient(90deg,#ef4444,#dc2626)"), width: "100%" }} onClick={applyCash}>Save</button>
                        </div>}

                        {modal === "depr" && <div>
                            <div style={{ fontWeight: 800, fontSize: 15, color: C.amber, marginBottom: 4 }}>📉 Add Depreciation</div>
                            {Object.values(state.balanceSheet?.assets || {}).filter(a => a.subCategory === "Fixed Assets" && !a.linkedDeprId).length === 0
                                ? <div style={{ background: "#1e293b", borderRadius: 8, padding: 14, marginBottom: 12, color: C.amber, fontSize: 12, textAlign: "center" }}>No Fixed Assets found. Add one in Balance Sheet first.</div>
                                : <div>
                                    <select style={INP} value={form.bsAssetId || ""} onChange={e => setForm(f => ({ ...f, bsAssetId: e.target.value }))}>
                                        <option value="">Select Fixed Asset *</option>
                                        {Object.values(state.balanceSheet?.assets || {}).filter(a => a.subCategory === "Fixed Assets" && !a.linkedDeprId).map(a => <option key={a.id} value={a.id}>{a.description} — {fc(a.amount)}</option>)}
                                    </select>
                                    <select style={INP} value={form.method || ""} onChange={e => setForm(f => ({ ...f, method: e.target.value }))}><option value="">Method *</option>{DEPR_METHODS.map(m => <option key={m}>{m}</option>)}</select>
                                    <select style={INP} value={form.period || ""} onChange={e => setForm(f => ({ ...f, period: e.target.value }))}><option value="">Period *</option>{DEPR_PERIODS.map(p => <option key={p}>{p}</option>)}</select>
                                    <input type="number" style={INP} placeholder="Annual Depreciation Rate (%) *" value={form.depRate || ""} onChange={e => setForm(f => ({ ...f, depRate: e.target.value }))} />
                                    <button style={{ ...BTNP("linear-gradient(90deg,#f59e0b,#d97706)"), width: "100%" }} onClick={applyDepr}>Save Depreciation</button>
                                </div>}
                        </div>}

                        {modal === "addClient" && <div>
                            <div style={{ fontWeight: 800, fontSize: 15, color: C.teal, marginBottom: 12 }}>👤 Add Client</div>
                            <input style={INP} placeholder="Client Name *" value={form.name || ""} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} />
                            <select style={INP} value={form.clientType || ""} onChange={e => setForm(f => ({ ...f, clientType: e.target.value }))}>
                                <option value="">Client Type *</option>
                                {CLIENT_TYPES.map(t => <option key={t}>{t}</option>)}
                            </select>
                            <DateInput value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />
                            <input style={INP} placeholder="Phone" value={form.phone || ""} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} />
                            <input style={INP} placeholder="Address" value={form.address || ""} onChange={e => setForm(f => ({ ...f, address: e.target.value }))} />
                            <input style={INP} placeholder="GSTIN (Optional)" value={form.gstin || ""} onChange={e => setForm(f => ({ ...f, gstin: e.target.value.toUpperCase() }))} />
                            <input style={INP} placeholder="State Code (Optional)" value={form.stateCode || ""} onChange={e => setForm(f => ({ ...f, stateCode: e.target.value }))} />
                            <button style={{ ...BTNP("linear-gradient(90deg,#14b8a6,#0d9488)"), width: "100%" }} onClick={() => {
                                if (!form.name || !form.clientType) { alert("Fill name and type"); return; }
                                upd(p => ({ ...p, clients: [...(p.clients || []), { id: gid(), name: form.name, type: form.clientType, date: form.date || today(), phone: form.phone || "", address: form.address || "", gstin: form.gstin || "", stateCode: form.stateCode || "" }] })); closeM();
                            }}>Save Client</button>
                        </div>}

                        <button onClick={closeM} style={{ width: "100%", marginTop: 8, background: C.mid, color: "#94a3b8", border: "none", borderRadius: 7, padding: "7px 0", cursor: "pointer", fontSize: 12 }}>Cancel</button>
                    </div>
                </div>}

                {loanPopup && (
                    <div onClick={() => {
                        setForm(f => ({ ...f, subCategory: "", isLoan: false, interestRate: "" }));
                        setLoanPopup(false);
                    }} style={{ position: "fixed", inset: 0, background: "#000000d0", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 300, overflowY: "auto" }}>
                        <div onClick={e => e.stopPropagation()} style={{ background: C.mid, border: "1.5px solid " + C.blue, borderRadius: 16, padding: 24, width: 400, maxWidth: "95vw", boxShadow: "0 10px 30px rgba(0,0,0,0.6)", margin: "20px auto" }}>
                            <div style={{ fontWeight: 800, fontSize: 15, color: C.blue, marginBottom: 6, display: "flex", alignItems: "center", gap: 6 }}>
                                🏦 Configure Loan Details
                            </div>
                            <div style={{ fontSize: 11, color: C.muted, marginBottom: 14, borderBottom: "1px solid #334155", paddingBottom: 10 }}>
                                Fill in all loan parameters. Interest expense will be auto-accrued monthly from the start date in P&amp;L.
                            </div>

                            {/* Row 1: Loan Amount */}
                            <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Loan / Principal Amount (₹) *</label>
                            <input type="number" style={INP} placeholder="e.g. 500000" value={form.amount || ""} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} />

                            {/* Row 2: Loan Type */}
                            <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Loan Type</label>
                            <select style={INP} value={form.loanType || "Term Loan"} onChange={e => setForm(f => ({ ...f, loanType: e.target.value }))}>
                                {["Term Loan", "Vehicle Loan", "Home Loan", "Business Loan", "Machinery Loan", "Equipment Finance", "Overdraft", "Personal Loan", "Other"].map(t => <option key={t}>{t}</option>)}
                            </select>

                            {/* Row 3: Interest Rate & Tenure side-by-side */}
                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                                <div>
                                    <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Interest Rate (% p.a.) *</label>
                                    <input type="number" step="0.01" style={{ ...INP, marginBottom: 0 }} placeholder="e.g. 10.5" value={form.interestRate || ""} onChange={e => setForm(f => ({ ...f, interestRate: e.target.value }))} />
                                </div>
                                <div>
                                    <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Tenure (Months)</label>
                                    <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="e.g. 60" value={form.loanTenureMonths || ""} onChange={e => setForm(f => ({ ...f, loanTenureMonths: e.target.value }))} />
                                </div>
                            </div>
                            <div style={{ height: 9 }} />

                            {/* Row 4: Repayment Type & Grace Period */}
                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                                <div>
                                    <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Repayment Schedule</label>
                                    <select style={{ ...INP, marginBottom: 0 }} value={form.repaymentType || "EMI"} onChange={e => setForm(f => ({ ...f, repaymentType: e.target.value }))}>
                                        {["EMI", "Bullet (Lump-Sum)", "Interest Only", "Reducing Balance", "Flexible"].map(t => <option key={t}>{t}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Grace Period (Months)</label>
                                    <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="e.g. 3" value={form.gracePeriodMonths || ""} onChange={e => setForm(f => ({ ...f, gracePeriodMonths: e.target.value }))} />
                                </div>
                            </div>
                            <div style={{ height: 9 }} />

                            {/* Loan Start Date */}
                            <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, textTransform: "uppercase" }}>Loan Start Date *</label>
                            <DateInput value={form.date} onChange={v => setForm(f => ({ ...f, date: v }))} />

                            {/* Live EMI Preview */}
                            {(() => {
                                const p = Number(form.amount || 0);
                                const r = Number(form.interestRate || 0) / 1200;
                                const n = Number(form.loanTenureMonths || 0);
                                const emi = (p && r && n) ? (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1) : 0;
                                const totalPay = emi * n;
                                const totalInt = totalPay - p;
                                if (!p || !r || !n) return null;
                                return (
                                    <div style={{ background: "#0a0f1e", borderRadius: 8, padding: 12, marginBottom: 12, border: "1px solid #1e3a5f" }}>
                                        <div style={{ fontSize: 10, fontWeight: 800, color: C.blue, marginBottom: 8 }}>📊 Loan Preview ({form.repaymentType || "EMI"})</div>
                                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, fontSize: 11 }}>
                                            <span style={{ color: C.muted }}>Principal</span><span style={{ color: C.text, fontWeight: 700 }}>{fc(p)}</span>
                                            {emi > 0 && <><span style={{ color: C.muted }}>Monthly EMI</span><span style={{ color: C.green, fontWeight: 700 }}>{fc(emi)}</span></>}
                                            <span style={{ color: C.muted }}>Total Interest</span><span style={{ color: C.amber, fontWeight: 700 }}>{fc(totalInt)}</span>
                                            <span style={{ color: C.muted }}>Total Repayment</span><span style={{ color: C.red, fontWeight: 700 }}>{fc(totalPay)}</span>
                                        </div>
                                    </div>
                                );
                            })()}

                            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                                <button
                                    style={{ ...BTNP(), flex: 1 }}
                                    onClick={() => {
                                        if (!form.amount || Number(form.amount) <= 0) { alert("Please enter a valid loan amount."); return; }
                                        if (!form.interestRate || Number(form.interestRate) < 0) { alert("Please enter a valid interest rate."); return; }
                                        if (!form.date) { alert("Please enter a loan start date."); return; }
                                        setForm(f => ({ ...f, isLoan: true }));
                                        setLoanPopup(false);
                                    }}
                                >
                                    ✓ Confirm Loan
                                </button>
                                <button
                                    style={{ ...BTNP("transparent"), border: "1px solid #475569", color: "#94a3b8", flex: 1 }}
                                    onClick={() => {
                                        setForm(f => ({ ...f, subCategory: "", isLoan: false, interestRate: "" }));
                                        setLoanPopup(false);
                                    }}
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>);
        }

        // ─── Error Boundary ───────────────────────────────────
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(err) { return { hasError: true, error: err }; }
            componentDidCatch(err, info) { console.error("React ErrorBoundary caught:", err, info); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ minHeight: "100vh", background: "#0f172a", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
                            <div style={{ background: "#1e293b", border: "1.5px solid #ef4444", borderRadius: 16, padding: 32, maxWidth: 560, width: "100%" }}>
                                <div style={{ fontSize: 28, marginBottom: 12 }}>⚠️</div>
                                <div style={{ fontSize: 18, fontWeight: 800, color: "#fca5a5", marginBottom: 8 }}>Something went wrong</div>
                                <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 16, fontFamily: "monospace", background: "#0f172a", padding: 12, borderRadius: 8, wordBreak: "break-all" }}>
                                    {this.state.error && this.state.error.toString()}
                                </div>
                                <button onClick={() => { this.setState({ hasError: false, error: null }); }} style={{ background: "linear-gradient(90deg,#6366f1,#8b5cf6)", color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>Try to Recover</button>
                                <button onClick={() => window.location.reload()} style={{ background: "#334155", color: "#e2e8f0", border: "none", borderRadius: 8, padding: "10px 20px", cursor: "pointer", fontWeight: 700, fontSize: 13, marginLeft: 8 }}>Reload Page</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>

</html>
