                                                            <div>
                                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Rate/Unit (₹)</label>
                                                                <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="Rate" value={item.ratePerUnit || ""} onChange={e => updateFormItem(idx, "ratePerUnit", e.target.value)} />
                                                            </div>
                                                            <div>
                                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>GST Rate (%)</label>

                                                            </div>

                                        <div style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid " + C.border, display: "grid", gap: 8 }}>

                                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.amber }}>
                                                    <span>CGST Collected (auto):</span>
                                                    <span>{fc(gstInvForm.cgstTotal)}</span>
                                                </div>
                                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.amber }}>
                                                    <span>SGST Collected (auto):</span>
                                                    <span>{fc(gstInvForm.sgstTotal)}</span>
                                                </div>

                                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.amber }}>
                                                    <span>IGST Collected (auto):</span>

                                                </div>

                                                <span style={{ fontWeight: 900, fontSize: 14, color: C.purple }}>GRAND TOTAL:</span>
                                                <span style={{ fontWeight: 900, fontSize: 20, color: C.green }}>{fc(gstInvForm.grandTotal)}</span>
                                            </div>

                                            <button onClick={saveInvoice} style={{ ...BTNP("linear-gradient(90deg,#14b8a6,#0d9488)"), width: "100%", padding: 12, fontSize: 14, fontWeight: 800, marginTop: 10 }}>

                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>);
                        }

                        // ─── 3. DASHBOARD / LIST VIEW (DEFAULT) ───
                        const totalGstInvoiced = invoices.reduce((s, x) => s + x.grandTotal, 0);
                        const totalTaxCollected = invoices.reduce((s, x) => s + x.cgstTotal + x.sgstTotal + x.igstTotal, 0);
                        const cgstCol = invoices.reduce((s, x) => s + x.cgstTotal, 0);
                        const sgstCol = invoices.reduce((s, x) => s + x.sgstTotal, 0);
                        const igstCol = invoices.reduce((s, x) => s + x.igstTotal, 0);

                        return (<div>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                                <div style={{ fontSize: 16, fontWeight: 800, color: C.teal }}>📄 GST Tax Invoices</div>
                                {isAdmin && <button style={BTNP()} onClick={startNewInvoice}>+ Issue GST Invoice</button>}
                            </div>

                            <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 14, marginBottom: 16 }}>
                                <div style={{ background: C.mid, borderRadius: 14, padding: 14, border: "1px solid " + C.border }}>
                                    <div style={{ fontSize: 11, fontWeight: 800, color: C.teal, marginBottom: 8 }}>📄 Invoice Sales Summaries</div>
                                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                                        <div style={{ background: C.dark, padding: 10, borderRadius: 10 }}>
                                            <div style={{ fontSize: 8, color: C.muted }}>Total Invoiced</div>
                                            <div style={{ fontSize: 13, fontWeight: 900, color: C.text }}>{fc(totalGstInvoiced)}</div>
                                        </div>
                                        <div style={{ background: C.dark, padding: 10, borderRadius: 10 }}>
                                            <div style={{ fontSize: 8, color: C.muted }}>GST Tax Collected</div>
                                            <div style={{ fontSize: 13, fontWeight: 900, color: C.teal }}>{fc(totalTaxCollected)}</div>
                                        </div>
                                    </div>
                                </div>
                                <div style={{ background: C.mid, borderRadius: 14, padding: 14, border: "1px solid " + C.border }}>
                                    <div style={{ fontSize: 11, fontWeight: 800, color: C.amber, marginBottom: 8 }}>🏛️ GST Portal Tax Ledger (Head-wise Balance)</div>
                                    <div style={{ overflowX: "auto" }}>
                                        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 10, color: C.text }}>
                                            <thead>
                                                <tr style={{ borderBottom: "1px solid " + C.border, color: C.muted, textAlign: "left" }}>
                                                    <th style={{ padding: "4px 6px" }}>Tax Head</th>
                                                    <th style={{ padding: "4px 6px", textAlign: "right" }}>Output Liability (A)</th>
                                                    <th style={{ padding: "4px 6px", textAlign: "right" }}>Input ITC Claimed (B)</th>
                                                    <th style={{ padding: "4px 6px", textAlign: "right" }}>Tax Paid to Govt (C)</th>
                                                    <th style={{ padding: "4px 6px", textAlign: "right" }}>Net Payable (A-B-C)</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr style={{ borderBottom: "1px solid " + C.border }}>
                                                    <td style={{ padding: "6px", fontWeight: 700 }}>CGST</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.red }}>{fc(cgstOutput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.green }}>{fc(cgstInput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.blue }}>{fc(cgstPaid)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", fontWeight: 700, color: cgstPayable > 0 ? C.amber : C.green }}>{fc(cgstPayable)}</td>
                                                </tr>
                                                <tr style={{ borderBottom: "1px solid " + C.border }}>
                                                    <td style={{ padding: "6px", fontWeight: 700 }}>SGST</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.red }}>{fc(sgstOutput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.green }}>{fc(sgstInput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.blue }}>{fc(sgstPaid)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", fontWeight: 700, color: sgstPayable > 0 ? C.amber : C.green }}>{fc(sgstPayable)}</td>
                                                </tr>
                                                <tr style={{ borderBottom: "1px solid " + C.border }}>
                                                    <td style={{ padding: "6px", fontWeight: 700 }}>IGST</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.red }}>{fc(igstOutput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.green }}>{fc(igstInput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.blue }}>{fc(igstPaid)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", fontWeight: 700, color: igstPayable > 0 ? C.amber : C.green }}>{fc(igstPayable)}</td>
                                                </tr>
                                                <tr style={{ fontWeight: 800, background: "#0a0f1e" }}>
                                                    <td style={{ padding: "6px" }}>Total GST</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.red }}>{fc(totalGstOutput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.green }}>{fc(totalGstInput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.blue }}>{fc(totalGstPaidToGovt)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: totalGstPayable > 0 ? C.amber : C.green }}>{fc(totalGstPayable)}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <div style={{ background: C.mid, borderRadius: 12, overflowX: "auto", border: "1px solid " + C.border }}>
                                <table style={TBL}>

                                                    <td style={TDS}>{fc(inv.taxableTotal)}</td>
                                                    <td style={{ ...TDS, color: C.amber }}>{inv.cgstTotal > 0 ? fc(inv.cgstTotal) : "—"}</td>
                                                    <td style={{ ...TDS, color: C.amber }}>{inv.sgstTotal > 0 ? fc(inv.sgstTotal) : "—"}</td>
                                                    <td style={{ ...TDS, color: C.red }}>{inv.igstTotal > 0 ? fc(inv.igstTotal) : "—"}</td>
                                                    <td style={{ ...TDS, fontWeight: 800, color: C.green }}>
                                                        {fc(inv.grandTotal)}
                                                        {inv.paidAmount > 0 && inv.settleMode === "debtor" && (
                                                            <span style={{ display: "block", fontSize: 9, color: C.muted, fontWeight: 500 }}>
                                                                Paid Cash: {fc(inv.paidAmount)}

                                                        )}
                                                    </td>
                                                    <td style={TDS}>
                                                        <Badge label={inv.settleMode === "cash" ? "Cash" : "Debtor"} color={inv.settleMode === "cash" ? C.green : C.violet} />
                                                        {inv.paidAmount > 0 && inv.settleMode === "debtor" && (

                                                                Partial Cash
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td style={TDS}>
                                                        <div style={{ display: "flex", gap: 6 }}>
                                                            <button style={{ ...BTNP(), padding: "3px 8px", fontSize: 10 }} onClick={() => setSelectedGstInvoiceId(inv.id)}>👁️ View / Print</button>
                                                            <button style={BTND} onClick={() => cascadeDelete("gstInvoices", inv.id)}>Del</button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>

                            {/* ─── GST REGISTER ─── */}
                            <div style={{ marginTop: 24 }}>
                                <div style={{ fontSize: 14, fontWeight: 800, color: C.amber, marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>
                                    <span>📒</span> GST Register (Input vs Output Set-off)
                                </div>

                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 14 }}>

                                    {/* OUTPUT GST — Sales / Stock Out */}
                                    <div style={{ background: C.mid, borderRadius: 12, border: "1px solid " + C.border, overflow: "hidden" }}>
                                        <div style={{ padding: "10px 14px", background: "linear-gradient(90deg,#2d1919,#1a0a0a)", borderBottom: "1px solid " + C.border, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                            <div style={{ fontWeight: 800, fontSize: 12, color: C.red }}>📤 Output GST (Tax on Sales)</div>
                                            <div style={{ fontSize: 11, color: C.muted }}>{so.filter(x => (x.gstAmount || 0) > 0 && !x.isReturn).length} entries</div>
                                        </div>
                                        <div style={{ overflowX: "auto", maxHeight: 280, overflowY: "auto" }}>
                                            <table style={TBL}>
                                                <thead>
                                                    <tr>
                                                        {["Date", "Bill No", "Party", "Taxable (₹)", "GST (₹)", "Rate"].map(h => <th key={h} style={{ ...THS, fontSize: 9 }}>{h}</th>)}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {so.filter(x => (x.gstAmount || 0) > 0).length === 0
                                                        ? <tr><td colSpan={6} style={{ ...TDS, textAlign: "center", color: C.muted, fontSize: 11 }}>No GST-tagged sales yet</td></tr>
                                                        : so.filter(x => (x.gstAmount || 0) > 0).map((x, i) => {
                                                            const taxable = (x.totalAmount || 0) - (x.gstAmount || 0);
                                                            return (
                                                                <tr key={x.id || i} style={{ opacity: x.isReturn ? 0.6 : 1 }}>
                                                                    <td style={{ ...TDS, fontSize: 10 }}>{x.date}</td>
                                                                    <td style={{ ...TDS, fontSize: 10, color: C.teal }}>{x.billNo || x.gstInvoiceId ? (x.billNo || "INV") : "—"}</td>
                                                                    <td style={{ ...TDS, fontSize: 10 }}>{x.linkedPartyName || x.clientName || "—"}{x.isReturn ? <span style={{ color: C.amber, fontSize: 9, marginLeft: 4 }}>(Return)</span> : ""}</td>
                                                                    <td style={{ ...TDS, textAlign: "right", fontSize: 10 }}>{fc(taxable)}</td>
                                                                    <td style={{ ...TDS, textAlign: "right", fontSize: 10 }}>
                                                                        <span style={{ fontWeight: 700, color: x.isReturn ? C.green : C.red }}>{x.isReturn ? "-" : ""}{fc(x.gstAmount || 0)}</span>
                                                                        {(x.gstAmount || 0) > 0 && (() => {
                                                                            const cg = getCGST(x);
                                                                            const sg = getSGST(x);
                                                                            const ig = getIGST(x);
                                                                            if (ig > 0) return <div style={{ fontSize: 8, color: C.muted }}>IGST: {fc(ig)}</div>;
                                                                            return <div style={{ fontSize: 8, color: C.muted }}>C+S: {fc(cg)} + {fc(sg)}</div>;
                                                                        })()}
                                                                    </td>
                                                                    <td style={{ ...TDS, textAlign: "center", fontSize: 10, color: C.muted }}>{x.gstRate ? x.gstRate + "%" : "—"}</td>
                                                                </tr>
                                                            );
                                                        })
                                                    }
                                                </tbody>
                                                {so.filter(x => (x.gstAmount || 0) > 0).length > 0 && (

                                        {isAdmin && effStatus === "Accepted" && !q.convertedInvoiceId && <button onClick={() => convertQuotationToInvoice(q.id)} style={BTNP("linear-gradient(90deg,#0d9488,#0f766e)")}>🔄 Convert to Invoice</button>}
                                        {q.convertedInvoiceId && <div style={{ background:"#042f2e", border:"1px solid "+C.teal, borderRadius:8, padding:"6px 14px", fontSize:11, color:C.teal }}>↗ Converted to Invoice <strong>{q.convertedInvoiceNo}</strong></div>}
                                        <button onClick={() => window.print()} style={BTNP("linear-gradient(90deg,#0ea5e9,#0284c7)")}>🖨️ Print / PDF</button>
                                    </div>
                                </div>
                                <div id="print-area" style={{ background:"#fff", color:"#111", padding:"28px 36px", borderRadius:10, maxWidth:960, margin:"0 auto", border:"1.5px solid #b0bec5", boxShadow:"0 6px 30px rgba(0,0,0,0.12)", fontFamily:"'Inter','Segoe UI',system-ui,sans-serif", fontSize:11 }}>
                                    <div className="quo-hbar" style={{ background:"#1e3a5f", borderRadius:"6px 6px 0 0", padding:"14px 20px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                                        <div><div style={{ fontSize:22, fontWeight:900, color:"#fff", letterSpacing:1 }}>{company.name||"YORS WATER"}</div><div style={{ fontSize:10, color:"#93c5fd", marginTop:2 }}>Premium Packaged Drinking Water</div></div>
                                        <div style={{ textAlign:"right" }}><div style={{ fontSize:18, fontWeight:900, color:"#fff", letterSpacing:2 }}>QUOTATION</div><div style={{ fontSize:10, color:"#93c5fd", marginTop:2 }}>Valid Till: {q.validityDate||"—"}</div></div>
                                    </div>
                                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", border:"1px solid #000", borderTop:"3px solid #1e3a5f" }}>
                                        <div style={{ padding:"10px 14px", borderRight:"1px solid #000" }}>
                                            <div style={{ fontSize:9, color:"#1e3a5f", fontWeight:800, textTransform:"uppercase", letterSpacing:1, marginBottom:5, borderBottom:"1px solid #e2e8f0", paddingBottom:3 }}>Supplier Details</div>
                                            <div style={{ fontWeight:900, fontSize:13, marginBottom:2 }}>{company.name||"YORS WATER"}</div>
                                            <div style={{ fontSize:10, lineHeight:"1.5", color:"#374151", marginBottom:4 }}>{company.address}</div>
                                            <div style={{ display:"grid", gridTemplateColumns:"auto 1fr", gap:"2px 8px", fontSize:10 }}>
                                                {company.gstin&&<><span style={{ color:"#6b7280", fontWeight:700 }}>GSTIN</span><span style={{ fontWeight:700 }}>{company.gstin}</span></>}
                                                <span style={{ color:"#6b7280", fontWeight:700 }}>State Code</span><span>{company.stateCode}</span>
                                                {company.phone&&<><span style={{ color:"#6b7280", fontWeight:700 }}>Phone</span><span>{company.phone}</span></>}
                                            </div>
                                        </div>
                                        <div style={{ padding:"10px 14px" }}>
                                            <div style={{ fontSize:9, color:"#1e3a5f", fontWeight:800, textTransform:"uppercase", letterSpacing:1, marginBottom:5, borderBottom:"1px solid #e2e8f0", paddingBottom:3 }}>Quotation Details</div>
                                            <div style={{ display:"grid", gridTemplateColumns:"auto 1fr", gap:"4px 12px", fontSize:11 }}>
                                                <span style={{ color:"#6b7280", fontWeight:700 }}>Quotation No.</span><span style={{ fontWeight:900, color:"#1e3a5f" }}>{q.quotNo}</span>
                                                <span style={{ color:"#6b7280", fontWeight:700 }}>Date</span><span style={{ fontWeight:700 }}>{q.date}</span>
                                                <span style={{ color:"#6b7280", fontWeight:700 }}>Valid Until</span><span style={{ fontWeight:700, color:effStatus==="Expired"?"#dc2626":"#16a34a" }}>{q.validityDate||"—"}</span>
                                                <span style={{ color:"#6b7280", fontWeight:700 }}>Tax Type</span><span style={{ fontWeight:800, color:isIntra?"#0369a1":"#7c3aed" }}>{isIntra?"CGST + SGST (Intra-State)":"IGST (Inter-State)"}</span>
                                                <span style={{ color:"#6b7280", fontWeight:700 }}>Status</span><span style={{ fontWeight:800, color:STATUS_COLOR[effStatus] }}>{effStatus}</span>
                                                {q.convertedInvoiceId&&<><span style={{ color:"#6b7280", fontWeight:700 }}>Invoice Ref.</span><span style={{ fontWeight:800, color:"#0d9488" }}>{q.convertedInvoiceNo}</span></>}
                                            </div>
                                        </div>
                                    </div>
                                    <div style={{ border:"1px solid #000", borderTop:"none", padding:"10px 14px" }}>
                                        <div style={{ fontSize:9, color:"#1e3a5f", fontWeight:800, textTransform:"uppercase", letterSpacing:1, marginBottom:5, borderBottom:"1px solid #e2e8f0", paddingBottom:3 }}>Bill To (Recipient)</div>
                                        <div style={{ fontWeight:900, fontSize:13, marginBottom:3 }}>{q.clientName}</div>
                                        {q.clientAddress&&<div style={{ fontSize:10, lineHeight:"1.5", color:"#374151", marginBottom:4 }}>{q.clientAddress}</div>}
                                        <div style={{ display:"grid", gridTemplateColumns:"auto 1fr", gap:"2px 8px", fontSize:10 }}>
                                            <span style={{ color:"#6b7280", fontWeight:700 }}>GSTIN</span><span style={{ fontWeight:700 }}>{q.clientGstin||"URP — Unregistered Person"}</span>
                                            <span style={{ color:"#6b7280", fontWeight:700 }}>State Code</span><span>{q.clientStateCode}</span>
                                            {q.clientPhone&&<><span style={{ color:"#6b7280", fontWeight:700 }}>Phone</span><span>{q.clientPhone}</span></>}
                                        </div>
                                    </div>
                                    <table style={{ width:"100%", borderCollapse:"collapse", fontSize:10.5 }}>
                                        <thead><tr>
                                            {["#","Description / Item","HSN/SAC","Qty","Rate (₹)","Disc%","Taxable (₹)", isIntra?"CGST":"IGST", isIntra?"SGST":null, "Total (₹)"].filter(Boolean).map((h,i) => <th key={i} className="quo-th" style={{ ...thB, textAlign: i===0||i===2?"center":"right", textAlign: i===1?"left":"right", width: i===0?28:i===2?60:undefined }}>{h}</th>)}
                                        </tr></thead>
                                        <tbody>
                                            {(q.items||[]).map((item,i) => (
                                                <tr key={i} className={i%2===1?"quo-alt":""} style={{ background:i%2===1?"#f8fafc":"#fff" }}>
                                                    <td style={{ ...tdB, textAlign:"center", fontWeight:700 }}>{i+1}</td>
                                                    <td style={tdB}><div style={{ fontWeight:700 }}>{item.itemName||"—"}</div></td>
                                                    <td style={{ ...tdB, textAlign:"center" }}>{item.hsnCode||"—"}</td>
                                                    <td style={{ ...tdB, textAlign:"right" }}>{item.qty}</td>
                                                    <td style={{ ...tdB, textAlign:"right" }}>{fc(item.ratePerUnit||0)}</td>
                                                    <td style={{ ...tdB, textAlign:"right" }}>{item.discountPct?item.discountPct+"%":"—"}</td>
                                                    <td style={{ ...tdB, textAlign:"right" }}>{fc(item.taxableValue||0)}</td>
                                                    {isIntra ? <>
                                                        <td style={{ ...tdB, textAlign:"right" }}>{item.cgstRate}% | {fc(item.cgstAmount||0)}</td>
                                                        <td style={{ ...tdB, textAlign:"right" }}>{item.sgstRate}% | {fc(item.sgstAmount||0)}</td>
                                                    </> : <td style={{ ...tdB, textAlign:"right" }}>{item.igstRate}% | {fc(item.igstAmount||0)}</td>}
                                                    <td style={{ ...tdB, textAlign:"right", fontWeight:800 }}>{fc(item.totalAmount||0)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <div style={{ display:"grid", gridTemplateColumns:"1.5fr 1fr", border:"1px solid #000", borderTop:"none" }}>
                                        <div style={{ padding:"10px 14px", borderRight:"1px solid #000" }}>
                                            <div style={{ fontSize:9, fontWeight:800, color:"#1e3a5f", marginBottom:6 }}>Amount in Words</div>
                                            <div style={{ fontSize:10, fontStyle:"italic", color:"#374151" }}>{qNumToWords(q.grandTotal||0)}</div>
                                            {q.notes&&<div style={{ marginTop:8, fontSize:9, color:"#374151" }}><strong>Notes:</strong> {q.notes}</div>}
                                        </div>
                                        <div style={{ padding:"10px 14px" }}>
                                            {[["Taxable Amount", q.taxableTotal||0], ...(isIntra?[["CGST",q.cgstTotal||0],["SGST",q.sgstTotal||0]]:[["IGST",q.igstTotal||0]])].map(([l,v]) => (
                                                <div key={l} style={{ display:"flex", justifyContent:"space-between", fontSize:11, marginBottom:4 }}><span style={{ color:"#6b7280" }}>{l}</span><span style={{ fontWeight:700 }}>{fc(v)}</span></div>
                                            ))}
                                            <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, fontWeight:900, background:"#1e3a5f", color:"#fff", padding:"7px 10px", borderRadius:5, marginTop:6 }}><span>GRAND TOTAL</span><span>{fc(q.grandTotal||0)}</span></div>
                                        </div>
                                    </div>
                                    <div style={{ display:"grid", gridTemplateColumns:"1.5fr 1fr", border:"1px solid #000", borderTop:"none" }}>
                                        <div style={{ padding:"10px 14px", borderRight:"1px solid #000" }}>
                                            <div style={{ fontSize:9, fontWeight:800, color:"#1e3a5f", marginBottom:5 }}>Terms &amp; Conditions</div>
                                            <div style={{ fontSize:9.5, color:"#374151", lineHeight:"1.6", whiteSpace:"pre-line" }}>{q.terms||"—"}</div>
                                        </div>
                                        <div style={{ padding:"10px 14px", textAlign:"center", fontSize:10 }}>
                                            <div style={{ fontWeight:700, marginBottom:2 }}>For <strong>{company.name||"YORS WATER"}</strong></div>
                                            <div style={{ height:40, borderBottom:"1px solid #000", margin:"8px 20px" }}></div>
                                            <div style={{ fontSize:9.5, color:"#6b7280" }}>Authorised Signatory &amp; Seal</div>
                                        </div>
                                    </div>
                                    <div style={{ marginTop:10, textAlign:"center", fontSize:9, color:"#94a3b8", borderTop:"1px dashed #e2e8f0", paddingTop:6 }}>This is a computer-generated quotation. | Generated by Yors Finance Accounting Suite | {new Date().toLocaleString("en-IN")}</div>
                                </div>
                            </div>);
                        }

                        // \u2550\u2550\u2550\u2550\u2550\u2550\u2550 VIEW C: CREATE / EDIT FORM \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
                        if (showCreateQuotation) {
                            const isEditing = !!editQuotationId;
                            return (<div>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
                                    <div style={{ fontSize:16, fontWeight:800, color:C.teal }}>📋 {isEditing?"Edit Quotation":"New Quotation"}</div>
                                    <button onClick={() => { setShowCreateQuotation(false); setEditQuotationId(null); }} style={{ ...BTNP(C.mid), border:"1px solid "+C.border, color:C.muted }}>Cancel</button>
                                </div>
                                <div style={{ display:"grid", gridTemplateColumns:"1fr 1.8fr", gap:16, alignItems:"start" }}>
                                    {/* Left panel */}
                                    <div style={{ background:C.mid, borderRadius:14, padding:16, border:"1px solid "+C.border }}>
                                        <div style={{ fontWeight:800, fontSize:13, color:C.teal, marginBottom:12, borderBottom:"1px solid #334155", paddingBottom:6 }}>📋 Quotation Details</div>
                                        <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:4 }}>Quotation No. *</label>
                                        <input style={INP} value={quotForm.quotNo} onChange={e => setQuotForm(p => ({ ...p, quotNo: e.target.value }))} />
                                        <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:4 }}>Date *</label>
                                        <DateInput value={quotForm.date} onChange={v => setQuotForm(p => ({ ...p, date: v }))} />
                                        <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:4 }}>Valid Until *</label>
                                        <DateInput value={quotForm.validityDate} onChange={v => setQuotForm(p => ({ ...p, validityDate: v }))} />
                                        <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:4 }}>GST Tax Type *</label>
                                        <select style={INP} value={quotForm.gstType||"cgst_sgst"} onChange={e => setQuotForm(p => { const t = e.target.value; const rec = recalcGSTTotals(p.items, t); return { ...p, gstType:t, ...rec }; })}>
                                            <option value="cgst_sgst">CGST + SGST (Intra-State)</option>
                                            <option value="igst">IGST (Inter-State)</option>
                                            <option value="non_gst">Non-GST Quotation (0% Tax)</option>
                                        </select>
                                        <div style={{ fontWeight:800, fontSize:13, color:C.blue, margin:"14px 0 12px 0", borderBottom:"1px solid #334155", paddingBottom:6 }}>👤 Client (Recipient)</div>
                                        <select style={INP} value={quotForm.clientId} onChange={e => handleQuotClientSelect(e.target.value)}>
                                            <option value="">Select Client *</option>
                                            {(state.clients||[]).map(c => <option key={c.id} value={c.id}>{c.name} ({c.type})</option>)}
                                            <option value="__new__">+ Create New Client</option>
                                        </select>
                                        {quotForm.clientId === "__new__" ? (
                                            <div>
                                                <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:3 }}>Client Name *</label>
                                                <input style={INP} placeholder="Client Name *" value={quotForm.newClientName||""} onChange={e => setQuotForm(p => ({ ...p, newClientName:e.target.value }))} />
                                                <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:3 }}>GSTIN (Optional)</label>
                                                <input style={INP} placeholder="GSTIN" value={quotForm.newClientGstin||""} onChange={e => setQuotForm(p => ({ ...p, newClientGstin:e.target.value.toUpperCase() }))} />
                                                <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:3 }}>State Code *</label>
                                                <input style={INP} placeholder="e.g. 19" value={quotForm.newClientStateCode||""} onChange={e => { const v=e.target.value; setQuotForm(p => { const gt=String(v).trim()===String(company.stateCode||"19").trim()?"cgst_sgst":"igst"; const next={...p,newClientStateCode:v,clientStateCode:v,gstType:gt}; const rec=recalcGSTTotals(next.items,gt); return {...next,...rec}; }); }} />
                                                <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:3 }}>Address</label>
                                                <input style={INP} placeholder="Address" value={quotForm.newClientAddress||""} onChange={e => setQuotForm(p => ({ ...p, newClientAddress:e.target.value }))} />
                                                <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:3 }}>Phone</label>
                                                <input style={INP} placeholder="Phone" value={quotForm.newClientPhone||""} onChange={e => setQuotForm(p => ({ ...p, newClientPhone:e.target.value }))} />
                                            </div>
                                        ) : quotForm.clientId ? (
                                            <div style={{ background:"#0a0f1e", borderRadius:8, padding:10, border:"1px solid "+C.border, fontSize:11, display:"grid", gap:3 }}>
                                                <div><strong>GSTIN:</strong> {quotForm.clientGstin||"URP (Unregistered)"}</div>
                                                <div><strong>State:</strong> {quotForm.clientStateCode} | <strong>Tax:</strong> {quotForm.gstType==="igst"?"IGST":"CGST+SGST"}</div>
                                                {quotForm.clientAddress&&<div><strong>Address:</strong> {quotForm.clientAddress}</div>}
                                            </div>
                                        ) : null}
                                        <div style={{ fontWeight:800, fontSize:13, color:C.amber, margin:"14px 0 12px 0", borderBottom:"1px solid #334155", paddingBottom:6 }}>📝 Notes &amp; Terms</div>
                                        <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:4 }}>Notes</label>
                                        <textarea style={{ ...INP, height:55, resize:"vertical" }} placeholder="Optional notes" value={quotForm.notes||""} onChange={e => setQuotForm(p => ({ ...p, notes:e.target.value }))} />
                                        <label style={{ fontSize:11, color:"#94a3b8", fontWeight:700, display:"block", marginBottom:4 }}>Terms &amp; Conditions</label>
                                        <textarea style={{ ...INP, height:80, resize:"vertical" }} placeholder="Terms and conditions" value={quotForm.terms||""} onChange={e => setQuotForm(p => ({ ...p, terms:e.target.value }))} />
                                    </div>
                                    {/* Right panel */}
                                    <div>
                                        <div style={{ background:C.mid, borderRadius:14, padding:16, border:"1px solid "+C.border, marginBottom:14 }}>
                                            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, borderBottom:"1px solid #334155", paddingBottom:6 }}>
                                                <div style={{ fontWeight:800, fontSize:13, color:C.violet }}>📦 Line Items</div>
                                                <button onClick={addQuotItem} style={BTNP("linear-gradient(90deg,#7c3aed,#6366f1)")}>+ Add Item</button>
                                            </div>
                                            {quotForm.items.length === 0 ? (
                                                <div style={{ textAlign:"center", color:C.muted, padding:20, fontSize:12 }}>No items yet. Click "+ Add Item" to start.</div>
                                            ) : (
                                                <div style={{ overflowX:"auto" }}>
                                                    <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
                                                        <thead><tr>{["Item / Description","HSN/SAC","Qty","Rate ₹","Disc%","GST%","Taxable","Tax Amt","Total",""].map(h => <th key={h} style={THS}>{h}</th>)}</tr></thead>
                                                        <tbody>
                                                            {quotForm.items.map((item,idx) => (
                                                                <tr key={idx}>
                                                                    <td style={TDS}><input style={{ ...INP, marginBottom:0, minWidth:130 }} placeholder="Item name *" value={item.itemName||""} onChange={e => updateQuotItem(idx,"itemName",e.target.value)} /></td>
                                                                    <td style={TDS}><input style={{ ...INP, marginBottom:0, width:65 }} placeholder="HSN/SAC" value={item.hsnCode||""} onChange={e => updateQuotItem(idx,"hsnCode",e.target.value)} /></td>
                                                                    <td style={TDS}><input type="number" style={{ ...INP, marginBottom:0, width:60 }} value={item.qty} onChange={e => updateQuotItem(idx,"qty",e.target.value)} /></td>
                                                                    <td style={TDS}><input type="number" style={{ ...INP, marginBottom:0, width:75 }} value={item.ratePerUnit} onChange={e => updateQuotItem(idx,"ratePerUnit",e.target.value)} /></td>
                                                                    <td style={TDS}><input type="number" style={{ ...INP, marginBottom:0, width:52 }} value={item.discountPct||0} onChange={e => updateQuotItem(idx,"discountPct",e.target.value)} /></td>
                                                                    <td style={TDS}><select style={{ ...INP, marginBottom:0, width:68 }} value={item.gstRate||18} onChange={e => updateQuotItem(idx,"gstRate",Number(e.target.value))}>{[0,5,12,18,28].map(r=><option key={r} value={r}>{r}%</option>)}</select></td>
                                                                    <td style={{ ...TDS, fontWeight:700, color:C.text }}>{fc(item.taxableValue||0)}</td>
                                                                    <td style={{ ...TDS, color:C.amber, fontSize:10 }}>{(quotForm.gstType||"cgst_sgst")==="cgst_sgst"?`C:${fc(item.cgstAmount||0)} S:${fc(item.sgstAmount||0)}`:`I:${fc(item.igstAmount||0)}`}</td>
                                                                    <td style={{ ...TDS, fontWeight:900, color:C.green }}>{fc(item.totalAmount||0)}</td>
                                                                    <td style={TDS}><button style={BTND} onClick={() => removeQuotItem(idx)}>✕</button></td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                        {quotForm.items.length > 0 && (
                                            <div style={{ background:"linear-gradient(135deg,#0f172a,#1e1b4b)", borderRadius:14, border:"2px solid "+C.border, padding:16, marginBottom:14 }}>
                                                <div style={{ fontWeight:900, fontSize:13, color:C.text, marginBottom:12, borderBottom:"1px solid #334155", paddingBottom:6 }}>🧮 Tax Summary (GST-Compliant)</div>
                                                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                                                    <div>
                                                        {[["Taxable Value",quotForm.taxableTotal,C.text],...(quotForm.gstType==="igst"?[["IGST",quotForm.igstTotal,C.violet]]:[["CGST",quotForm.cgstTotal,C.blue],["SGST",quotForm.sgstTotal,C.blue]])].map(([l,v,c]) => (
                                                            <div key={l} style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:6 }}><span style={{ color:C.muted }}>{l}</span><span style={{ color:c, fontWeight:700 }}>{fc(v)}</span></div>
                                                        ))}
                                                    </div>
                                                    <div style={{ display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center", background:"#042f2e", borderRadius:10, padding:14, border:"1.5px solid "+C.teal }}>
                                                        <div style={{ fontSize:11, color:C.muted, marginBottom:4 }}>Grand Total</div>
                                                        <div style={{ fontSize:22, fontWeight:900, color:C.teal }}>{fc(quotForm.grandTotal)}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                        <div style={{ display:"flex", gap:10 }}>
                                            <button style={{ ...BTNP(), flex:1, padding:"12px 0", fontSize:14 }} onClick={() => { const ok=saveQuotation(quotForm,editQuotationId,"Draft"); if(ok){setShowCreateQuotation(false);setEditQuotationId(null);} }}>{isEditing?"💾 Save Changes":"📋 Save as Draft"}</button>
                                            {!isEditing && <button style={{ ...BTNP("linear-gradient(90deg,#0ea5e9,#0284c7)"), flex:1, padding:"12px 0", fontSize:14 }} onClick={() => { const ok=saveQuotation(quotForm,null,"Sent"); if(ok){setShowCreateQuotation(false);} }}>📤 Save &amp; Mark as Sent</button>}
                                        </div>
                                    </div>
                                </div>
                            </div>);
                        }

                        // \u2550\u2550\u2550\u2550\u2550\u2550\u2550 VIEW A: LIST VIEW \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
                        return (<div>
                            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
                                <div style={{ fontSize:16, fontWeight:800, color:C.teal }}>📋 Quotations</div>
                                {isAdmin && <button style={BTNP()} onClick={startNewQuotation}>+ New Quotation</button>}

                                            <span style={{ color: "#fbbf24" }}>💡 To permanently resolve: review your Trading A/C for duplicate raw material entries, or check for Journal-Only entries without a matching opposite entry. See the 5 causes listed below if you re-enable the mismatch view.</span>
                                        </div>
                                    </div>
                                    : <div style={{ background: "#052e16", borderRadius: 8, padding: "8px 14px", marginBottom: 10, color: "#86efac", fontWeight: 700, textAlign: "center", fontSize: 12 }}>✅ Balance Sheet BALANCED — Assets = Liabilities + Equity</div>}
                                {credsWithOpening.length > 0 && (

                            ))}
                        </div>
                        {da.length === 0 ? <div style={{ background: C.mid, borderRadius: 12, padding: 24, textAlign: "center", color: C.muted }}>Add a Fixed Asset in Balance Sheet first, then add depreciation here.</div> : (
                            <div style={{ background: C.mid, borderRadius: 12, overflowX: "auto" }}><table style={TBL}><thead><tr>{["Asset", "Cost", "Start", "Method", "Rate", "Accum.Depr", "WDV", "Del"].map(h => <th key={h} style={THS}>{h}</th>)}</tr></thead>

                            </table></div>
                        )}
                    </div>}

                    {tab === "Charts" && <div>
                        <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 16, color: C.purple }}>📊 Charts</div>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                            {[{ title: "📥 Purchases", data: buildTSD(si, "totalAmount"), color: C.violet }, { title: "📤 Sales", data: buildTSD(so, "totalAmount"), color: C.teal }, { title: "💵 Cash In", data: buildTSD(cash.filter(e => e.dir === "in"), "amount"), color: C.green }, { title: "💸 Cash Out", data: buildTSD(cash.filter(e => e.dir === "out"), "amount"), color: C.red }].map(({ title, data, color }) => (
                                <div key={title} style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid #334155" }}>
                                    <div style={{ fontSize: 12, fontWeight: 800, color, marginBottom: 10 }}>{title}</div>
                                    <MiniChart data={data} color={color} height={90} />
                                    {data.length === 0 && <div style={{ textAlign: "center", color: C.muted, fontSize: 11, padding: 20 }}>Add entries to see trend</div>}
                                </div>
                            ))}
                        </div>
                    </div>}

                    {tab === "Trial Balance" && (() => {
                        const rows = [
                            { name: "Opening Stock", dr: state.openingStock?.amount || 0, cr: 0 },
                            { name: "Purchases", dr: si.filter(x => !x.isReturn).reduce((s, e) => s + (e.totalAmount - (e.gstAmount || 0)), 0), cr: 0 },
                            { name: "Purchase Returns", dr: 0, cr: si.filter(x => x.isReturn).reduce((s, e) => s + (e.totalAmount - (e.gstAmount || 0)), 0) },
                            { name: "Sales", dr: 0, cr: so.filter(x => !x.isReturn).reduce((s, e) => s + (e.totalAmount - (e.gstAmount || 0)), 0) },
                            { name: "Sales Returns", dr: so.filter(x => x.isReturn).reduce((s, e) => s + (e.totalAmount - (e.gstAmount || 0)), 0), cr: 0 },
                            { name: "Trading Dr (Direct Exp)", dr: te.filter(x => x.side === "dr" && x.sourceType !== "rawMaterial").reduce((s, e) => s + e.amount, 0), cr: 0 },
                            { name: "Raw Material Costs", dr: rawMaterialCosts, cr: 0 },
                            { name: "Trading Cr (Direct Inc)", dr: 0, cr: te.filter(x => x.side === "cr").reduce((s, e) => s + e.amount, 0) },
                            { name: "P&L Expenses", dr: ple.filter(x => x.side === "expense").reduce((s, e) => s + Number(e.amount), 0), cr: 0 },
                            { name: "P&L Income", dr: 0, cr: ple.filter(x => x.side === "income").reduce((s, e) => s + Number(e.amount), 0) },
                            { name: "Depreciation (Expense)", dr: totalDepreciation, cr: 0 },
                            { name: "Trade Debtors", dr: totalDebtors, cr: 0 },
                            { name: "Trade Creditors", dr: 0, cr: totalCreditors },
                            { name: "Cash Balance", dr: cashBal >= 0 ? cashBal : 0, cr: cashBal < 0 ? Math.abs(cashBal) : 0 },
                            // Manual BS Assets: raw stored cost (original)
                            { name: "Manual BS Assets", dr: bsManualAssetsRaw.reduce((s, e) => s + Number(e.amount), 0), cr: 0 },
                            // Manual BS Liab & Equity: OUTSTANDING amounts (loans already net of repayments via bsManualLiabRaw)
                            { name: "Manual BS Liab & Equity (Outstanding)", dr: 0, cr: bsManualLiabRaw.reduce((s, e) => s + Number(e.amount), 0) },
                            // Loan repayments: debit row to keep Trial Balance balanced when principal has been paid back
                            // (The cash outflow for repayments is already captured in Cash Balance above)
                            (() => { const totalRepaid = Object.values(state.balanceSheet?.liabilities || {}).filter(e => e.subCategory === "Long Term Borrowings").reduce((s, e) => s + loanPrincipalPaid(e.id), 0); return totalRepaid > 0 ? { name: "Loan Principal Repaid (reduces liability)", dr: totalRepaid, cr: 0 } : null; })(),
                            { name: "Loan Interest (Expense)", dr: totalLoanInterest, cr: 0 },
                            { name: "Interest Outstanding on Loans", dr: 0, cr: outstandingInterestLiab },
                            // GST ITC Receivable when Input > Output; GST Payable when Output > Input
                            { name: "GST ITC Receivable (Asset)", dr: gstItcReceivable > 0 ? gstItcReceivable : 0, cr: 0 },
                            { name: "GST Duties & Taxes (Payable)", dr: 0, cr: totalGstPayable > 0 ? totalGstPayable : 0 },
                            // Note: Net Profit/Loss is NOT included here — this is a pre-closing Trial Balance.
                            // Revenue and expense accounts are listed individually; including the derived
                            // Net P&L would double-count those balances.
                        ].filter(Boolean);
                        const totalDr = rows.reduce((acc, r) => acc + r.dr, 0);
                        const totalCr = rows.reduce((acc, r) => acc + r.cr, 0);
                        const diff = Math.abs(totalDr - totalCr);
                        const balanced = diff < 0.01;

                        return <div>
                            <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 14, color: C.teal }}>⚖️ Trial Balance</div>
                            <div style={{ background: C.mid, borderRadius: 12, padding: 16, border: "1px solid #334155" }}>
                                <table style={TBL}>
                                    <thead><tr><th style={THS}>Account</th><th style={{ ...THS, textAlign: "right" }}>Debit (Dr)</th><th style={{ ...THS, textAlign: "right" }}>Credit (Cr)</th></tr></thead>
                                    <tbody>
                                        {rows.map(r => (
                                            <tr key={r.name}>
                                                <td style={TDS}>{r.name}</td>
                                                <td style={{ ...TDS, textAlign: "right" }}>{r.dr > 0 ? fc(r.dr) : "—"}</td>
                                                <td style={{ ...TDS, textAlign: "right" }}>{r.cr > 0 ? fc(r.cr) : "—"}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot>
                                        <tr style={{ borderTop: "2px solid #334155", fontWeight: 800 }}>
                                            <td style={{ ...TDS, fontWeight: "bold" }}>Total</td>
                                            <td style={{ ...TDS, textAlign: "right", fontWeight: "bold", color: balanced ? C.green : C.red }}>{fc(totalDr)}</td>
                                            <td style={{ ...TDS, textAlign: "right", fontWeight: "bold", color: balanced ? C.green : C.red }}>{fc(totalCr)}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                                {!balanced && <div style={{ color: C.red, fontSize: 11, fontWeight: 700, marginTop: 8, textAlign: "center" }}>⚠️ Trial Balance Mismatch! Difference: {fc(diff)}</div>}
                                {balanced && <div style={{ color: C.green, fontSize: 11, fontWeight: 700, marginTop: 8, textAlign: "center" }}>✅ Trial Balance Balanced</div>}
                                <div style={{ marginTop: 12, fontSize: 10, color: C.muted, textAlign: "center" }}>Note: This is a pre-closing Trial Balance (closing stock is not included; opening stock is).</div>
                            </div>
                        </div>;
                    })()}

                    {tab === "Cash Flow" && (() => {
                        const sums = {};
                        [...CASH_IN_TYPES, ...CASH_OUT_TYPES].forEach(t => sums[t] = 0);
                        // Exclude pending entries — cash hasn't actually moved yet
                        cash.filter(e => !e.isPending).forEach(e => { sums[e.payType] = (sums[e.payType] || 0) + e.amount; });
                        const operatingIn = sums["Sales Receipt"] + sums["Debtor Payment"] + sums["Other Income Receipt"];
                        const operatingOut = sums["Expense Payment"] + sums["Creditor Payment"] + sums["Stock Purchase Payment"] + sums["Sales Return Refund"] + (sums["Raw Material Payment"] || 0);
                        const investingIn = sums["Purchase Return Receipt"]; // Return of capital/stock
                        const investingOut = sums["Other Payment"] + (sums["Asset Down Payment"] || 0); // Usually fixed assets
                        const financingIn = sums["Capital Introduced"] + sums["Loan Received"];
                        const financingOut = sums["Loan Repayment"] + (sums["Interest on Loan Repayment"] || 0);
                        const opNet = operatingIn - operatingOut;
                        const invNet = investingIn - investingOut;
                        const finNet = financingIn - financingOut;

                        return <div>
                            <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 14, color: C.blue }}>🌊 Cash Flow Statement (Direct Method)</div>

                            <div style={{ background: C.mid, borderRadius: 12, padding: 16, border: "1px solid #334155", marginBottom: 16 }}>
                                <div style={{ fontSize: 13, fontWeight: 800, color: C.text, marginBottom: 10, borderBottom: "1px solid #334155", paddingBottom: 4 }}>Operating Activities</div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Receipts from Customers (Sales & Debtors)</span><span>{fc(sums["Sales Receipt"] + sums["Debtor Payment"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Other Income Receipts</span><span>{fc(sums["Other Income Receipt"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Payments to Suppliers (Purchases, Creditors & Raw Materials)</span><span>{fc(sums["Stock Purchase Payment"] + sums["Creditor Payment"] + (sums["Raw Material Payment"] || 0))}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Operating Expense Payments</span><span>{fc(sums["Expense Payment"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Sales Return Refunds</span><span>{fc(sums["Sales Return Refund"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700, color: opNet >= 0 ? C.green : C.red, marginTop: 6, paddingTop: 4, borderTop: "1px dashed #334155" }}><span>Net Cash from Operating Activities</span><span>{fc(opNet)}</span></div>
                            </div>

                            <div style={{ background: C.mid, borderRadius: 12, padding: 16, border: "1px solid #334155", marginBottom: 16 }}>
                                <div style={{ fontSize: 13, fontWeight: 800, color: C.text, marginBottom: 10, borderBottom: "1px solid #334155", paddingBottom: 4 }}>Investing Activities</div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Purchase Return Receipts (Refunds)</span><span>{fc(sums["Purchase Return Receipt"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Other Payments (Fixed Assets, etc.)</span><span>{fc(sums["Other Payment"] + (sums["Asset Down Payment"] || 0))}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700, color: invNet >= 0 ? C.green : C.red, marginTop: 6, paddingTop: 4, borderTop: "1px dashed #334155" }}><span>Net Cash from Investing Activities</span><span>{fc(invNet)}</span></div>
                            </div>

                            <div style={{ background: C.mid, borderRadius: 12, padding: 16, border: "1px solid #334155", marginBottom: 16 }}>
                                <div style={{ fontSize: 13, fontWeight: 800, color: C.text, marginBottom: 10, borderBottom: "1px solid #334155", paddingBottom: 4 }}>Financing Activities</div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Capital Introduced</span><span>{fc(sums["Capital Introduced"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, padding: "2px 0" }}><span>+ Loan Received</span><span>{fc(sums["Loan Received"])}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Loan Repayment</span><span>{fc(sums["Loan Repayment"])}</span></div>
                                {sums["Interest on Loan Repayment"] > 0 && (
                                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, padding: "2px 0" }}><span>- Interest on Loan Repayment</span><span>{fc(sums["Interest on Loan Repayment"])}</span></div>
                                )}
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700, color: finNet >= 0 ? C.green : C.red, marginTop: 6, paddingTop: 4, borderTop: "1px dashed #334155" }}><span>Net Cash from Financing Activities</span><span>{fc(finNet)}</span></div>
                            </div>

                            <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                                <div style={CARD(cashBal >= 0 ? "#16a34a,#15803d" : "#dc2626,#b91c1c")}><div style={{ fontSize: 10 }}>Net Increase / (Decrease) in Cash</div><div style={{ fontSize: 16, fontWeight: 900 }}>{fc(opNet + invNet + finNet)}</div></div>
                                <div style={CARD("#0ea5e9,#0284c7")}><div style={{ fontSize: 10 }}>Closing Cash Balance</div><div style={{ fontSize: 16, fontWeight: 900 }}>{fc(cashBal)}</div></div>
                            </div>
                        </div>;
                    })()}

                    {tab === "Journal" && (() => {
                        let j = [];
                        si.forEach(e => j.push({ date: e.date, type: "Stock In", desc: `Batch ${e.batchNo} (${e.bottleType})`, id: e.id, amt: e.totalAmount, dir: "dr" }));
                        so.forEach(e => j.push({ date: e.date, type: "Stock Out", desc: `${e.qty} ${e.bottleType}`, id: e.id, amt: e.totalAmount, dir: "cr" }));
                        cash.forEach(e => {
                            j.push({ date: e.date, type: "Cash", desc: e.description, id: e.id, amt: e.amount, dir: e.dir });
                            if (e.dir === "out" && e.payType === "Loan Repayment" && e.linkedId) {
                                const loan = Object.values(state.balanceSheet?.liabilities || {}).find(x => x.id === e.linkedId);
                                j.push({
                                    date: e.date,
                                    type: "Balance Sheet",
                                    desc: `Debit: Principal Repayment of ${loan ? loan.description : "Loan"}`,
                                    id: e.id + "_repay_dr",
                                    amt: e.amount,
                                    dir: "dr"
                                });
                            }
                            if (e.dir === "out" && e.payType === "Interest on Loan Repayment" && e.linkedId) {
                                const loan = Object.values(state.balanceSheet?.liabilities || {}).find(x => x.id === e.linkedId);
                                j.push({
                                    date: e.date,
                                    type: "Balance Sheet",
                                    desc: `Debit: Interest Paid on ${loan ? loan.description : "Loan"}`,
                                    id: e.id + "_intpaid_dr",
                                    amt: e.amount,
                                    dir: "dr"
                                });
                            }
                        });
                        te.forEach(e => j.push({ date: e.date, type: "Trading", desc: e.description, id: e.id, amt: e.amount, dir: e.side }));
                        ple.forEach(e => j.push({ date: e.date, type: "P&L", desc: e.description, id: e.id, amt: e.amount, dir: e.side }));
                        Object.values(state.balanceSheet?.liabilities || {})
                            .filter(e => e.subCategory === "Long Term Borrowings" && e.interestRate)
                            .forEach(e => {
                                const principal = Number(e.amount);
                                const rate = Number(e.interestRate) / 100;
                                const startDate = new Date(e.date);
                                const now = new Date();
                                let mo = (now.getFullYear() - startDate.getFullYear()) * 12 + (now.getMonth() - startDate.getMonth());
                                if (mo < 0) mo = 0;
                                const monthlyAmt = (principal * rate) / 12;
                                for (let m = 1; m <= mo; m++) {
                                    const interestDate = new Date(startDate.getTime());
                                    interestDate.setMonth(startDate.getMonth() + m);
                                    const dateStr = interestDate.toISOString().slice(0, 10);
                                    j.push({
                                        date: dateStr,
                                        type: "P&L",
                                        desc: `Auto Interest Accrual: ${e.description} (${e.interestRate}% p.a.)`,
                                        id: e.id + `_int_${m}_dr`,
                                        amt: monthlyAmt,
                                        dir: "dr"
                                    });
                                    j.push({
                                        date: dateStr,
                                        type: "Balance Sheet",
                                        desc: `Auto Interest Outstanding: ${e.description} (${e.interestRate}% p.a.)`,
                                        id: e.id + `_int_${m}_cr`,
                                        amt: monthlyAmt,
                                        dir: "cr"
                                    });
                                }
                            });
                        j.sort((a, b) => new Date(b.date) - new Date(a.date));

                        return <div>
                            <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 14, color: C.purple }}>📖 Journal / General Ledger</div>
                            <div style={{ background: C.mid, borderRadius: 12, overflowX: "auto", border: "1px solid #334155" }}>
                                <table style={TBL}>
                                    <thead><tr><th style={THS}>Date</th><th style={THS}>Module</th><th style={THS}>Description</th><th style={THS}>Effect (Dr / Cr)</th><th style={{ ...THS, textAlign: "right" }}>Amount</th></tr></thead>
                                    <tbody>
                                        {j.map((e, i) => <tr key={i}>
                                            <td style={TDS}>{e.date}</td>
                                            <td style={TDS}><Badge label={e.type} color={C.violet} /></td>
                                            <td style={{ ...TDS, fontSize: 11 }}>{e.desc}</td>
                                            <td style={{ ...TDS, color: C.muted, fontSize: 10 }}>{e.dir === "in" || e.dir === "dr" || e.dir === "expense" ? "Debit / In" : "Credit / Out"}</td>
                                            <td style={{ ...TDS, textAlign: "right", fontWeight: 700 }}>{fc(e.amt)}</td>
                                        </tr>)}
                                    </tbody>
                                </table>
                            </div>
                        </div>;
                    })()}

                    {tab === "Audit Trail" && <div>
                        <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 14, color: "#94a3b8" }}>📋 Audit Trail</div>
                        <div style={{ background: C.mid, borderRadius: 12, overflow: "hidden", border: "1px solid #334155" }}>
                            {(state.auditLog || []).length === 0
                                ? <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: 32 }}>No activity recorded yet.</div>
                                : <table style={TBL}>
                                    <thead><tr>
                                        <th style={THS}>#</th>
                                        <th style={THS}>Action</th>
                                        <th style={THS}>Module</th>
                                        <th style={THS}>Description</th>
                                        <th style={THS}>User</th>
                                        <th style={THS}>Date & Time</th>
                                    </tr></thead>
                                    <tbody>
                                        {(state.auditLog || []).map((l, i) => (
                                            <tr key={l.id}>
                                                <td style={{ ...TDS, color: C.muted, fontSize: 10 }}>{(state.auditLog || []).length - i}</td>
                                                <td style={TDS}>
                                                    <span style={{ background: l.action === "DELETE" ? "#ef444420" : l.action === "UPDATE" ? "#f59e0b20" : "#22c55e20", color: l.action === "DELETE" ? C.red : l.action === "UPDATE" ? C.amber : C.green, fontWeight: 800, fontSize: 10, padding: "2px 8px", borderRadius: 5, border: "1px solid currentColor" }}>{l.action}</span>
                                                </td>
                                                <td style={{ ...TDS, color: C.blue, fontSize: 11 }}>{l.module}</td>
                                                <td style={{ ...TDS, fontSize: 11 }}>{l.desc}</td>
                                                <td style={{ ...TDS, color: C.muted, fontSize: 10 }}>{l.user || "—"}</td>
                                                <td style={{ ...TDS, color: C.muted, fontSize: 10, whiteSpace: "nowrap" }}>{new Date(l.ts).toLocaleString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            }
                        </div>
                        <div style={{ marginTop: 8, fontSize: 10, color: C.muted, textAlign: "center" }}>Showing all {(state.auditLog || []).length} audit events (latest first)</div>
                    </div>}

                </div>

                {/* Modals */}
                {modal && <div onClick={closeM} style={{ position: "fixed", inset: 0, background: "#000000c0", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
                    <div onClick={e => e.stopPropagation()} style={{ background: C.dark, border: "1.5px solid #334155", borderRadius: 16, padding: 22, minWidth: 360, maxWidth: 490, width: "92vw", maxHeight: "90vh", overflowY: "auto" }}>

                        {modal === "settings" && <div>
                            <div style={{ fontWeight: 800, fontSize: 15, color: C.teal, marginBottom: 12 }}>⚙️ Admin & Company Settings</div>
                            <label style={{ fontSize: 11, color: C.muted, fontWeight: 700, display: "block", marginBottom: 3 }}>Admin PIN *</label>
                            <input type="password" style={INP} placeholder="New Admin PIN" value={form.adminPin || ""} onChange={e => setForm(f => ({ ...f, adminPin: e.target.value }))} />

                            <div style={{ borderTop: "1px solid #334155", margin: "12px 0", paddingTop: 10 }}>
                                <div style={{ fontWeight: 800, fontSize: 12, color: C.blue, marginBottom: 8 }}>🏢 Company Profile (GST)</div>
                                <label style={{ fontSize: 11, color: C.muted, fontWeight: 700, display: "block", marginBottom: 3 }}>Company Name *</label>
                                <input style={INP} placeholder="e.g. YORS WATER" value={form.compName || ""} onChange={e => setForm(f => ({ ...f, compName: e.target.value }))} />
                                <label style={{ fontSize: 11, color: C.muted, fontWeight: 700, display: "block", marginBottom: 3 }}>GSTIN *</label>
                                <input style={INP} placeholder="e.g. 19AAACY1234A1Z1" value={form.compGstin || ""} onChange={e => setForm(f => ({ ...f, compGstin: e.target.value.toUpperCase() }))} />
                                <label style={{ fontSize: 11, color: C.muted, fontWeight: 700, display: "block", marginBottom: 3 }}>State Code *</label>
                                <input style={INP} placeholder="e.g. 19 (West Bengal)" value={form.compStateCode || ""} onChange={e => setForm(f => ({ ...f, compStateCode: e.target.value }))} />
                                <label style={{ fontSize: 11, color: C.muted, fontWeight: 700, display: "block", marginBottom: 3 }}>Address</label>
                                <input style={INP} placeholder="Address" value={form.compAddress || ""} onChange={e => setForm(f => ({ ...f, compAddress: e.target.value }))} />
                                <label style={{ fontSize: 11, color: C.muted, fontWeight: 700, display: "block", marginBottom: 3 }}>Phone</label>
                                <input style={INP} placeholder="Phone" value={form.compPhone || ""} onChange={e => setForm(f => ({ ...f, compPhone: e.target.value }))} />
                            </div>

                            <button style={{ ...BTNP(), width: "100%" }} onClick={() => {
