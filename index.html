        /* ─── PRINT: Show only the invoice, hide the entire app shell ─── */
        @media print {
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Step 1: Make everything invisible (visibility can be overridden by children, unlike display:none) */
            body * {
                visibility: hidden !important;
            }

            /* Step 2: Make only the invoice and all its children visible */
            #print-area,
            #print-area * {
                visibility: visible !important;
            }

            /* Step 3: Pull the invoice to the top-left of the page */
            #print-area {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 20px 30px !important;
                box-shadow: none !important;
                border: none !important;
                background: white !important;
                color: black !important;
                border-radius: 0 !important;

            #print-area * {
                color: black !important;
                border-color: #000 !important;
                background: white !important;

            }

            #print-area table th {

        firebase.initializeApp(FIREBASE_CONFIG);
        const auth = firebase.auth();
        const db = firebase.firestore();
        // ── Offline Persistence ──────────────────────────────────────────
        // Writes are immediately committed to local IndexedDB and synced to
        // the server in the background. If the page closes before the network
        // write completes, Firestore will replay the pending write on next load.
        // This is the correct fix for entries vanishing on page refresh/close.
        db.enablePersistence({ synchronizeTabs: true })
            .catch(err => {
                if (err.code === 'failed-precondition') {
                    // Multiple tabs open — persistence only works in one tab at a time
                    console.warn('Firestore: offline persistence disabled (multiple tabs open)');
                } else if (err.code === 'unimplemented') {
                    // Browser does not support IndexedDB
                    console.warn('Firestore: offline persistence not supported in this browser');
                } else {
                    console.warn('Firestore: persistence error:', err);
                }
            });

        const fn = n => Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fabs = n => fc(Math.abs(n));

        function computeFIFO(stockIn, stockOut) {
            const results = {};
            BOTTLE_TYPES.forEach(bt => {
                ["normal", "customized"].forEach(cat => {
                    const key = bt + "_" + cat;
                    const batches = stockIn.filter(x => x.bottleType === bt && x.category === cat && !x.isReturn).sort((a, b) => new Date(a.date) - new Date(b.date)).map(x => ({ ...x, origQty: Number(x.qty), remQty: Number(x.qty), rate: Number(x.ratePerUnit), batchNo: x.batchNo, godown: x.godown }));
                    const returns = stockIn.filter(x => x.bottleType === bt && x.category === cat && x.isReturn);
                    returns.forEach(r => {
                        let b = batches.find(x => x.batchNo === r.batchNo && x.godown === r.godown);
                        if (!b) {
                            b = batches.find(x => x.godown === r.godown && x.remQty >= Number(r.qty));
                            if (!b) {
                                b = batches.find(x => x.godown === r.godown && x.remQty > 0);
                                if (!b) {
                                    b = batches.find(x => x.godown === r.godown);
                                }
                            }
                        }
                        if (b) {
                            b.origQty -= Number(r.qty);
                            b.remQty -= Number(r.qty);
                        }
                    });
                    const outs = stockOut.filter(x => x.bottleType === bt && x.category === cat && !x.isReturn).sort((a, b) => new Date(a.date) - new Date(b.date));
                    const salesReturns = stockOut.filter(x => x.bottleType === bt && x.category === cat && x.isReturn);
                    let cogs = 0;
                    outs.forEach(out => { let needed = Number(out.qty); for (let i = 0; i < batches.length && needed > 0; i++) { if (batches[i].godown !== out.godown) continue; const take = Math.min(batches[i].remQty, needed); if (take > 0) { cogs += take * batches[i].rate; batches[i].remQty -= take; needed -= take; } } });
                    // Sales returns: add qty back to existing batches in the same godown (LIFO restoration)
                    salesReturns.forEach(sr => {
                        const godown = sr.godown;
                        let toRestore = Number(sr.qty);
                        // Try to restore to batches in same godown, starting from most recently depleted (reverse order)
                        for (let i = batches.length - 1; i >= 0 && toRestore > 0; i--) {
                            if (batches[i].godown !== godown) continue;
                            const restoreAmt = Math.min(toRestore, batches[i].origQty - batches[i].remQty); // can only restore what was taken
                            if (restoreAmt > 0) {
                                batches[i].remQty += restoreAmt;
                                toRestore -= restoreAmt;
                            }
                        }
                        // If still some left to restore (e.g. original batch exhausted in another way), add to most recent batch
                        if (toRestore > 0) {
                            const fallback = [...batches].reverse().find(b => b.godown === godown);
                            if (fallback) { fallback.remQty += toRestore; fallback.origQty += toRestore; }
                        }
                    });
                    const inQty = batches.reduce((a, b) => a + b.origQty, 0), outQty = outs.reduce((a, b) => a + Number(b.qty), 0);
                    let closingValue = 0; batches.forEach(b => { closingValue += b.remQty * b.rate; });
                    results[key] = { batches, cogs, closingValue, inQty, outQty, balQty: inQty - outQty };
                });
            });
            return results;
        }

        function calcDepreciation(asset) {
            const cost = Number(asset.cost || 0), rate = Number(asset.depRate || 0) / 100;
            const startDate = new Date(asset.startDate || today()), now = new Date();
            let mo = (now.getFullYear() - startDate.getFullYear()) * 12 + (now.getMonth() - startDate.getMonth());
            if (mo < 0) mo = 0;
            let totalDepr = 0;
            if (asset.method === "Straight Line (SLM)") { const annual = cost * rate, md = annual / 12; if (asset.period === "Monthly") totalDepr = md * Math.max(1, Math.min(mo, 1)); else if (asset.period === "Half-Yearly") totalDepr = md * Math.max(1, Math.min(mo, 6)); else totalDepr = md * Math.max(1, Math.min(mo, 12)); }
            else { totalDepr = cost - cost * Math.pow(1 - rate, Math.max(mo / 12, 0)); }
            return { totalDepr: Math.min(Math.max(totalDepr, 0), cost), wdv: Math.max(0, cost - Math.min(Math.max(totalDepr, 0), cost)) };
        }

                        const gstAmount = hasGst ? (base * gstRate) / 100 : 0;
                        return base + gstAmount;
                    }
                    const taxable = qty * rate;
                    const gstAmount = hasGst ? (taxable * gstRate) / 100 : 0;
                    return taxable + gstAmount;
                } else if (["trading_dr", "trading_cr", "pl_expense", "pl_income"].includes(mode)) {
                    const base = Number(form.amount || 0);
                    const gstAmount = hasGst ? (base * gstRate) / 100 : 0;
                    return base + gstAmount;
                } else {
                    return Number(form.amount || 0);

            const totalVal = getTransactionTotal();
            const getTransactionBase = () => {
                const qty = Number(form.qty || 0);

        // ─── Firestore Sanitizer ───────────────────────────────────
        // Firestore rejects documents that contain `undefined` values (e.g. a
        // form field the user left blank). JSON.parse(JSON.stringify(obj))
        // drops all undefined keys from objects and converts undefined array
        // elements to null, producing a Firestore-safe clone in one step.
        function sanitizeForFirestore(obj) {
            try { return JSON.parse(JSON.stringify(obj)); }
            catch(e) { console.error("sanitizeForFirestore failed:", e); return obj; }
        }

        // ─── Firestore Hook ───────────────────────────────────
        function useFirestore(uid) {
            const [state, setState] = useState(INIT);
            const [loading, setLoading] = useState(true);
            const [savingStatus, setSavingStatus] = useState("saved"); // "saved", "saving", "error"
            const [lastSaveError, setLastSaveError] = useState(null);
            const isInitializedRef = useRef(false);
            // Prevents re-saving data that was just loaded FROM Firestore
            const justLoadedRef = useRef(false);

            useEffect(() => {
                if (!uid) return;
                setLoading(true);
                isInitializedRef.current = false;
                setLastSaveError(null);

                db.collection("companies").doc(uid).get()
                    .then(snap => {
                        let finalData;
                        if (snap.exists && snap.data() && Object.keys(snap.data()).length > 0) {
                            const fetched = snap.data();
                            finalData = { ...INIT, ...fetched };
                        } else {
                            finalData = { ...INIT, ...CLEAN_RECOVERED_STATE };
                            db.collection("companies").doc(uid).set(sanitizeForFirestore(finalData))
                                .then(() => console.log("Initialized new company document in Firestore"))
                                .catch(e => console.error("Error initializing company doc:", e));
                        }
                        justLoadedRef.current = true; // mark: this setState came from Firestore, don't re-save it
                        setState(finalData);
                        try { localStorage.setItem("yors_finance_state_" + uid, JSON.stringify(finalData)); } catch(e){}
                    })
                    .catch(err => {
                        console.error("Firestore read error:", err);
                        setLastSaveError("Firestore Read Failed: " + err.message);
                        try {
                            const cached = localStorage.getItem("yors_finance_state_" + uid);
                            if (cached) {
                                console.log("Loaded state from local cache fallback");
                                justLoadedRef.current = true;
                                setState(JSON.parse(cached));
                            }
                        } catch(e){}
                    })
                    .finally(() => {
                        isInitializedRef.current = true;
                        setLoading(false);
                    });
            }, [uid]);

            useEffect(() => {
                if (!uid || loading || !isInitializedRef.current) return;

                // Skip re-saving data that was just loaded FROM Firestore.
                if (justLoadedRef.current) {
                    justLoadedRef.current = false;
                    return;
                }

                setSavingStatus("saving");
                setLastSaveError(null);

                // Update localStorage immediately as a local fallback.
                try { localStorage.setItem("yors_finance_state_" + uid, JSON.stringify(state)); } catch(e){}

                // Write to Firestore immediately — NO debounce.
                // With offline persistence, this commits to local IndexedDB first
                // so data is safe even if the page closes before network sync.
                try {
                    db.collection("companies").doc(uid).set(sanitizeForFirestore(state))
                        .then(() => { setSavingStatus("saved"); })
                        .catch(err => {
                            console.error("Firestore Save Error:", err);
                            setSavingStatus("error");
                            setLastSaveError("Database Save Failed: " + err.message);
                        });
                } catch(err) {
                    console.error("Firestore set() threw synchronously:", err);
                    setSavingStatus("error");
                    setLastSaveError("Save Error: " + err.message);
                }
            }, [state, uid, loading]);


            const exportBackup = useCallback(() => {
                try {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
                    const downloadAnchor = document.createElement('a');
                    const timeStr = new Date().toISOString().replace(/[:.]/g, "-");
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `yors_finance_backup_${timeStr}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                } catch(e) {
                    alert("Export failed: " + e.message);
                }
            }, [state]);

            const importBackup = useCallback(() => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'application/json,.json';
                input.onchange = e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = event => {
                        try {
                            const importedData = JSON.parse(event.target.result);
                            if (typeof importedData !== 'object' || !importedData) {
                                throw new Error("Invalid JSON structure");
                            }
                            if (!window.confirm("Overwrite current data with imported JSON backup?")) return;
                            const newFinal = { ...INIT, ...importedData };
                            setState(newFinal);
                            db.collection("companies").doc(uid).set(sanitizeForFirestore(newFinal))
                                .then(() => alert("✅ Backup restored successfully to live database!"))
                                .catch(err => alert("⚠️ Saved locally, but Firestore write failed: " + err.message));
                        } catch(err) {
                            alert("❌ Error parsing backup JSON file: " + err.message);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            }, [uid]);

            return { state, setState, loading, savingStatus, lastSaveError, setLastSaveError, exportBackup, importBackup };
        }

            const cgstInput =
                si.filter(e => e.settleMode !== "rawMaterial").reduce((a, b) => a + getCGST(b) * (b.isReturn ? -1 : 1), 0) +
                te.filter(e => e.side === "dr").reduce((a, b) => a + getCGST(b), 0) +
                ple.filter(e => e.side === "expense").reduce((a, b) => a + getCGST(b), 0) +
                (state.rawMaterialPayments || []).reduce((a, b) => a + getCGST(b), 0) +
                cash.filter(e => e.dir === "out" && !e.sourceId).reduce((a, b) => a + getCGST(b), 0);
            const sgstInput =
                si.filter(e => e.settleMode !== "rawMaterial").reduce((a, b) => a + getSGST(b) * (b.isReturn ? -1 : 1), 0) +
                te.filter(e => e.side === "dr").reduce((a, b) => a + getSGST(b), 0) +
                ple.filter(e => e.side === "expense").reduce((a, b) => a + getSGST(b), 0) +
                (state.rawMaterialPayments || []).reduce((a, b) => a + getSGST(b), 0) +
                cash.filter(e => e.dir === "out" && !e.sourceId).reduce((a, b) => a + getSGST(b), 0);
            const igstInput =
                si.filter(e => e.settleMode !== "rawMaterial").reduce((a, b) => a + getIGST(b) * (b.isReturn ? -1 : 1), 0) +
                te.filter(e => e.side === "dr").reduce((a, b) => a + getIGST(b), 0) +
                ple.filter(e => e.side === "expense").reduce((a, b) => a + getIGST(b), 0) +
                (state.rawMaterialPayments || []).reduce((a, b) => a + getIGST(b), 0) +
                cash.filter(e => e.dir === "out" && !e.sourceId).reduce((a, b) => a + getIGST(b), 0);

            const totalGstInput = cgstInput + sgstInput + igstInput;

            const getPaidSplit = (e, key) => {
                if (e.cgstAmount !== undefined && key === "cgst") return Number(e.cgstAmount);
                if (e.sgstAmount !== undefined && key === "sgst") return Number(e.sgstAmount);
                if (e.igstAmount !== undefined && key === "igst") return Number(e.igstAmount);
                if (e.cgstAmount === undefined && e.sgstAmount === undefined && e.igstAmount === undefined) {
                    if (key === "cgst" || key === "sgst") return Number(e.amount || 0) / 2;
                }
                return 0;
            };

            const cgstPaid = cash.filter(e => e.payType === "GST Tax Payment").reduce((a, b) => a + getPaidSplit(b, "cgst"), 0);
            const sgstPaid = cash.filter(e => e.payType === "GST Tax Payment").reduce((a, b) => a + getPaidSplit(b, "sgst"), 0);
            const igstPaid = cash.filter(e => e.payType === "GST Tax Payment").reduce((a, b) => a + getPaidSplit(b, "igst"), 0);

            const totalGstPaidToGovt = cgstPaid + sgstPaid + igstPaid;
            const totalGstPayable = totalGstOutput - totalGstInput - totalGstPaidToGovt;

            const cgstPayable = cgstOutput - cgstInput - cgstPaid;
            const sgstPayable = sgstOutput - sgstInput - sgstPaid;
            const igstPayable = igstOutput - igstInput - igstPaid;
            const grossPurchases = si.filter(x => !x.isReturn).reduce((a, b) => a + Number(b.totalAmount - (b.gstAmount || 0)), 0);
            const purchaseReturnsAmt = si.filter(x => x.isReturn).reduce((a, b) => a + Number(b.totalAmount - (b.gstAmount || 0)), 0);
            const grossSales = so.filter(x => !x.isReturn).reduce((a, b) => a + Number(b.totalAmount - (b.gstAmount || 0)), 0);
            const salesReturnsAmt = so.filter(x => x.isReturn).reduce((a, b) => a + Number(b.totalAmount - (b.gstAmount || 0)), 0);
            const fifoCOGS = Object.values(fifo).reduce((a, b) => a + b.cogs, 0);
            const fifoClosing = Object.values(fifo).reduce((a, b) => a + b.closingValue, 0);
            const openingStockAmt = Number(state.openingStock?.amount || 0);
            // rawMaterialCosts: remaining RM base cost (excl. GST) not yet allocated to stock-in.
            // Using r.amount (base excl. GST) prevents double-counting because GST is already
            // claimed separately as GST ITC Receivable on the asset side of the Balance Sheet.
            const rawMaterialCosts = (state.rawMaterialPayments || []).reduce((sum, r) => sum + Math.max(0, Number(r.amount) - (r.usedForStockIn || 0)), 0);
            const tradingDr = totalPurchases + openingStockAmt + rawMaterialCosts + te.filter(e => e.side === "dr" && e.sourceType !== "rawMaterial").reduce((a, b) => a + Number(b.amount), 0);
            const tradingCr = totalSales + fifoClosing + te.filter(e => e.side === "cr").reduce((a, b) => a + Number(b.amount), 0);
            const grossProfit = tradingCr - tradingDr;
            const cashIn = cash.filter(e => e.dir === "in" && !e.isPending).reduce((a, b) => a + Number(b.amount), 0);
            const cashOut = cash.filter(e => e.dir === "out" && !e.isPending).reduce((a, b) => a + Number(b.amount), 0);
            const cashBal = cashIn - cashOut;
            const manualExpense = ple.filter(e => e.side === "expense").reduce((a, b) => a + Number(b.amount), 0);
            const manualIncome = ple.filter(e => e.side === "income").reduce((a, b) => a + Number(b.amount), 0);
            const totalDepreciation = da.reduce((a, b) => a + calcDepreciation(b).totalDepr, 0);
            const deprWDVTotal = da.reduce((a, b) => a + calcDepreciation(b).wdv, 0);
            const deprCostTotal = da.reduce((a, b) => a + Number(b.cost), 0);
            const calcInterestForEntry = (e) => {
                if (!e.interestRate || !e.amount) return { monthly: 0, total: 0, months: 0 };
                const principal = Number(e.amount);
                const rate = Number(e.interestRate) / 100;
                const startDate = new Date(e.date || today());
                const now = new Date();
                let mo = (now.getFullYear() - startDate.getFullYear()) * 12 + (now.getMonth() - startDate.getMonth());
                if (mo < 0) mo = 0;
                const monthly = (principal * rate) / 12;
                const total = monthly * mo;
                return { monthly, total, months: mo };
            };
            const totalLoanInterest = Object.values(state.balanceSheet?.liabilities || {})
                .filter(e => e.subCategory === "Long Term Borrowings" && e.interestRate)
                .reduce((sum, e) => sum + calcInterestForEntry(e).total, 0);
            const loanInterestPaid = (loanId) => {
                return cash.filter(e => e.dir === "out" && e.payType === "Interest on Loan Repayment" && e.linkedId === loanId)
                    .reduce((sum, e) => sum + Number(e.amount || 0), 0);
            };
            const loanInterestOutstanding = (loan) => {
                const accrued = calcInterestForEntry(loan).total;
                const paid = loanInterestPaid(loan.id);
                return Math.max(0, accrued - paid);
            };
            const totalInterestPaid = cash
                .filter(e => e.dir === "out" && e.payType === "Interest on Loan Repayment")
                .reduce((sum, e) => sum + Number(e.amount || 0), 0);
            const outstandingInterestLiab = Math.max(0, totalLoanInterest - totalInterestPaid);
            const loanPrincipalPaid = (loanId) => {
                return cash.filter(e => e.dir === "out" && e.payType === "Loan Repayment" && e.linkedId === loanId)
                    .reduce((sum, e) => sum + Number(e.amount || 0), 0);
            };
            const loanPrincipalOutstanding = (loan) => {
                const original = Number(loan.amount || 0);
                const paid = loanPrincipalPaid(loan.id);
                return Math.max(0, original - paid);
            };
            // P&L is derived ONLY from Trading Account (gross profit) + manual P&L entries + depreciation + loan interest.
            // Cash Book is a receipts/payments register — it does NOT feed P&L to avoid double entry.
            const plIncome = (grossProfit > 0 ? grossProfit : 0) + manualIncome;
            const plExpense = manualExpense + totalDepreciation + totalLoanInterest + (grossProfit < 0 ? Math.abs(grossProfit) : 0);
            const netPL = plIncome - plExpense;

            const creditorFromStock = id => si.filter(x => x.settleMode === "creditor" && x.linkedPartyId === id).reduce((a, b) => a + Number(b.totalAmount) * (b.isReturn ? -1 : 1), 0);
            const creditorFromOther = id => {
                let sum = 0;
                te.forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) {
                        const xAmt = Number(x.totalAmount || x.amount || 0);
                        if (x.side === "dr") sum += xAmt;
                        else if (x.side === "cr") sum -= xAmt;
                    }
                });
                ple.forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) {
                        const xAmt = Number(x.totalAmount || x.amount || 0);
                        if (x.side === "expense") sum += xAmt;
                        else if (x.side === "income") sum -= xAmt;
                    }
                });
                Object.values(state.balanceSheet?.assets || {}).forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) sum += Number(x.amount || 0);
                });
                Object.values(state.balanceSheet?.liabilities || {}).forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) sum += Number(x.amount || 0);
                });
                (state.rawMaterialPayments || []).forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) sum += Number(x.totalAmount || x.amount || 0);
                });
                return sum;
            };
            const creditorCashPaid = id => cash.filter(e => e.dir === "out" && e.linkedId === id && !e.isPending).reduce((a, b) => a + Number(b.amount), 0);
            const creditorBal = c => Math.max(0, Number(c.amount) + creditorFromStock(c.id) + creditorFromOther(c.id) - creditorCashPaid(c.id));
            const debtorFromStock = id => so.filter(x => x.settleMode === "debtor" && x.linkedPartyId === id).reduce((a, b) => a + Number(b.totalAmount) * (b.isReturn ? -1 : 1), 0);
            const debtorFromOther = id => {
                let sum = 0;
                te.forEach(x => {
                    if (x.settleMode === "debtor" && x.linkedPartyId === id) {
                        const xAmt = Number(x.totalAmount || x.amount || 0);
                        if (x.side === "cr") sum += xAmt;
                        else if (x.side === "dr") sum -= xAmt;
                    }
                });
                ple.forEach(x => {
                    if (x.settleMode === "debtor" && x.linkedPartyId === id) {
                        const xAmt = Number(x.totalAmount || x.amount || 0);
                        if (x.side === "income") sum += xAmt;
                        else if (x.side === "expense") sum -= xAmt;
                    }
                });
                Object.values(state.balanceSheet?.assets || {}).forEach(x => {
                    if (x.settleMode === "debtor" && x.linkedPartyId === id) sum += Number(x.amount || 0);
                });
                Object.values(state.balanceSheet?.liabilities || {}).forEach(x => {
                    if (x.settleMode === "debtor" && x.linkedPartyId === id) sum -= Number(x.amount || 0);
                });
                return sum;
            };
            const debtorCashRcvd = id => cash.filter(e => e.dir === "in" && e.linkedId === id && !e.isPending).reduce((a, b) => a + Number(b.amount), 0);
            const debtorBal = d => Math.max(0, Number(d.amount) + debtorFromStock(d.id) + debtorFromOther(d.id) - debtorCashRcvd(d.id));
            const totalCreditors = creds.reduce((a, b) => a + creditorBal(b), 0);
            const totalDebtors = debs.reduce((a, b) => a + debtorBal(b), 0);
            // Balance Sheet manual entries: exclude Fixed Assets that have depreciation linked
            // (their WDV is shown via the auto depreciation line to avoid double-counting).
            const bsManualAssetsRaw = Object.values(state.balanceSheet?.assets || {});
            const bsManualLiabRaw = Object.values(state.balanceSheet?.liabilities || {}).map(e => {
                if (e.subCategory === "Long Term Borrowings") {
                    return { ...e, amount: loanPrincipalOutstanding(e) };
                }
                return e;
            });
            // IDs of BS entries that sourced cash (to exclude from P&L cash flows)
            const bsEntryIds = new Set([...bsManualAssetsRaw, ...bsManualLiabRaw].map(e => e.id));
            const bsManualAssets = bsManualAssetsRaw.reduce((a, b) => a + Number(b.amount), 0);
            const bsManualLiab = bsManualLiabRaw.reduce((a, b) => a + Number(b.amount), 0);
            // Auto assets: cash balance + closing stock + debtors - accumulated depreciation
            // Cash balance is from cash book (receipts & payments), kept separate from BS manual entries.
            // When GST ITC > Output GST (totalGstPayable < 0), the excess ITC is an asset (receivable from govt), not a negative liability.
            const gstItcReceivable = totalGstPayable < 0 ? Math.abs(totalGstPayable) : 0;
            // --- Step 1: Compute raw auto-sides (without any adjustment) ---
            const bsAutoAssetsRaw = cashBal + (fifoClosing > 0 ? fifoClosing : 0) + (totalDebtors > 0 ? totalDebtors : 0) - totalDepreciation + gstItcReceivable;
            const bsAutoLiabRaw   = (totalCreditors > 0 ? totalCreditors : 0) + netPL + (outstandingInterestLiab > 0 ? outstandingInterestLiab : 0) + (totalGstPayable > 0 ? totalGstPayable : 0);
            const rawBsTotalAssets = bsManualAssets + bsAutoAssetsRaw;
            const rawBsTotalLiab   = bsManualLiab   + bsAutoLiabRaw;
            const rawBsDiff = rawBsTotalAssets - rawBsTotalLiab;
            // --- Step 2: Auto-reconcile creditor opening balances ---
            // Creditors with a non-zero opening balance (money owed before this system was set up) create
            // a liability without a corresponding system asset.  We automatically offset them by adding
            // an equivalent "Opening Capital (Pre-System)" entry to the asset side so the BS always balances.
            const credsOpeningOffset = creds.reduce((a, c) => a + Number(c.amount || 0), 0);
            // --- Step 3: Compute residual after creditor-opening fix ---
            const diffAfterCredsAdj = rawBsDiff + credsOpeningOffset; // if negative, assets still short
            // Any remaining gap (journal-only entries, orphaned cash, etc.) goes into a suspense item
            const bsAdjToAssets = credsOpeningOffset + (diffAfterCredsAdj < -0.01 ? -diffAfterCredsAdj : 0);
            const bsAdjToLiab   = diffAfterCredsAdj > 0.01 ? diffAfterCredsAdj : 0;
            // --- Step 4: Final balanced values (no stored data changed) ---
            const bsAutoAssets = bsAutoAssetsRaw + bsAdjToAssets;
            const bsAutoLiab   = bsAutoLiabRaw   + bsAdjToLiab;
            const bsTotalAssets = bsManualAssets + bsAutoAssets, bsTotalLiab = bsManualLiab + bsAutoLiab, bsDiff = bsTotalAssets - bsTotalLiab;

            const upd = fn => setState(p => fn(p));
            const toggleChk = (key, id) => upd(p => ({ ...p, [key]: p[key].map(e => e.id === id ? { ...e, checked: !e.checked, manualCheck: true } : e) }));

            /* ── Auto Bill Number helper ──────────────────────────────────────────
               Scans all existing non-GST stockOut entries for BILL-NNN style
               numbers and returns the next one in sequence (BILL-001, BILL-002…).
               Numbers without the prefix are also counted to avoid gaps.
            ──────────────────────────────────────────────────────────────────── */
            const getNextBillNo = () => {
                const allBillNos = (state.stockOut || [])
                    .map(e => e.billNo || "")
                    .filter(b => b && !b.startsWith("GST-"));
                let maxSeq = 0;
                allBillNos.forEach(b => {
                    const m = b.match(/(?:BILL-?)(\d+)$/i);
                    if (m) { const n = parseInt(m[1], 10); if (n > maxSeq) maxSeq = n; }
                });
                return "BILL-" + String(maxSeq + 1).padStart(3, "0");
            };

            /* ── Auto GST Invoice Number helper ──────────────────────────────────
               Scans ALL existing GST invoice numbers for the current financial
               year (GST-YYYY-NNN), finds the highest sequence number used, and
               returns the next one.  This guarantees:
                 • No repeats even after deletions
                 • Strict sequential order (001, 002, 003 …)
                 • Year resets automatically when the calendar year changes
            ──────────────────────────────────────────────────────────────────── */
            const getNextGstNo = () => {
                const yr = new Date().getFullYear();
                const prefix = "GST-" + yr + "-";
                let maxSeq = 0;
                (state.gstInvoices || []).forEach(inv => {
                    const no = (inv.invoiceNo || "").trim();
                    if (no.startsWith(prefix)) {
                        const n = parseInt(no.slice(prefix.length), 10);
                        if (!isNaN(n) && n > maxSeq) maxSeq = n;
                    }
                });
                return prefix + String(maxSeq + 1).padStart(3, "0");
            };

            const openM = (t, preset) => {
                const autoBillNo = t === "stockOut" ? getNextBillNo() : "";
                setModal(t);
                setForm({ date: today(), paidAmount: "", settleMode: "cash", linkedPartyId: "", newPartyName: "", newPartyCredit: "", siItems: [{ bottleType: "", category: "normal", batchNo: "", qty: "", ratePerUnit: "" }], soItems: [{ bottleType: "", category: "normal", qty: "", ratePerUnit: "" }], billNo: autoBillNo, _autoBillNo: autoBillNo, ...(preset || {}) });
            };
            const closeM = () => { setModal(null); setForm({}); };

            const [isAdmin, setIsAdmin] = React.useState(false);
            const toggleAdmin = () => {
                if (isAdmin) { setIsAdmin(false); return; }
                const pin = window.prompt("Enter Admin PIN (Default: 0000):");
                if (pin === (state.settings?.adminPin || "0000")) {
                    setIsAdmin(true);
                } else if (pin !== null) {
                    alert("Incorrect PIN");
                }
            };

            const withLog = (p, action, module, entryId, desc) => {
                const log = p.auditLog || [];
                return { ...p, auditLog: [{ id: gid(), ts: new Date().toISOString(), action, module, entryId, desc, user: user.email }, ...log].slice(0, 200) };
            };

            // ── Auto-settle: tick checkbox when balance reaches zero, untick when it rises again ──
            useEffect(() => {
                let changed = false;
                const nextCreds = (state.creditors || []).map(c => {
                    const bal = creditorBal(c);
                    const totalDue = Number(c.amount) + creditorFromStock(c.id) + creditorFromOther(c.id);
                    const shouldSettle = bal === 0 && totalDue > 0;
                    // Only auto-manage if not manually toggled
                    if (!c.manualCheck) {
                        if (shouldSettle !== !!c.checked) { changed = true; return { ...c, checked: shouldSettle, autoSettled: shouldSettle }; }
                    }
                    return { ...c, autoSettled: shouldSettle && !!c.checked };
                });
                const nextDebs = (state.debtors || []).map(d => {
                    const bal = debtorBal(d);
                    const totalDue = Number(d.amount) + debtorFromStock(d.id) + debtorFromOther(d.id);
                    const shouldSettle = bal === 0 && totalDue > 0;
                    if (!d.manualCheck) {
                        if (shouldSettle !== !!d.checked) { changed = true; return { ...d, checked: shouldSettle, autoSettled: shouldSettle }; }
                    }
                    return { ...d, autoSettled: shouldSettle && !!d.checked };
                });
                if (changed) upd(p => ({ ...p, creditors: nextCreds, debtors: nextDebs }));
            }, [cashBal, totalCreditors, totalDebtors, si.length, so.length, cash.length, ple.length, te.length]);
            const buildTSD = (entries, amtField) => { const m = {}; entries.forEach(e => { const d = new Date(e.date), k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); m[k] = (m[k] || 0) + Number(e[amtField] || 0); }); return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0])).map(([l, v]) => ({ l, v })); };

            const resolveSettle = (frm, amount, date, description, entryId, direction) => {
                const { settleMode, linkedPartyId, newPartyName, newPartyCredit, paidAmount } = frm;
                let partyId = null, partyName = "", createdCreditorId = null, createdDebtorId = null;
                const cashEffects = [];
                const paidVal = Number(paidAmount || 0);

                if (settleMode === "cash") {
                    partyName = "Cash";
                    cashEffects.push({ id: gid(), dir: direction, payType: direction === "in" ? "Other Income Receipt" : "Expense Payment", description, amount, date, sourceId: entryId, linkedId: null });
                } else if (settleMode === "creditor") {
                    if (linkedPartyId === "__new__") {
                        createdCreditorId = gid();
                        partyId = createdCreditorId;
                        partyName = newPartyName || "New Creditor";
                    } else {
                        partyId = linkedPartyId;
                        partyName = creds.find(c => c.id === linkedPartyId)?.name || "";
                    }
                    if (paidVal > 0) {
                        cashEffects.push({
                            id: gid(),
                            dir: direction,
                            payType: direction === "in" ? "Debtor Payment" : "Creditor Payment",
                            description: `Partial payment for ${description}`,
                            amount: paidVal,
                            date,
                            sourceId: entryId,
                            linkedId: partyId
                        });
                    }
                } else if (settleMode === "debtor") {
                    if (linkedPartyId === "__new__") {
                        createdDebtorId = gid();
                        partyId = createdDebtorId;
                        partyName = newPartyName || "New Debtor";
                    } else {
                        partyId = linkedPartyId;
                        partyName = debs.find(d => d.id === linkedPartyId)?.name || "";
                    }
                    if (paidVal > 0) {
                        cashEffects.push({
                            id: gid(),
                            dir: direction,
                            payType: direction === "in" ? "Debtor Payment" : "Creditor Payment",
                            description: `Partial receipt for ${description}`,
                            amount: paidVal,
                            date,
                            sourceId: entryId,
                            linkedId: partyId
                        });
                    }
                }
                return { partyId, partyName, createdCreditorId, createdDebtorId, cashEffects };
            };

            const cascadeDelete = (key, id) => {
                if (!isAdmin) { alert("Locked 🔒: Switch to Admin Mode to delete entries."); return; }
                setState(p => {
                    const entry = (p[key] || []).find(e => e.id === id); if (!entry) return p;
                    let np = { ...p, [key]: (p[key] || []).filter(e => e.id !== id) };
                    np.cashEntries = (np.cashEntries || []).filter(e => e.sourceId !== id);
                    if (key === "gstInvoices") {
                        np.stockOut = (np.stockOut || []).filter(x => x.gstInvoiceId !== id);
                    }
                    if (key === "cashEntries") {
                        np.plEntries = (np.plEntries || []).filter(e => e.sourceId !== id);
                        np.tradingEntries = (np.tradingEntries || []).filter(e => e.sourceId !== id);
                    }
                    // Reverse cascade: if deleting a P&L or Trading entry that was auto-created
                    // by a Cash Book entry (has sourceId pointing to a cash entry), remove that cash entry too.
                    if ((key === "plEntries" || key === "tradingEntries") && entry.sourceId) {
                        const srcCash = (np.cashEntries || []).find(e => e.id === entry.sourceId);
                        if (srcCash) {
                            np.cashEntries = (np.cashEntries || []).filter(e => e.id !== entry.sourceId);
                            np = withLog(np, "DELETE", "cashEntries", entry.sourceId, `Auto-removed linked Cash entry for deleted ${key} entry`);
                        }
                    }
                    if (entry.createdCreditorId) np.creditors = (np.creditors || []).filter(c => c.id !== entry.createdCreditorId);
                    if (entry.createdDebtorId) np.debtors = (np.debtors || []).filter(d => d.id !== entry.createdDebtorId);
                    if (key === "creditors") np.cashEntries = (np.cashEntries || []).filter(e => !(e.dir === "out" && e.linkedId === id));
                    if (key === "debtors") np.cashEntries = (np.cashEntries || []).filter(e => !(e.dir === "in" && e.linkedId === id));
                    // Stock In paid from raw material: restore pool balance (total-based tracking)
                    if (key === "stockIn" && entry.settleMode === "rawMaterial") {
                        if (entry.linkedRawMaterials && entry.linkedRawMaterials.length > 0) {
                            np.rawMaterialPayments = (np.rawMaterialPayments || []).map(r => {
                                const deduction = entry.linkedRawMaterials.find(d => d.id === r.id);
                                return deduction
                                    ? { ...r, usedForStockIn: Math.max(0, (r.usedForStockIn || 0) - Number(deduction.amount)) }
                                    : r;
                            });
                        } else if (entry.linkedRawMaterialId) {
                            // Fallback for older entries using base cost (qty * ratePerUnit) instead of totalAmount
                            const baseCost = Number(entry.qty || 0) * Number(entry.ratePerUnit || 0);
                            np.rawMaterialPayments = (np.rawMaterialPayments || []).map(r =>
                                r.id === entry.linkedRawMaterialId
                                    ? { ...r, usedForStockIn: Math.max(0, (r.usedForStockIn || 0) - baseCost) }
                                    : r
                            );
                        }
                    }
                    if (key === "depreciationAssets" && entry.bsAssetId) {
                        const na = { ...np.balanceSheet.assets };
                        if (na[entry.bsAssetId]) {
                            na[entry.bsAssetId] = {
                                ...na[entry.bsAssetId],
                                linkedDeprId: null,
                                autoFromDepr: false
                            };
                        }
                        np.balanceSheet = { ...np.balanceSheet, assets: na };
                    }
                    np = withLog(np, "DELETE", key, id, `Deleted entry from ${key}`);
                    return np;
                });

                    cgstAmount = gstType === "cgst_sgst" ? Math.round(gstAmtV / 2 * 100) / 100 : 0;
                    sgstAmount = gstType === "cgst_sgst" ? Math.round(gstAmtV / 2 * 100) / 100 : 0;
                    igstAmount = gstType === "igst" ? gstAmtV : 0;
                }

                const isDup = (state.cashEntries || []).some(e => !e.isPending && e.date === form.date && e.amount === baseAmt && e.linkedId === (form.linkedId || null) && e.payType === form.payType);
                if (isDup && !window.confirm("Possible duplicate entry detected (same amount and party on this date). Save anyway?")) return;

                const id = gid();
                const noAggTypes = ["Creditor Payment", "Debtor Payment", "Loan Repayment", "Interest on Loan Repayment", "Sales Return Refund", "Purchase Return Receipt", "GST Tax Payment", "Asset Down Payment", "Expense Payment", "Other Payment", "Other Income Receipt", "Stock Purchase Payment", "Sales Receipt"];
                upd(p => {
                    const descLower = form.description.toLowerCase().trim();
                    const canAgg = !noAggTypes.includes(form.payType);
                    const existing = canAgg ? p.cashEntries.find(e => !e.isPending && e.description.toLowerCase().trim() === descLower && e.payType === form.payType && e.dir === form.dir) : null;
                    let np = { ...p };

                    // ── P&L / Trading mirror logic ────────────────────────────────────────
                    // For Expense/Income/Stock/Sales cash entries, maintain a corresponding
                    // P&L or Trading entry so the accounting books stay complete.
                    // We aggregate into an EXISTING P&L/Trading entry with the same description
                    // to avoid creating duplicate line items on repeat payments.
                    let relId = null;
                    const isExpPmt = form.payType === "Expense Payment" || form.payType === "Other Payment";
                    const isIncPmt = form.payType === "Other Income Receipt";
                    const isStockPmt = form.payType === "Stock Purchase Payment";
                    const isSaleRct = form.payType === "Sales Receipt";

                    if (!existing) {
                        if (isExpPmt) {
                            const plSide = "expense";
                            const plCat = form.payType === "Expense Payment" ? "Other Expenses" : "Admin Expenses";
                            const existPL = (np.plEntries || []).find(e =>
                                e.side === plSide && e.description.toLowerCase().trim() === descLower && e.sourceId
                            );
                            if (existPL) {
                                // Aggregate into existing P&L entry
                                relId = existPL.id;
                                np.plEntries = np.plEntries.map(e => e.id === existPL.id
                                    ? { ...e, amount: e.amount + baseAmt, gstAmount: (e.gstAmount || 0) + gstAmtV, totalAmount: (e.totalAmount || e.amount) + totalAmtV, cgstAmount: (e.cgstAmount || 0) + cgstAmount, sgstAmount: (e.sgstAmount || 0) + sgstAmount, igstAmount: (e.igstAmount || 0) + igstAmount }
                                    : e);
                            } else {
                                relId = gid();
                                np.plEntries = [...(np.plEntries || []), {
                                    id: relId, date: form.date, side: plSide, category: plCat,
                                    description: form.description, amount: baseAmt,
                                    gstRate: gstRateV, gstAmount: gstAmtV, totalAmount: totalAmtV,
                                    settleMode: "cash", linkedPartyId: null, linkedPartyName: "Cash", sourceId: id,
                                    gstType, cgstAmount, sgstAmount, igstAmount
                                }];
                            }
                        } else if (isIncPmt) {
                            const existPL = (np.plEntries || []).find(e =>
                                e.side === "income" && e.description.toLowerCase().trim() === descLower && e.sourceId
                            );
                            if (existPL) {
                                relId = existPL.id;
                                np.plEntries = np.plEntries.map(e => e.id === existPL.id
                                    ? { ...e, amount: e.amount + baseAmt, gstAmount: (e.gstAmount || 0) + gstAmtV, totalAmount: (e.totalAmount || e.amount) + totalAmtV, cgstAmount: (e.cgstAmount || 0) + cgstAmount, sgstAmount: (e.sgstAmount || 0) + sgstAmount, igstAmount: (e.igstAmount || 0) + igstAmount }
                                    : e);
                            } else {
                                relId = gid();
                                np.plEntries = [...(np.plEntries || []), {
                                    id: relId, date: form.date, side: "income", category: "Other Income",
                                    description: form.description, amount: baseAmt,
                                    gstRate: gstRateV, gstAmount: gstAmtV, totalAmount: totalAmtV,
                                    settleMode: "cash", linkedPartyId: null, linkedPartyName: "Cash", sourceId: id,
                                    gstType, cgstAmount, sgstAmount, igstAmount
                                }];
                            }
                        } else if (isStockPmt) {
                            const existTE = (np.tradingEntries || []).find(e =>
                                e.side === "dr" && e.description.toLowerCase().trim() === descLower && e.sourceId
                            );
                            if (existTE) {
                                relId = existTE.id;
                                np.tradingEntries = np.tradingEntries.map(e => e.id === existTE.id
                                    ? { ...e, amount: e.amount + baseAmt, gstAmount: (e.gstAmount || 0) + gstAmtV, totalAmount: (e.totalAmount || e.amount) + totalAmtV, cgstAmount: (e.cgstAmount || 0) + cgstAmount, sgstAmount: (e.sgstAmount || 0) + sgstAmount, igstAmount: (e.igstAmount || 0) + igstAmount }
                                    : e);
                            } else {
                                relId = gid();
                                np.tradingEntries = [...(np.tradingEntries || []), {
                                    id: relId, date: form.date, side: "dr",
                                    description: form.description, amount: baseAmt,
                                    gstRate: gstRateV, gstAmount: gstAmtV, totalAmount: totalAmtV,
                                    settleMode: "cash", linkedPartyId: null, linkedPartyName: "Cash", sourceId: id,
                                    gstType, cgstAmount, sgstAmount, igstAmount
                                }];
                            }
                        } else if (isSaleRct) {
                            const existTE = (np.tradingEntries || []).find(e =>
                                e.side === "cr" && e.description.toLowerCase().trim() === descLower && e.sourceId
                            );
                            if (existTE) {
                                relId = existTE.id;
                                np.tradingEntries = np.tradingEntries.map(e => e.id === existTE.id
                                    ? { ...e, amount: e.amount + baseAmt, gstAmount: (e.gstAmount || 0) + gstAmtV, totalAmount: (e.totalAmount || e.amount) + totalAmtV, cgstAmount: (e.cgstAmount || 0) + cgstAmount, sgstAmount: (e.sgstAmount || 0) + sgstAmount, igstAmount: (e.igstAmount || 0) + igstAmount }
                                    : e);
                            } else {
                                relId = gid();
                                np.tradingEntries = [...(np.tradingEntries || []), {
                                    id: relId, date: form.date, side: "cr",
                                    description: form.description, amount: baseAmt,
                                    gstRate: gstRateV, gstAmount: gstAmtV, totalAmount: totalAmtV,
                                    settleMode: "cash", linkedPartyId: null, linkedPartyName: "Cash", sourceId: id,
                                    gstType, cgstAmount, sgstAmount, igstAmount
                                }];
                            }
                        }
                    }

                    if (existing) {
                        np.cashEntries = np.cashEntries.map(e => e.id === existing.id ? { ...e, amount: e.amount + baseAmt } : e);
                    } else {
                        np.cashEntries = [...np.cashEntries, { id, date: form.date, dir: form.dir, payType: form.payType, description: form.description || "", amount: baseAmt, gstRate: gstRateV, gstAmount: isGstPayment ? (cgstAmount + sgstAmount + igstAmount) : gstAmtV, linkedId: form.linkedId || null, sourceId: relId || null, billNo: form.billNo || null, gstType: gstType || "", cgstAmount: cgstAmount || 0, sgstAmount: sgstAmount || 0, igstAmount: igstAmount || 0 }];
                    }
                    // Remove pending entries when actual payment clears creditor/debtor
                    if (form.dir === "out" && form.payType === "Creditor Payment" && form.linkedId) {
                        np.cashEntries = np.cashEntries.filter(e => !(e.isPending && e.dir === "out" && e.linkedId === form.linkedId));
                    }

                        np.cashEntries = np.cashEntries.filter(e => !(e.isPending && e.dir === "in" && e.linkedId === form.linkedId));
                    }
                    return withLog(np, existing ? "UPDATE" : "CREATE", "cashEntries", existing ? existing.id : id, `${existing ? "Aggregated" : "Added"} Cash ${form.dir === "in" ? "In" : "Out"}: ${form.payType}`);
                }); closeM();
            };
            const applyDepr = () => {
                if (!form.bsAssetId || !form.depRate || !form.method || !form.period) { alert("Select a Balance Sheet asset and fill all fields"); return; }
                if (Number(form.depRate) <= 0 || Number(form.depRate) > 100) { alert("Depreciation Rate must be between 0 and 100"); return; }
                const bsAsset = Object.values(state.balanceSheet?.assets || {}).find(a => a.id === form.bsAssetId);
                if (!bsAsset) { alert("Asset not found"); return; }

            const deleteOpeningStock = () => {

            const sp = { form, setForm, creds, debs, rawMats: state.rawMaterialPayments || [] };

            if (loading) return <div style={{ minHeight: "100vh", background: "#0f172a", display: "flex", alignItems: "center", justifyContent: "center", color: "#a855f7", fontSize: 16, fontWeight: 700 }}>💧 Loading your data…</div>;

            return (<div id="app-root" style={{ minHeight: "100vh", background: "linear-gradient(135deg,#0f172a 60%,#1e1b4b)", color: C.text }}>

                        <div><div style={{ fontSize: 18, fontWeight: 900, color: "#fff" }}>💧 {state.settings?.companyProfile?.name || "YORS ENTERPRISE"}</div><div style={{ fontSize: 10, color: "#c4b5fd" }}>Accounting Suite</div></div>
                        <div style={{ textAlign: "right", fontSize: 11 }}>

                                <button onClick={() => auth.signOut()} style={{ background: "transparent", border: "1px solid #7c3aed", color: "#c4b5fd", borderRadius: 5, padding: "2px 8px", cursor: "pointer", fontSize: 10 }}>Sign Out</button>

                                <div>

                        </div>
                    )}

                    {tab === "Dashboard" && <div>
                        <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 14, color: C.purple }}>📊 Dashboard</div>

                        {/* Company / GSTIN Info Banner */}
                        {(() => {

                                <div style={{ background: "linear-gradient(90deg,#1e293b,#0f172a)", border: "1.5px dashed #7c3aed", borderRadius: 12, padding: "12px 18px", marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                    <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                                        <span style={{ fontSize: 22 }}>🏛️</span>

                                    {isAdmin && <button onClick={() => openM("settings", { adminPin: state.settings?.adminPin || "", compName: state.settings?.companyProfile?.name || "", compGstin: "", compStateCode: state.settings?.companyProfile?.stateCode || "19", compAddress: state.settings?.companyProfile?.address || "", compPhone: state.settings?.companyProfile?.phone || "" })} style={{ ...BTNP("linear-gradient(90deg,#7c3aed,#6366f1)"), padding: "6px 14px", whiteSpace: "nowrap" }}>⚙️ Set GSTIN</button>}

                        <div style={{ display: "flex", gap: 9, flexWrap: "wrap", marginBottom: 18 }}>
                            {[["Purchases (Net)", fc(totalPurchases), "#6366f1,#8b5cf6"], ["Purch. Returns", fc(purchaseReturnsAmt), "#f59e0b,#b45309"], ["Sales (Net)", fc(totalSales), "#0ea5e9,#0284c7"], ["Sales Returns", fc(salesReturnsAmt), "#ef4444,#b91c1c"], ["Gross P&L", fabs(grossProfit) + (grossProfit >= 0 ? "▲" : "▼"), grossProfit >= 0 ? "#22c55e,#16a34a" : "#ef4444,#dc2626"], ["COGS", fc(fifoCOGS), "#f59e0b,#d97706"], ["Closing Stock", fc(fifoClosing), "#8b5cf6,#7c3aed"], ["Cash", fc(cashBal), cashBal >= 0 ? "#0891b2,#0ea5e9" : "#b45309,#d97706"], ["Creditors", fc(totalCreditors), "#f59e0b,#d97706"], ["Debtors", fc(totalDebtors), "#8b5cf6,#7c3aed"], ["Depreciation", fc(totalDepreciation), "#64748b,#475569"], ["Net P&L", fabs(netPL) + (netPL >= 0 ? "▲" : "▼"), netPL >= 0 ? "#16a34a,#15803d" : "#dc2626,#b91c1c"]].map(([l, v, g]) => (

                        {(() => {

                            <div style={CARD(grossProfit >= 0 ? "#0891b2,#0ea5e9" : "#ef4444,#dc2626")}><div style={{ fontSize: 9 }}>Gross P&L</div><div style={{ fontSize: 14, fontWeight: 900 }}>{fabs(grossProfit) + (grossProfit >= 0 ? "▲" : "▼")}</div></div>

                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}><span style={{ color: C.muted }}>Purchases (Gross)</span><span style={{ color: C.red, fontWeight: 600 }}>{fc(grossPurchases)}</span></div>
                                {purchaseReturnsAmt > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}><span style={{ color: C.amber }}>Less: Purchase Returns</span><span style={{ color: C.green, fontWeight: 600 }}>({fc(purchaseReturnsAmt)})</span></div>}
                                {(() => {

                                    const otherEntries = te.filter(e => e.side === "dr" && e.sourceType !== "rawMaterial");

                                <div style={{ borderTop: "1px solid #334155", paddingTop: 6, fontWeight: 800, color: C.red, textAlign: "right" }}>Total Dr: {fc(tradingDr)}</div>

                    {tab === "Inventory" && (() => {
                        /* ── Apply all filters to get filtered batches per FIFO group ── */
                        const getFilteredBatches = (batches) => {
                            return batches.filter(b => {
                                if (invFilter.godown !== "All" && b.godown !== invFilter.godown) return false;
                                if (invFilter.dateFrom && b.date < invFilter.dateFrom) return false;
                                if (invFilter.dateTo && b.date > invFilter.dateTo) return false;
                                if (invFilter.search && !(b.batchNo || "").toLowerCase().includes(invFilter.search.toLowerCase())) return false;
                                if (invFilter.status !== "All") {
                                    const st = b.remQty === 0 ? "Exhausted" : b.remQty === b.origQty ? "Untouched" : "Partial";
                                    if (invFilter.status !== st) return false;
                                }
                                return true;
                            });
                        };

                        /* ── Compute filtered totals across all FIFO groups ── */
                        const filteredGroups = Object.keys(fifo).filter(k => {
                            const [bt, cat] = k.split("_");
                            if (!fifo[k].inQty) return false;
                            if (invFilter.bt !== "All" && bt !== invFilter.bt) return false;
                            if (invFilter.cat !== "All" && cat !== invFilter.cat) return false;
                            return true;
                        }).map(k => {
                            const [bt, cat] = k.split("_"), f = fifo[k];
                            const fb = getFilteredBatches(f.batches);
                            const filteredInQty = fb.reduce((a, b) => a + b.origQty, 0);
                            const filteredOutQty = fb.reduce((a, b) => a + (b.origQty - b.remQty), 0);
                            const filteredClosing = fb.reduce((a, b) => a + b.remQty * b.rate, 0);
                            const filteredCogs = fb.reduce((a, b) => a + (b.origQty - b.remQty) * b.rate, 0);
                            const filteredPurchased = fb.reduce((a, b) => a + b.origQty * b.rate, 0);
                            return { key: k, bt, cat, f, fb, filteredInQty, filteredOutQty, filteredClosing, filteredCogs, filteredPurchased };
                        });

                        const fTotalPurchased = filteredGroups.reduce((a, g) => a + g.filteredPurchased, 0);
                        const fTotalSold = filteredGroups.reduce((a, g) => a + g.filteredCogs, 0);
                        const fTotalCOGS = filteredGroups.reduce((a, g) => a + g.filteredCogs, 0);
                        const fTotalClosing = filteredGroups.reduce((a, g) => a + g.filteredClosing, 0);
                        const fTotalUnits = filteredGroups.reduce((a, g) => a + g.filteredInQty - g.filteredOutQty, 0);
                        const hasActiveFilter = invFilter.bt !== "All" || invFilter.cat !== "All" || invFilter.godown !== "All" || invFilter.dateFrom || invFilter.dateTo || invFilter.status !== "All" || invFilter.search;

                        return <div>
                            <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 14, color: C.blue }}>📦 Inventory (FIFO)</div>

                            {/* ── Summary Cards ── */}
                            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
                                {[["Purchased", fc(fTotalPurchased), "#6366f1,#8b5cf6"], ["COGS", fc(fTotalCOGS), "#f59e0b,#d97706"], ["Closing Value", fc(fTotalClosing), "#8b5cf6,#7c3aed"], ["Balance", fTotalUnits + " units", "#0ea5e9,#0284c7"]].map(([l, v, g]) => (
                                    <div key={l} style={CARD(g)}><div style={{ fontSize: 9 }}>{l}{hasActiveFilter ? " (filtered)" : ""}</div><div style={{ fontSize: 13, fontWeight: 900 }}>{v}</div></div>
                                ))}
                            </div>

                            {/* ── Filter Bar ── */}
                            <div style={{ background: C.mid, borderRadius: 12, padding: 14, marginBottom: 14, border: "1px solid " + C.border }}>
                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                                    <div style={{ fontSize: 11, fontWeight: 700, color: C.muted }}>🔍 FILTERS</div>
                                    {hasActiveFilter && <button onClick={() => setInvFilter({ bt: "All", cat: "All", godown: "All", dateFrom: "", dateTo: "", status: "All", search: "" })} style={{ ...BTNP("#ef4444"), padding: "4px 12px", fontSize: 10 }}>✕ Clear All</button>}
                                </div>
                                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                                    {/* Dropdowns */}
                                    {[["bt", "Bottle Type", ["All", ...BOTTLE_TYPES]], ["cat", "Category", ["All", "normal", "customized"]], ["godown", "Godown", ["All", ...GODOWNS]], ["status", "Status", ["All", "Untouched", "Partial", "Exhausted"]]].map(([k, label, opts]) => (
                                        <div key={k} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                                            <label style={{ fontSize: 9, color: C.muted, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</label>
                                            <select style={{ ...INP, width: "auto", marginBottom: 0, minWidth: 90, border: invFilter[k] !== "All" ? "1.5px solid #818cf8" : "1.5px solid " + C.border }} value={invFilter[k]} onChange={e => setInvFilter(f => ({ ...f, [k]: e.target.value }))}>{opts.map(o => <option key={o}>{o}</option>)}</select>

                                    <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>

                                {hasActiveFilter && <div style={{ marginTop: 8, fontSize: 10, color: "#818cf8" }}>

                                            {[["Bal", (filteredInQty - filteredOutQty) + " units", C.text], ["Value", fc(filteredClosing), C.violet], ["COGS", fc(filteredCogs), C.amber]].map(([l, v, c]) => (

                                            return (<tr key={b.batchNo}><td style={TDS}><span style={{ fontFamily: "monospace", color: "#818cf8", fontSize: 10 }}>{b.batchNo}</span></td><td style={TDS}>{b.date}</td><td style={TDS}><Badge label={b.godown} color="#7c3aed" /></td><td style={TDS}>{b.origQty}</td><td style={TDS}>{fc(b.rate)}</td><td style={{ ...TDS, color: C.red }}>{issued}</td><td style={{ ...TDS, fontWeight: 700, color: b.remQty > 0 ? C.green : C.muted }}>{b.remQty}</td><td style={{ ...TDS, color: C.violet }}>{fc(b.remQty * b.rate)}</td><td style={TDS}><Badge label={st} color={sc} /></td></tr>);

                                    </table>
                                </div>);

                            </div>}
                        </div>;
                    })()}

                    {tab === "Stock In" && <div>

                                                <span style={{ color: "#6b7280", fontWeight: 700 }}>State Code</span><span>{inv.clientStateCode}</span>

                                            </div>
                                        </div>
                                        <div style={{ border: "1px solid #000", borderTop: "none", borderLeft: "none", padding: "10px 14px" }}>
                                            <div style={{ fontSize: 9, color: "#1e3a5f", fontWeight: 800, textTransform: "uppercase", letterSpacing: 1, marginBottom: 5, borderBottom: "1px solid #e2e8f0", paddingBottom: 3 }}>Ship To (Consignee)</div>
                                            <div style={{ fontWeight: 900, fontSize: 13, marginBottom: 3 }}>{inv.shipToName || inv.clientName}</div>
                                            {(inv.shipToAddress || inv.clientAddress) && <div style={{ fontSize: 10, lineHeight: "1.5", color: "#374151", marginBottom: 4 }}>{inv.shipToAddress || inv.clientAddress}</div>}

                                                <span style={{ color: "#6b7280", fontWeight: 700 }}>GSTIN</span><span style={{ fontWeight: 700 }}>{inv.shipToGstin || inv.clientGstin || "URP — Unregistered Person"}</span>

                                                {(inv.shipToPhone || inv.clientPhone) && <><span style={{ color: "#6b7280", fontWeight: 700 }}>Phone</span><span>{inv.shipToPhone || inv.clientPhone}</span></>}
                                            </div>
                                        </div>
                                    </div>

                                    {/* ── Items Table ── */}
                                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 10.5, marginBottom: 0 }}>
                                        <thead>
                                            <tr>
                                                <th className="inv-th" style={{ ...thBorder, textAlign: "center", width: 30 }}>#</th>
                                                <th className="inv-th" style={{ ...thBorder, textAlign: "left" }}>Description of Goods</th>
                                                <th className="inv-th" style={{ ...thBorder, textAlign: "center", width: 55 }}>HSN Code</th>
                                                <th className="inv-th" style={{ ...thBorder, textAlign: "right", width: 45 }}>Qty<br/><span style={{fontWeight:400,fontSize:8}}>(Bottles)</span></th>
                                                <th className="inv-th" style={{ ...thBorder, textAlign: "right", width: 68 }}>Unit Rate<br/><span style={{fontWeight:400,fontSize:8}}>(₹)</span></th>
                                                <th className="inv-th" style={{ ...thBorder, textAlign: "right", width: 80 }}>Taxable<br/><span style={{fontWeight:400,fontSize:8}}>Value (₹)</span></th>

                                                    <th className="inv-th" style={{ ...thBorder, textAlign: "right", width: 72 }}>SGST<br/><span style={{fontWeight:400,fontSize:8}}>Rate | Amt</span></th>

                                                <th className="inv-th" style={{ ...thBorder, textAlign: "right", width: 85 }}>Total Amount<br/><span style={{fontWeight:400,fontSize:8}}>(₹)</span></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {inv.items.map((item, idx) => (
                                                <tr key={idx} className={idx % 2 === 1 ? "inv-altrow" : ""} style={{ background: idx % 2 === 1 ? "#f8fafc" : "#fff" }}>
                                                    <td style={{ ...tdBorder, textAlign: "center", color: "#6b7280" }}>{idx + 1}</td>
                                                    <td style={{ ...tdBorder }}>
                                                        <div style={{ fontWeight: 700 }}>Mineral Water Bottle — {item.bottleType}</div>

                                                    </td>
                                                    <td style={{ ...tdBorder, textAlign: "center", fontWeight: 700 }}>{item.hsnCode || "2201"}</td>
                                                    <td style={{ ...tdBorder, textAlign: "right", fontWeight: 700 }}>{Number(item.qty).toLocaleString("en-IN")}</td>
                                                    <td style={{ ...tdBorder, textAlign: "right" }}>{fn(item.ratePerUnit)}</td>
                                                    <td style={{ ...tdBorder, textAlign: "right" }}>{fn(item.taxableValue)}</td>
                                                    {isIntra ? (<>
                                                        <td style={{ ...tdBorder, textAlign: "right" }}>
                                                            <span style={{ fontSize: 9, color: "#0369a1", fontWeight: 700 }}>{Number(item.cgstRate).toFixed(1)}%</span><br/>

                                                        <td style={{ ...tdBorder, textAlign: "right" }}>
                                                            <span style={{ fontSize: 9, color: "#7c3aed", fontWeight: 700 }}>{Number(item.igstRate).toFixed(1)}%</span><br/>
                                                            <span style={{ fontWeight: 700 }}>{fn(item.igstAmount)}</span>
                                                        </td>

                                                <td style={{ ...tdBorder, textAlign: "right", background: "#e8f0fe", fontSize: 12 }}>{fc(inv.grandTotal)}</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <div style={{ border: "1px solid #000", borderTop: "none", padding: "8px 14px", marginBottom: 0, background: "#fffbeb" }}>

                                        <span style={{ fontSize: 11, fontStyle: "italic", fontWeight: 700, color: "#111" }}>{numToWords(inv.grandTotal)}</span>
                                    </div>

                                    {/* ── HSN-wise Tax Summary + Grand Total Box ── */}

                                        {/* HSN Tax Breakup */}
                                        <div style={{ borderRight: "1px solid #000" }}>
                                            <div style={{ padding: "6px 10px", background: "#f1f5f9", fontSize: 9, fontWeight: 800, textTransform: "uppercase", letterSpacing: 1, color: "#1e3a5f", borderBottom: "1px solid #000" }}>HSN-wise Tax Breakup (Duties &amp; Taxes)</div>
                                            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 9.5 }}>
                                                <thead>
                                                    <tr style={{ background: "#f8fafc" }}>

                                                        <th style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right", color: "#374151" }}>Taxable (₹)</th>
                                                        {isIntra ? (<>
