                                                            <th style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right", color: "#0369a1" }}>SGST %</th>
                                                            <th style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right", color: "#0369a1" }}>SGST ₹</th>
                                                        </>) : (<>
                                                            <th style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right", color: "#7c3aed" }}>IGST %</th>
                                                            <th style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right", color: "#7c3aed" }}>IGST ₹</th>
                                                        </>)}
                                                        <th style={{ border: "1px solid #cbd5e1", borderRight: "none", padding: "4px 6px", textAlign: "right", color: "#374151" }}>Total Tax</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {hsnRows.map((t, idx) => {
                                                        const totalTax = t.cgst + t.sgst + t.igst;
                                                        return (<tr key={idx} style={{ background: idx % 2 === 0 ? "#fff" : "#f8fafc" }}>
                                                            <td style={{ border: "1px solid #e2e8f0", borderLeft: "none", padding: "4px 6px", textAlign: "center", fontWeight: 700 }}>{t.hsn}</td>
                                                            <td style={{ border: "1px solid #e2e8f0", padding: "4px 6px", textAlign: "right" }}>{fn(t.taxable)}</td>
                                                            {isIntra ? (<>
                                                                <td style={{ border: "1px solid #e2e8f0", padding: "4px 6px", textAlign: "right", color: "#0369a1" }}>{Number(t.cgstRate).toFixed(1)}%</td>
                                                                <td style={{ border: "1px solid #e2e8f0", padding: "4px 6px", textAlign: "right", fontWeight: 700, color: "#0369a1" }}>{fn(t.cgst)}</td>
                                                                <td style={{ border: "1px solid #e2e8f0", padding: "4px 6px", textAlign: "right", color: "#0369a1" }}>{Number(t.sgstRate).toFixed(1)}%</td>
                                                                <td style={{ border: "1px solid #e2e8f0", padding: "4px 6px", textAlign: "right", fontWeight: 700, color: "#0369a1" }}>{fn(t.sgst)}</td>
                                                            </>) : (<>
                                                                <td style={{ border: "1px solid #e2e8f0", padding: "4px 6px", textAlign: "right", color: "#7c3aed" }}>{Number(t.igstRate).toFixed(1)}%</td>
                                                                <td style={{ border: "1px solid #e2e8f0", padding: "4px 6px", textAlign: "right", fontWeight: 700, color: "#7c3aed" }}>{fn(t.igst)}</td>
                                                            </>)}
                                                            <td style={{ border: "1px solid #e2e8f0", borderRight: "none", padding: "4px 6px", textAlign: "right", fontWeight: 800 }}>{fn(totalTax)}</td>
                                                        </tr>);
                                                    })}
                                                    {/* HSN totals */}
                                                    <tr style={{ background: "#e8f0fe", fontWeight: 800 }}>
                                                        <td style={{ border: "1px solid #cbd5e1", borderLeft: "none", padding: "4px 6px", textAlign: "center" }}>Total</td>
                                                        <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right" }}>{fn(inv.taxableTotal)}</td>
                                                        {isIntra ? (<>
                                                            <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px" }}></td>
                                                            <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right", color: "#0369a1" }}>{fn(inv.cgstTotal)}</td>
                                                            <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px" }}></td>
                                                            <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right", color: "#0369a1" }}>{fn(inv.sgstTotal)}</td>
                                                        </>) : (<>
                                                            <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px" }}></td>
                                                            <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right", color: "#7c3aed" }}>{fn(inv.igstTotal)}</td>
                                                        </>)}
                                                        <td style={{ border: "1px solid #cbd5e1", borderRight: "none", padding: "4px 6px", textAlign: "right" }}>{fn(Number(inv.cgstTotal || 0) + Number(inv.sgstTotal || 0) + Number(inv.igstTotal || 0))}</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>

                                        {/* Grand Total Summary Box */}
                                        <div style={{ padding: "10px 16px", display: "flex", flexDirection: "column", justifyContent: "flex-end" }}>
                                            <div style={{ fontSize: 9, fontWeight: 800, textTransform: "uppercase", color: "#1e3a5f", letterSpacing: 1, marginBottom: 8 }}>Invoice Summary</div>
                                            <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: "5px 12px", fontSize: 10.5 }}>
                                                <span style={{ color: "#6b7280" }}>Taxable Value</span>
                                                <span style={{ textAlign: "right", fontWeight: 700 }}>₹ {fn(inv.taxableTotal)}</span>
                                                {isIntra ? (<>
                                                    <span style={{ color: "#0369a1" }}>Add: CGST @ {Number(inv.items[0]?.cgstRate || 0).toFixed(1)}%</span>
                                                    <span style={{ textAlign: "right", fontWeight: 700, color: "#0369a1" }}>₹ {fn(inv.cgstTotal)}</span>
                                                    <span style={{ color: "#0369a1" }}>Add: SGST @ {Number(inv.items[0]?.sgstRate || 0).toFixed(1)}%</span>
                                                    <span style={{ textAlign: "right", fontWeight: 700, color: "#0369a1" }}>₹ {fn(inv.sgstTotal)}</span>
                                                </>) : (<>
                                                    <span style={{ color: "#7c3aed" }}>Add: IGST @ {Number(inv.items[0]?.igstRate || 0).toFixed(1)}%</span>
                                                    <span style={{ textAlign: "right", fontWeight: 700, color: "#7c3aed" }}>₹ {fn(inv.igstTotal)}</span>
                                                </>)}
                                                <span style={{ color: "#6b7280" }}>Total GST</span>
                                                <span style={{ textAlign: "right", fontWeight: 700 }}>₹ {fn(Number(inv.cgstTotal || 0) + Number(inv.sgstTotal || 0) + Number(inv.igstTotal || 0))}</span>
                                                {(() => {
                                                    const paid = Number(inv.paidAmount);
                                                    const total = Number(inv.grandTotal);
                                                    const showPartial = inv.settleMode === "debtor" && paid > 0 && paid < total;
                                                    if (!showPartial) return null;
                                                    return (<>
                                                        <span style={{ color: "#16a34a" }}>Advance Received</span>
                                                        <span style={{ textAlign: "right", fontWeight: 700, color: "#16a34a" }}>{fc(paid)}</span>
                                                        <span style={{ color: "#dc2626" }}>Balance Due</span>
                                                        <span style={{ textAlign: "right", fontWeight: 700, color: "#dc2626" }}>{fc(total - paid)}</span>
                                                    </>);
                                                })()}
                                            </div>
                                            <div style={{ marginTop: 10, padding: "8px 10px", background: "#1e3a5f", borderRadius: 6, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                                <span style={{ color: "#fff", fontWeight: 800, fontSize: 11 }}>GRAND TOTAL</span>
                                                <span style={{ color: "#fff", fontWeight: 900, fontSize: 14 }}>{fc(inv.grandTotal)}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* ── Bank Details + Terms ── */}
                                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", border: "1px solid #000", borderTop: "none", marginBottom: 0 }}>
                                        <div style={{ padding: "10px 14px", borderRight: "1px solid #000" }}>
                                            <div style={{ fontSize: 9, fontWeight: 800, textTransform: "uppercase", color: "#1e3a5f", letterSpacing: 1, marginBottom: 6, borderBottom: "1px solid #e2e8f0", paddingBottom: 3 }}>Bank Details (for NEFT/RTGS)</div>
                                            <div style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: "3px 10px", fontSize: 10 }}>
                                                <span style={{ color: "#6b7280", fontWeight: 700 }}>Bank Name</span><span style={{ fontWeight: 700 }}>State Bank of India</span>
                                                <span style={{ color: "#6b7280", fontWeight: 700 }}>A/C No.</span><span style={{ fontWeight: 700, letterSpacing: 1 }}>— Contact Supplier —</span>
                                                <span style={{ color: "#6b7280", fontWeight: 700 }}>IFSC Code</span><span>—</span>
                                                <span style={{ color: "#6b7280", fontWeight: 700 }}>Branch</span><span>Kolkata Main Branch</span>
                                            </div>
                                        </div>
                                        <div style={{ padding: "10px 14px" }}>
                                            <div style={{ fontSize: 9, fontWeight: 800, textTransform: "uppercase", color: "#1e3a5f", letterSpacing: 1, marginBottom: 6, borderBottom: "1px solid #e2e8f0", paddingBottom: 3 }}>Terms &amp; Conditions</div>
                                            <ol style={{ margin: 0, paddingLeft: 14, fontSize: 9.5, color: "#374151", lineHeight: "1.6" }}>
                                                <li>Goods once sold will not be taken back unless damaged in transit.</li>
                                                <li>Payment is due within {inv.clientCreditPeriod || 30} days from invoice date.</li>
                                                <li>Interest @ 18% p.a. will be charged on overdue amounts.</li>
                                                <li>Subject to Kolkata jurisdiction only.</li>
                                                <li>All disputes subject to arbitration under Indian Law.</li>
                                            </ol>
                                        </div>
                                    </div>

                                    {/* ── Declaration + Signature ── */}
                                    <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr", border: "1px solid #000", borderTop: "none" }}>
                                        <div style={{ padding: "10px 14px", borderRight: "1px solid #000", fontSize: 9.5, lineHeight: "1.5", color: "#374151" }}>
                                            <span style={{ fontWeight: 800, color: "#1e3a5f" }}>Declaration: </span>
                                            We declare that this invoice shows the actual price of the goods described and that all particulars are true and correct to the best of our knowledge and belief. The goods are supplied as per the buyer's order and are fit for consumption as per the applicable standards.
                                        </div>
                                        <div style={{ padding: "10px 14px", textAlign: "center", fontSize: 10 }}>
                                            <div style={{ fontWeight: 700, marginBottom: 2 }}>For <strong>{company.name || "YORS WATER"}</strong></div>
                                            <div style={{ height: 40, borderBottom: "1px solid #000", margin: "8px 20px" }}></div>
                                            <div style={{ fontSize: 9.5, color: "#6b7280" }}>Authorised Signatory &amp; Seal</div>
                                        </div>
                                    </div>

                                    {/* ── Footer ── */}
                                    <div style={{ marginTop: 10, textAlign: "center", fontSize: 9, color: "#94a3b8", borderTop: "1px dashed #e2e8f0", paddingTop: 6 }}>
                                        This is a computer-generated invoice. No physical signature required. | Generated by Yors Finance Accounting Suite | {new Date().toLocaleString("en-IN")}
                                    </div>
                                </div>
                                {/* ── END INVOICE ── */}
                            </div>);
                        }

                        // ─── 2. CREATION WIZARD VIEW ───
                        if (showCreateGstInvoice) {
                            return (<div>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                                    <div style={{ fontSize: 16, fontWeight: 800, color: C.teal }}>📄 Issue GST Tax Invoice</div>
                                    <button onClick={() => setShowCreateGstInvoice(false)} style={{ ...BTNP(C.mid), border: "1px solid " + C.border, color: C.muted }}>Cancel</button>
                                </div>

                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1.8fr", gap: 16, alignItems: "start" }}>
                                    <div style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid " + C.border }}>
                                        <div style={{ fontWeight: 800, fontSize: 13, color: C.teal, marginBottom: 12, borderBottom: "1px solid #334155", paddingBottom: 6 }}>📋 Invoice Details</div>

                                        <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 4 }}>Invoice No. *</label>
                                        <input style={INP} placeholder="Invoice No" value={gstInvForm.invoiceNo} onChange={e => setGstInvForm(prev => ({ ...prev, invoiceNo: e.target.value }))} />

                                        <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 4 }}>Invoice Date *</label>
                                        <DateInput value={gstInvForm.date} onChange={v => setGstInvForm(prev => ({ ...prev, date: v }))} />

                                        <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 4 }}>GST Tax Type *</label>
                                        <select style={INP} value={gstInvForm.gstType || "cgst_sgst"} onChange={e => setGstInvForm(prev => { const next = { ...prev, gstType: e.target.value }; const rec = recalculateTotals(next.items, next); return { ...next, ...rec }; })}>
                                            <option value="cgst_sgst">CGST + SGST (Local)</option>
                                            <option value="igst">IGST (Inter-State)</option>
                                        </select>

                                        <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 4 }}>Deduct Stock From Godown *</label>
                                        <select style={INP} value={gstInvForm.godown} onChange={e => setGstInvForm(prev => ({ ...prev, godown: e.target.value }))}>
                                            <option value="">Select Godown *</option>
                                            {GODOWNS.map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>

                                                <select style={INP} value={gstInvForm.newClientType || "Retailer"} onChange={e => setGstInvForm(prev => ({ ...prev, newClientType: e.target.value }))}>
                                                    {CLIENT_TYPES.map(t => <option key={t}>{t}</option>)}
                                                </select>
                                                <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3 }}>Phone</label>
                                                <input style={INP} placeholder="Phone" value={gstInvForm.newClientPhone || ""} onChange={e => setGstInvForm(prev => ({ ...prev, newClientPhone: e.target.value }))} />
                                                <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3 }}>Address</label>
                                                <input style={INP} placeholder="Address" value={gstInvForm.newClientAddress || ""} onChange={e => setGstInvForm(prev => ({ ...prev, newClientAddress: e.target.value }))} />

                                                <input style={INP} placeholder="GSTIN (Optional)" value={gstInvForm.newClientGstin || ""} onChange={e => setGstInvForm(prev => { const next = { ...prev, newClientGstin: e.target.value.toUpperCase() }; return next; })} />
                                                <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3 }}>State Code *</label>

                                            </div>

                                        <div style={{ background: "#0a0f1e", borderRadius: 8, padding: 10, marginTop: 10, border: "1.5px dashed " + C.border }}>

                                                        if (same) {
                                                            next.shipToName = prev.clientName;
                                                            next.shipToGstin = prev.clientGstin;
                                                            next.shipToStateCode = prev.clientStateCode;
                                                            next.shipToAddress = prev.clientAddress;
                                                            next.shipToPhone = prev.clientPhone;
                                                        }
                                                        const rec = recalculateTotals(next.items, next);
                                                        return { ...next, ...rec };
                                                    });
                                                }} />
                                            </div>
                                            {gstInvForm.shipSameAsBill === false && (
                                                <div style={{ display: "grid", gap: 6, marginTop: 6 }}>
                                                    <div>
                                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Consignee/Shipping Name *</label>
                                                        <input style={{ ...INP, marginBottom: 0 }} placeholder="Shipping Name" value={gstInvForm.shipToName || ""} onChange={e => setGstInvForm(prev => ({ ...prev, shipToName: e.target.value }))} />
                                                    </div>
                                                    <div>
                                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Shipping GSTIN</label>

                                                    </div>
                                                    <div>
                                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Shipping State Code *</label>
                                                        <input style={{ ...INP, marginBottom: 0 }} placeholder="Shipping State Code (e.g. 19)" value={gstInvForm.shipToStateCode || ""} onChange={e => setGstInvForm(prev => {
                                                            const next = { ...prev, shipToStateCode: e.target.value };
                                                            const rec = recalculateTotals(next.items, next);
                                                            return { ...next, ...rec };
                                                        })} />
                                                    </div>
                                                    <div>
                                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Shipping Address</label>
                                                        <input style={{ ...INP, marginBottom: 0 }} placeholder="Shipping Address" value={gstInvForm.shipToAddress || ""} onChange={e => setGstInvForm(prev => ({ ...prev, shipToAddress: e.target.value }))} />
                                                    </div>
                                                    <div>
                                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Shipping Phone</label>
                                                        <input style={{ ...INP, marginBottom: 0 }} placeholder="Shipping Phone" value={gstInvForm.shipToPhone || ""} onChange={e => setGstInvForm(prev => ({ ...prev, shipToPhone: e.target.value }))} />
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div style={{ fontWeight: 800, fontSize: 13, color: C.amber, margin: "14px 0 12px 0", borderBottom: "1px solid #334155", paddingBottom: 6 }}>🏛️ Payment Method</div>
                                        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                                            {["debtor", "cash"].map(mode => (
                                                <button key={mode} onClick={() => setGstInvForm(prev => ({ ...prev, settleMode: mode, paidAmount: "" }))} style={{ flex: 1, padding: "8px 4px", border: "2px solid " + (gstInvForm.settleMode === mode ? (mode === "cash" ? C.green : C.violet) : C.border), borderRadius: 7, background: gstInvForm.settleMode === mode ? (mode === "cash" ? C.green + "18" : C.violet + "18") : C.mid, color: gstInvForm.settleMode === mode ? (mode === "cash" ? C.green : C.violet) : C.muted, fontWeight: 700, fontSize: 11, cursor: "pointer" }}>

                                        {gstInvForm.settleMode === "debtor" && (
                                            <div>
                                                <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3 }}>Credit Period (days) *</label>
                                                <input type="number" style={INP} placeholder="Credit Period (days)" value={gstInvForm.clientCreditPeriod || "30"} onChange={e => setGstInvForm(prev => ({ ...prev, clientCreditPeriod: e.target.value }))} />
                                                <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3, marginTop: 8 }}>Immediate Cash Received (₹)</label>
                                                <input type="number" style={INP} placeholder="e.g. 0 for full credit" value={gstInvForm.paidAmount || ""} onChange={e => setGstInvForm(prev => ({ ...prev, paidAmount: e.target.value }))} />
                                                {gstInvForm.paidAmount && Number(gstInvForm.paidAmount) > 0 && Number(gstInvForm.paidAmount) <= gstInvForm.grandTotal && (
                                                    <div style={{ fontSize: 10, color: C.amber, marginTop: 4 }}>
                                                        Remaining <strong>{fc(gstInvForm.grandTotal - Number(gstInvForm.paidAmount))}</strong> will be added on credit.
                                                    </div>
                                                )}
                                                {gstInvForm.paidAmount && Number(gstInvForm.paidAmount) > gstInvForm.grandTotal && (
                                                    <div style={{ fontSize: 10, color: C.red, marginTop: 4 }}>
                                                        ⚠️ Received amount cannot exceed grand total of {fc(gstInvForm.grandTotal)}.
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>

                                    <div style={{ display: "grid", gap: 16 }}>
                                        <div style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid " + C.border }}>
                                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, borderBottom: "1px solid #334155", paddingBottom: 6 }}>
                                                <span style={{ fontWeight: 800, fontSize: 13, color: C.teal }}>🧴 Invoice Line Items</span>
                                                <button onClick={addItemRow} style={{ ...BTNP(), padding: "4px 10px", fontSize: 11 }}>+ Add Item</button>
                                            </div>

                                            {gstInvForm.items.length === 0 ? (

                                                <div style={{ display: "grid", gap: 12 }}>
                                                    {gstInvForm.items.map((item, idx) => (
                                                        <div key={idx} style={{ background: C.dark, borderRadius: 8, padding: 12, border: "1.5px solid " + C.border, display: "grid", gridTemplateColumns: "1.2fr 1fr 1fr 1fr 1fr auto", gap: 8, alignItems: "end" }}>
                                                            <div>
                                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Bottle Type</label>
                                                                <select style={{ ...INP, marginBottom: 0 }} value={item.bottleType} onChange={e => updateFormItem(idx, "bottleType", e.target.value)}>

                                                                </select>
                                                            </div>
                                                            <div>
                                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Category</label>
                                                                <select style={{ ...INP, marginBottom: 0 }} value={item.category} onChange={e => updateFormItem(idx, "category", e.target.value)}>
                                                                    <option>normal</option>
                                                                    <option>customized</option>
                                                                </select>
                                                            </div>
                                                            <div>
                                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Quantity</label>
                                                                <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="Qty" value={item.qty || ""} onChange={e => updateFormItem(idx, "qty", e.target.value)} />
                                                            </div>
                                                            <div>
                                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>Rate/Unit (₹)</label>
                                                                <input type="number" style={{ ...INP, marginBottom: 0 }} placeholder="Rate" value={item.ratePerUnit || ""} onChange={e => updateFormItem(idx, "ratePerUnit", e.target.value)} />
                                                            </div>
                                                            <div>
                                                                <label style={{ fontSize: 9, color: C.muted, fontWeight: 700 }}>GST Rate (%)</label>
                                                                <select style={{ ...INP, marginBottom: 0 }} value={item.gstRate} onChange={e => updateFormItem(idx, "gstRate", e.target.value)}>
                                                                    {[0, 5, 12, 18, 28].map(r => <option key={r} value={r}>{r}%</option>)}
                                                                </select>
                                                            </div>
                                                            <button onClick={() => removeItemRow(idx)} style={{ ...BTND, padding: "8px 10px" }} title="Remove Row">✕</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid " + C.border, display: "grid", gap: 8 }}>
                                            <div style={{ fontWeight: 800, fontSize: 13, color: C.purple, borderBottom: "1px solid #334155", paddingBottom: 6 }}>💰 Summary Calculations</div>
                                            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                                                <span style={{ color: C.muted }}>Taxable Amount:</span>
                                                <span style={{ fontWeight: 700 }}>{fc(gstInvForm.taxableTotal)}</span>
                                            </div>

                                            {String(gstInvForm.clientStateCode || "").trim() === String(company.stateCode || "").trim() ? (<>
                                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.amber }}>
                                                    <span>CGST Collected (auto):</span>
                                                    <span>{fc(gstInvForm.cgstTotal)}</span>
                                                </div>
                                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.amber }}>
                                                    <span>SGST Collected (auto):</span>
                                                    <span>{fc(gstInvForm.sgstTotal)}</span>
                                                </div>
                                            </>) : (
                                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.amber }}>
                                                    <span>IGST Collected (auto):</span>
                                                    <span>{fc(gstInvForm.igstTotal)}</span>
                                                </div>
                                            )}

                                            <div style={{ borderTop: "2px solid #334155", paddingTop: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                                <span style={{ fontWeight: 900, fontSize: 14, color: C.purple }}>GRAND TOTAL:</span>
                                                <span style={{ fontWeight: 900, fontSize: 20, color: C.green }}>{fc(gstInvForm.grandTotal)}</span>
                                            </div>

                                            <button onClick={saveInvoice} style={{ ...BTNP("linear-gradient(90deg,#14b8a6,#0d9488)"), width: "100%", padding: 12, fontSize: 14, fontWeight: 800, marginTop: 10 }}>
                                                💾 Issue & Save GST Invoice
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>);
                        }

                        // ─── 3. DASHBOARD / LIST VIEW (DEFAULT) ───
                        const totalGstInvoiced = invoices.reduce((s, x) => s + x.grandTotal, 0);
                        const totalTaxCollected = invoices.reduce((s, x) => s + x.cgstTotal + x.sgstTotal + x.igstTotal, 0);
                        const cgstCol = invoices.reduce((s, x) => s + x.cgstTotal, 0);
                        const sgstCol = invoices.reduce((s, x) => s + x.sgstTotal, 0);
                        const igstCol = invoices.reduce((s, x) => s + x.igstTotal, 0);

                        return (<div>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                                <div style={{ fontSize: 16, fontWeight: 800, color: C.teal }}>📄 GST Tax Invoices</div>
                                {isAdmin && <button style={BTNP()} onClick={startNewInvoice}>+ Issue GST Invoice</button>}
                            </div>

                            <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 14, marginBottom: 16 }}>
                                <div style={{ background: C.mid, borderRadius: 14, padding: 14, border: "1px solid " + C.border }}>
                                    <div style={{ fontSize: 11, fontWeight: 800, color: C.teal, marginBottom: 8 }}>📄 Invoice Sales Summaries</div>
                                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                                        <div style={{ background: C.dark, padding: 10, borderRadius: 10 }}>
                                            <div style={{ fontSize: 8, color: C.muted }}>Total Invoiced</div>
                                            <div style={{ fontSize: 13, fontWeight: 900, color: C.text }}>{fc(totalGstInvoiced)}</div>
                                        </div>
                                        <div style={{ background: C.dark, padding: 10, borderRadius: 10 }}>
                                            <div style={{ fontSize: 8, color: C.muted }}>GST Tax Collected</div>
                                            <div style={{ fontSize: 13, fontWeight: 900, color: C.teal }}>{fc(totalTaxCollected)}</div>
                                        </div>
                                    </div>
                                </div>
                                <div style={{ background: C.mid, borderRadius: 14, padding: 14, border: "1px solid " + C.border }}>
                                    <div style={{ fontSize: 11, fontWeight: 800, color: C.amber, marginBottom: 8 }}>🏛️ GST Portal Tax Ledger (Head-wise Balance)</div>
                                    <div style={{ overflowX: "auto" }}>
                                        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 10, color: C.text }}>
                                            <thead>
                                                <tr style={{ borderBottom: "1px solid " + C.border, color: C.muted, textAlign: "left" }}>
                                                    <th style={{ padding: "4px 6px" }}>Tax Head</th>
                                                    <th style={{ padding: "4px 6px", textAlign: "right" }}>Output Liability (A)</th>
                                                    <th style={{ padding: "4px 6px", textAlign: "right" }}>Input ITC Claimed (B)</th>
                                                    <th style={{ padding: "4px 6px", textAlign: "right" }}>Tax Paid to Govt (C)</th>
                                                    <th style={{ padding: "4px 6px", textAlign: "right" }}>Net Payable (A-B-C)</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr style={{ borderBottom: "1px solid " + C.border }}>
                                                    <td style={{ padding: "6px", fontWeight: 700 }}>CGST</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.red }}>{fc(cgstOutput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.green }}>{fc(cgstInput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.blue }}>{fc(cgstPaid)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", fontWeight: 700, color: cgstPayable > 0 ? C.amber : C.green }}>{fc(cgstPayable)}</td>
                                                </tr>
                                                <tr style={{ borderBottom: "1px solid " + C.border }}>
                                                    <td style={{ padding: "6px", fontWeight: 700 }}>SGST</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.red }}>{fc(sgstOutput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.green }}>{fc(sgstInput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.blue }}>{fc(sgstPaid)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", fontWeight: 700, color: sgstPayable > 0 ? C.amber : C.green }}>{fc(sgstPayable)}</td>
                                                </tr>
                                                <tr style={{ borderBottom: "1px solid " + C.border }}>
                                                    <td style={{ padding: "6px", fontWeight: 700 }}>IGST</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.red }}>{fc(igstOutput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.green }}>{fc(igstInput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.blue }}>{fc(igstPaid)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", fontWeight: 700, color: igstPayable > 0 ? C.amber : C.green }}>{fc(igstPayable)}</td>
                                                </tr>
                                                <tr style={{ fontWeight: 800, background: "#0a0f1e" }}>
                                                    <td style={{ padding: "6px" }}>Total GST</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.red }}>{fc(totalGstOutput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.green }}>{fc(totalGstInput)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: C.blue }}>{fc(totalGstPaidToGovt)}</td>
                                                    <td style={{ padding: "6px", textAlign: "right", color: totalGstPayable > 0 ? C.amber : C.green }}>{fc(totalGstPayable)}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <div style={{ background: C.mid, borderRadius: 12, overflowX: "auto", border: "1px solid " + C.border }}>
                                <table style={TBL}>
                                    <thead>
                                        <tr>
                                            {["Invoice No", "Date", "Client Name", "Taxable Value", "CGST", "SGST", "IGST", "Grand Total", "Settle Mode", "Actions"].map(h => <th key={h} style={THS}>{h}</th>)}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {invoices.length === 0 ? (
                                            <tr><td colSpan={10} style={{ ...TDS, textAlign: "center", color: C.muted, padding: 32 }}>No GST Invoices issued yet. Click "+ Issue GST Invoice" to begin.</td></tr>

                                            invoices.map(inv => (
                                                <tr key={inv.id}>
                                                    <td style={{ ...TDS, fontWeight: 700, color: C.teal }}>{inv.invoiceNo}</td>
                                                    <td style={TDS}>{inv.date}</td>
                                                    <td style={{ ...TDS, fontWeight: 700 }}>{inv.clientName}</td>
                                                    <td style={TDS}>{fc(inv.taxableTotal)}</td>
                                                    <td style={{ ...TDS, color: C.amber }}>{inv.cgstTotal > 0 ? fc(inv.cgstTotal) : "—"}</td>
                                                    <td style={{ ...TDS, color: C.amber }}>{inv.sgstTotal > 0 ? fc(inv.sgstTotal) : "—"}</td>
                                                    <td style={{ ...TDS, color: C.red }}>{inv.igstTotal > 0 ? fc(inv.igstTotal) : "—"}</td>
                                                    <td style={{ ...TDS, fontWeight: 800, color: C.green }}>
                                                        {fc(inv.grandTotal)}

                                                            <span style={{ display: "block", fontSize: 9, color: C.muted, fontWeight: 500 }}>
                                                                Paid Cash: {fc(inv.paidAmount)}

                                                    <td style={TDS}>
                                                        <Badge label={inv.settleMode === "cash" ? "Cash" : "Debtor"} color={inv.settleMode === "cash" ? C.green : C.violet} />

                                                            <span style={{ display: "block", fontSize: 9, color: C.violet, marginTop: 2, fontWeight: 700 }}>
                                                                Partial Cash
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td style={TDS}>
                                                        <div style={{ display: "flex", gap: 6 }}>
                                                            <button style={{ ...BTNP(), padding: "3px 8px", fontSize: 10 }} onClick={() => setSelectedGstInvoiceId(inv.id)}>👁️ View / Print</button>
                                                            <button style={BTND} onClick={() => cascadeDelete("gstInvoices", inv.id)}>Del</button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>

                            {/* ─── GST REGISTER ─── */}
                            <div style={{ marginTop: 24 }}>
                                <div style={{ fontSize: 14, fontWeight: 800, color: C.amber, marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>
                                    <span>📒</span> GST Register (Input vs Output Set-off)
                                </div>

                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 14 }}>

                                    {/* OUTPUT GST — Sales / Stock Out */}
                                    <div style={{ background: C.mid, borderRadius: 12, border: "1px solid " + C.border, overflow: "hidden" }}>
                                        <div style={{ padding: "10px 14px", background: "linear-gradient(90deg,#2d1919,#1a0a0a)", borderBottom: "1px solid " + C.border, display: "flex", justifyContent: "space-between", alignItems: "center" }}>

                                                                    <td style={{ ...TDS, textAlign: "right", fontSize: 10 }}>{fc(taxable)}</td>
                                                                    <td style={{ ...TDS, textAlign: "right", fontSize: 10 }}>
                                                                        <span style={{ fontWeight: 700, color: x.isReturn ? C.green : C.red }}>{x.isReturn ? "-" : ""}{fc(x.gstAmount || 0)}</span>
                                                                        {(x.gstAmount || 0) > 0 && (() => {

                                                                            const sg = getSGST(x);

                                                        })

                                                </tbody>
                                                {so.filter(x => (x.gstAmount || 0) > 0).length > 0 && (
                                                    <tfoot>
                                                        <tr style={{ background: "#2d1919" }}>
                                                            <td colSpan={3} style={{ ...TDS, fontWeight: 800, fontSize: 10 }}>Total Output GST</td>
                                                            <td style={{ ...TDS, textAlign: "right", fontWeight: 800, fontSize: 10 }}>{fc(so.filter(x => (x.gstAmount || 0) > 0).reduce((a, b) => a + ((b.totalAmount || 0) - (b.gstAmount || 0)), 0))}</td>
                                                            <td style={{ ...TDS, textAlign: "right", fontSize: 10 }}>
                                                                <div style={{ fontWeight: 900, fontSize: 11, color: C.red }}>{fc(totalGstOutput)}</div>
                                                                <div style={{ fontSize: 8, color: C.muted, fontWeight: 500 }}>

                                                        </tr>
                                                    </tfoot>

                                            </table>
                                        </div>
                                    </div>

                                    {/* INPUT GST — Purchases / Stock In (ITC) */}
                                    <div style={{ background: C.mid, borderRadius: 12, border: "1px solid " + C.border, overflow: "hidden" }}>
                                        <div style={{ padding: "10px 14px", background: "linear-gradient(90deg,#102d1a,#0a1e10)", borderBottom: "1px solid " + C.border, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                            <div style={{ fontWeight: 800, fontSize: 12, color: C.green }}>📥 Input GST / ITC (Tax on Purchases)</div>
                                            <div style={{ fontSize: 11, color: C.muted }}>{si.filter(x => (x.gstAmount || 0) > 0 && !x.isReturn).length} entries</div>
                                        </div>
                                        <div style={{ overflowX: "auto", maxHeight: 280, overflowY: "auto" }}>
                                            <table style={TBL}>
                                                <thead>
                                                    <tr>
                                                        {["Date", "Batch No", "Supplier", "Taxable (₹)", "ITC (₹)", "Rate"].map(h => <th key={h} style={{ ...THS, fontSize: 9 }}>{h}</th>)}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {si.filter(x => (x.gstAmount || 0) > 0).length === 0
                                                        ? <tr><td colSpan={6} style={{ ...TDS, textAlign: "center", color: C.muted, fontSize: 11 }}>No GST-tagged purchases yet</td></tr>
                                                        : si.filter(x => (x.gstAmount || 0) > 0).map((x, i) => {
                                                            const taxable = (x.totalAmount || 0) - (x.gstAmount || 0);
                                                            return (
                                                                <tr key={x.id || i} style={{ opacity: x.isReturn ? 0.6 : 1 }}>
                                                                    <td style={{ ...TDS, fontSize: 10 }}>{x.date}</td>
                                                                    <td style={{ ...TDS, fontSize: 10, color: C.blue }}>{x.batchNo || "—"}</td>
                                                                    <td style={{ ...TDS, fontSize: 10 }}>{x.linkedPartyName || "—"}{x.isReturn ? <span style={{ color: C.amber, fontSize: 9, marginLeft: 4 }}>(Return)</span> : ""}</td>

                                                                    <td style={{ ...TDS, textAlign: "right", fontSize: 10 }}>
                                                                        <span style={{ fontWeight: 700, color: x.isReturn ? C.red : C.green }}>{x.isReturn ? "-" : ""}{fc(x.gstAmount || 0)}</span>
                                                                        {(x.gstAmount || 0) > 0 && (() => {
                                                                            const cg = getCGST(x);
                                                                            const sg = getSGST(x);
                                                                            const ig = getIGST(x);
                                                                            if (ig > 0) return <div style={{ fontSize: 8, color: C.muted }}>IGST: {fc(ig)}</div>;
                                                                            return <div style={{ fontSize: 8, color: C.muted }}>C+S: {fc(cg)} + {fc(sg)}</div>;
                                                                        })()}
                                                                    </td>
                                                                    <td style={{ ...TDS, textAlign: "center", fontSize: 10, color: C.muted }}>{x.gstRate ? x.gstRate + "%" : "—"}</td>
                                                                </tr>

                                                        })
                                                    }

                                                {si.filter(x => (x.gstAmount || 0) > 0).length > 0 && (

                                                        <tr style={{ background: "#102d1a" }}>
                                                            <td colSpan={3} style={{ ...TDS, fontWeight: 800, fontSize: 10 }}>Total Input GST (ITC)</td>
                                                            <td style={{ ...TDS, textAlign: "right", fontWeight: 800, fontSize: 10 }}>{fc(si.filter(x => (x.gstAmount || 0) > 0).reduce((a, b) => a + ((b.totalAmount || 0) - (b.gstAmount || 0)), 0))}</td>
                                                            <td style={{ ...TDS, textAlign: "right", fontSize: 10 }}>
                                                                <div style={{ fontWeight: 900, fontSize: 11, color: C.green }}>{fc(totalGstInput)}</div>
                                                                <div style={{ fontSize: 8, color: C.muted, fontWeight: 500 }}>
                                                                    C:{fc(cgstInput)}|S:{fc(sgstInput)}|I:{fc(igstInput)}
                                                                </div>
                                                            </td>
                                                            <td style={TDS}></td>
                                                        </tr>
                                                    </tfoot>

                                            </table>
                                        </div>
                                    </div>
                                </div>

                                {/* GST Payments Made */}
                                {(() => {

                                                            <td style={{ ...TDS, textAlign: "right", fontSize: 10 }}>
                                                                <div style={{ fontWeight: 900, fontSize: 11, color: C.blue }}>{fc(totalGstPaidToGovt)}</div>
                                                                <div style={{ fontSize: 8, color: C.muted, fontWeight: 500 }}>
                                                                    C: {fc(cgstPaid)} | S: {fc(sgstPaid)} | I: {fc(igstPaid)}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </tfoot>
                                                </table>
                                            </div>
                                        </div>

                                })()}

                                {/* ─── SET-OFF STATEMENT ─── */}

                                        🧮 GST Set-Off Statement
                                    </div>

                                            <div style={{ fontSize: 16, fontWeight: 900, color: C.red }}>{fc(totalGstOutput)}</div>

                                            <div style={{ fontSize: 10, color: C.muted, marginBottom: 4 }}>= Net Tax After Set-off</div>
                                            <div style={{ fontSize: 16, fontWeight: 900, color: totalGstOutput - totalGstInput > 0 ? C.amber : C.green }}>{fc(Math.abs(totalGstOutput - totalGstInput))}</div>
                                            <div style={{ fontSize: 9, color: "#94a3b8", marginTop: 4 }}>{totalGstOutput - totalGstInput > 0 ? "Liability after ITC set-off" : "ITC excess (carry forward)"}</div>
                                        </div>
                                    </div>

                                    <div style={{ background: "#0a0f1e", borderRadius: 10, padding: 14, border: "1px solid #1e293b", marginBottom: 14 }}>
                                        <div style={{ fontSize: 10, fontWeight: 800, color: "#94a3b8", marginBottom: 10 }}>Step-by-step ITC Set-off (as per GST rules)</div>
                                        {[
                                            { label: "Output GST Liability", value: totalGstOutput, color: C.red, indent: false, bold: true },
                                            { label: "Less: Input Tax Credit (ITC) Available", value: -Math.min(totalGstInput, totalGstOutput), color: C.green, indent: true, bold: false },
                                            { label: "Net GST Payable (Before Payment)", value: Math.max(0, totalGstOutput - totalGstInput), color: C.amber, indent: false, bold: true },
                                            { label: "Less: GST Already Paid to Govt (Cash)", value: -Math.min(totalGstPaidToGovt, Math.max(0, totalGstOutput - totalGstInput)), color: C.blue, indent: true, bold: false },
                                            { label: "Net GST Balance Payable", value: totalGstPayable, color: totalGstPayable > 0 ? C.red : C.green, indent: false, bold: true, highlight: true },
                                        ].map((row, i) => (
                                            <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: row.highlight ? "8px 10px" : "5px 0", borderRadius: row.highlight ? 8 : 0, background: row.highlight ? (totalGstPayable > 0 ? "#2d1a10" : "#0d2818") : "transparent", marginBottom: row.highlight ? 0 : 2, border: row.highlight ? ("1px solid " + (totalGstPayable > 0 ? C.amber : C.green)) : "none" }}>

                                            </div>
                                        </div>
                                    )}
                                    {totalGstPayable <= 0 && totalGstOutput > 0 && (
                                        <div style={{ background: "#042f2e", borderRadius: 8, padding: "10px 14px", border: "1px solid " + C.green, fontSize: 11, color: C.green }}>

                                        </div>
                                    )}
                                </div>

                            </div>

                        </div>);
                    })()}


                    {tab === "P&L Account" && <div>

                                {grossProfit < 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.red, marginBottom: 4 }}><span>Gross Loss b/d</span><span style={{ fontWeight: 700 }}>{fabs(grossProfit)}</span></div>}

                                {totalLoanInterest > 0 && (
                                    <div style={{ marginBottom: 6 }}>
                                        <div style={{ color: "#94a3b8", fontSize: 10, fontWeight: 700, marginBottom: 2 }}>Finance Costs (auto-accrued)</div>
                                        {Object.values(state.balanceSheet?.liabilities || {})
                                            .filter(e => e.subCategory === "Long Term Borrowings" && e.interestRate)
                                            .map(e => {
                                                const i = calcInterestForEntry(e);
                                                return i.total > 0 ? (
                                                    <div key={e.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, paddingLeft: 8, color: C.amber, marginBottom: 2 }}>
                                                        <span>Interest on {e.description} ({e.interestRate}% p.a.)</span>
                                                        <span>{fc(i.total)}</span>
                                                    </div>
                                                ) : null;
                                            })
                                        }
                                    </div>
                                )}
                                {PL_CATS.expenses.map(cat => { const ents = ple.filter(e => e.side === "expense" && e.category === cat); return ents.length ? <div key={cat} style={{ marginBottom: 6 }}><div style={{ color: "#94a3b8", fontSize: 10, fontWeight: 700, marginBottom: 2 }}>{cat}</div>{ents.map(e => <div key={e.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, paddingLeft: 8, alignItems: "center", marginBottom: 2 }}><span>{e.description}{e.paidAmount > 0 && <span style={{ fontSize: 9, color: C.amber, marginLeft: 4, fontWeight: 700 }}>(Partial Cash: {fc(e.paidAmount)})</span>}</span><span style={{ display: "flex", gap: 5 }}>{fc(e.amount)}<button style={BTND} onClick={() => cascadeDelete("plEntries", e.id)}>✕</button></span></div>)}</div> : null; })}
                                {plExpense === 0 && <div style={{ color: C.muted, fontSize: 11, textAlign: "center", padding: "8px 0" }}>No expenses recorded</div>}
                                <div style={{ borderTop: "2px solid #334155", paddingTop: 6, fontWeight: 900, color: C.red, textAlign: "right" }}>Total Dr: {fc(plExpense)}</div>

                            <div style={{ background: C.mid, borderRadius: 12, padding: 16 }}>
                                <div style={{ fontWeight: 800, color: C.green, fontSize: 12, marginBottom: 6, borderBottom: "1px solid #334155", paddingBottom: 4 }}>Cr — Income</div>
                                {grossProfit >= 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.green, marginBottom: 4 }}><span>Gross Profit b/d</span><span style={{ fontWeight: 700 }}>{fc(grossProfit)}</span></div>}

                                <div style={{ borderTop: "2px solid #334155", paddingTop: 6, fontWeight: 900, color: C.green, textAlign: "right" }}>Total Cr: {fc(plIncome)}</div>
                                {netPL < 0 && <div style={{ color: C.red, fontWeight: 800, textAlign: "right", marginTop: 4, fontSize: 11 }}>Net Loss c/d: {fabs(netPL)}</div>}
                            </div>
                        </div>
                        <div style={{ background: netPL >= 0 ? "#052e16" : "#450a0a", borderRadius: 12, padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>

                            <div style={{ fontWeight: 900, fontSize: 22, color: netPL >= 0 ? C.green : C.red }}>{fabs(netPL)}</div>
                        </div>
                    </div>}

                    {tab === "Cash Book" && <div>

                                            <div style={{ background: "rgba(0,0,0,0.3)", borderRadius: 10, padding: "8px 14px", textAlign: "center" }}><div style={{ fontSize: 8, color: C.muted }}>Normal</div><div style={{ fontSize: 16, fontWeight: 900, color: C.teal }}>{allOrders.filter(e => e.category === "normal").length}</div></div>
