        const db = firebase.firestore();
        // ── Offline Persistence ──────────────────────────────────────────
        // Writes are immediately committed to local IndexedDB and synced to
        // the server in the background. If the page closes before the network
        // write completes, Firestore will replay the pending write on next load.
        // This is the correct fix for entries vanishing on page refresh/close.
        db.enablePersistence({ synchronizeTabs: true })
            .catch(err => {
                if (err.code === 'failed-precondition') {
                    // Multiple tabs open — persistence only works in one tab at a time
                    console.warn('Firestore: offline persistence disabled (multiple tabs open)');
                } else if (err.code === 'unimplemented') {
                    // Browser does not support IndexedDB
                    console.warn('Firestore: offline persistence not supported in this browser');
                } else {
                    console.warn('Firestore: persistence error:', err);
                }
            });

        function computeFIFO(stockIn, stockOut) {
            const results = {};
            const keys = [];
            BOTTLE_TYPES.forEach(bt => {

                        .sort((a, b) => new Date(a.date) - new Date(b.date))
                        .map(x => ({ ...x, origQty: Number(x.qty), remQty: Number(x.qty), rate: Number(x.ratePerUnit), batchNo: x.batchNo, godown: x.godown }));
                    const returns = (stockIn || []).filter(x => (x.bottleType === bt || (bt === "Premium" && x.bottleType === "Premium")) && (x.category || "normal") === cat && x.isReturn);
                    returns.forEach(r => {

                        if (!b) b = batches.find(x => x.godown === r.godown);
                        if (b) {

                        }

                    results[key] = { batches, cogs: 0, closingValue: 0, inQty: batches.reduce((a, b) => a + b.origQty, 0), outQty: 0, balQty: 0, unfulfilledQty: 0 };

                }
                if (toRestore > 0) {
                    for (let i = batches.length - 1; i >= 0 && toRestore > 0; i--) {
                        const restoreAmt = Math.min(toRestore, batches[i].origQty - batches[i].remQty);
                        if (restoreAmt > 0) {
                            batches[i].remQty += restoreAmt;
                            toRestore -= restoreAmt;
                        }
                    }
                }
                if (toRestore > 0) {
                    const fallback = [...batches].reverse().find(b => !godown || norm(b.godown) === godown) || batches[batches.length - 1];
                    if (fallback) { fallback.remQty += toRestore; fallback.origQty += toRestore; }
                }
                if (results[key]) results[key].outQty -= Number(sr.qty);
            });

            // Finalize closing values and balance quantities
            keys.forEach(k => {
                const res = results[k];
                if (res) {
                    let closingVal = 0;
                    res.batches.forEach(b => { closingVal += b.remQty * b.rate; });
                    res.closingValue = closingVal;
                    res.balQty = res.inQty - res.outQty;
                }
            });

            return results;
        }

        function calcDepreciation(asset) {
            const cost = Number(asset.cost || 0), rate = Number(asset.depRate || 0) / 100;
            const startDate = new Date(asset.startDate || today()), now = new Date();
            let mo = (now.getFullYear() - startDate.getFullYear()) * 12 + (now.getMonth() - startDate.getMonth());
            if (mo < 0) mo = 0;
            let totalDepr = 0;
            if (asset.method === "Straight Line (SLM)") { const annual = cost * rate, md = annual / 12; totalDepr = md * Math.max(0, mo); }
            else { totalDepr = cost - cost * Math.pow(1 - rate, Math.max(mo / 12, 0)); }
            return { totalDepr: Math.min(Math.max(totalDepr, 0), cost), wdv: Math.max(0, cost - Math.min(Math.max(totalDepr, 0), cost)) };
        }

                    <div style={{ marginTop: 8 }}>
                        <label style={{ fontSize: 10, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 3 }}>
                            {isIn ? "Immediate Cash Received (₹)" : "Immediate Cash Paid (₹)"}

        // ─── Firestore Sanitizer ───────────────────────────────────
        // Firestore rejects documents that contain `undefined` values (e.g. a
        // form field the user left blank). JSON.parse(JSON.stringify(obj))
        // drops all undefined keys from objects and converts undefined array
        // elements to null, producing a Firestore-safe clone in one step.
        function sanitizeForFirestore(obj) {
            try { return JSON.parse(JSON.stringify(obj)); }
            catch(e) { console.error("sanitizeForFirestore failed:", e); return obj; }
        }

        // ─── Firestore Hook ───────────────────────────────────
        function useFirestore(uid) {
            const [state, setState] = useState(INIT);
            const [loading, setLoading] = useState(true);
            const [savingStatus, setSavingStatus] = useState("saved"); // "saved", "saving", "error"
            const [lastSaveError, setLastSaveError] = useState(null);
            const isInitializedRef = useRef(false);
            // Prevents re-saving data that was just loaded FROM Firestore
            const justLoadedRef = useRef(false);

            useEffect(() => {
                if (!uid) return;
                setLoading(true);
                isInitializedRef.current = false;
                setLastSaveError(null);

                db.collection("companies").doc(uid).get()
                    .then(snap => {
                        let finalData;
                        if (snap.exists && snap.data() && Object.keys(snap.data()).length > 0) {
                            const fetched = snap.data();
                            finalData = { ...INIT, ...fetched };
                        } else {
                            finalData = { ...INIT, ...CLEAN_RECOVERED_STATE };
                            db.collection("companies").doc(uid).set(sanitizeForFirestore(finalData))
                                .then(() => console.log("Initialized new company document in Firestore"))
                                .catch(e => console.error("Error initializing company doc:", e));
                        }
                        justLoadedRef.current = true; // mark: this setState came from Firestore, don't re-save it
                        setState(finalData);
                        try { localStorage.setItem("yors_finance_state_" + uid, JSON.stringify(finalData)); } catch(e){}
                    })
                    .catch(err => {
                        console.error("Firestore read error:", err);
                        setLastSaveError("Firestore Read Failed: " + err.message);
                        try {
                            const cached = localStorage.getItem("yors_finance_state_" + uid);
                            if (cached) {
                                console.log("Loaded state from local cache fallback");
                                justLoadedRef.current = true;
                                setState(JSON.parse(cached));
                            }
                        } catch(e){}
                    })
                    .finally(() => {
                        isInitializedRef.current = true;
                        setLoading(false);
                    });
            }, [uid]);

            useEffect(() => {
                if (!uid || loading || !isInitializedRef.current) return;

                // Skip re-saving data that was just loaded FROM Firestore.
                if (justLoadedRef.current) {
                    justLoadedRef.current = false;
                    return;
                }

                setSavingStatus("saving");
                setLastSaveError(null);

                // Update localStorage immediately as a local fallback.
                try { localStorage.setItem("yors_finance_state_" + uid, JSON.stringify(state)); } catch(e){}

                // Write to Firestore immediately — NO debounce.
                // With offline persistence, this commits to local IndexedDB first
                // so data is safe even if the page closes before network sync.
                try {
                    db.collection("companies").doc(uid).set(sanitizeForFirestore(state))
                        .then(() => { setSavingStatus("saved"); })
                        .catch(err => {
                            console.error("Firestore Save Error:", err);
                            setSavingStatus("error");
                            setLastSaveError("Database Save Failed: " + err.message);
                        });
                } catch(err) {
                    console.error("Firestore set() threw synchronously:", err);
                    setSavingStatus("error");
                    setLastSaveError("Save Error: " + err.message);
                }
            }, [state, uid, loading]);


            const exportBackup = useCallback(() => {
                try {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
                    const downloadAnchor = document.createElement('a');
                    const timeStr = new Date().toISOString().replace(/[:.]/g, "-");
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `yors_finance_backup_${timeStr}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                } catch(e) {
                    alert("Export failed: " + e.message);
                }
            }, [state]);

            const importBackup = useCallback(() => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'application/json,.json';
                input.onchange = e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = event => {
                        try {
                            const importedData = JSON.parse(event.target.result);
                            if (typeof importedData !== 'object' || !importedData) {
                                throw new Error("Invalid JSON structure");
                            }
                            if (!window.confirm("Overwrite current data with imported JSON backup?")) return;
                            const newFinal = { ...INIT, ...importedData };
                            setState(newFinal);
                            db.collection("companies").doc(uid).set(sanitizeForFirestore(newFinal))
                                .then(() => alert("✅ Backup restored successfully to live database!"))
                                .catch(err => alert("⚠️ Saved locally, but Firestore write failed: " + err.message));
                        } catch(err) {
                            alert("❌ Error parsing backup JSON file: " + err.message);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            }, [uid]);

            return { state, setState, loading, savingStatus, lastSaveError, setLastSaveError, exportBackup, importBackup };
        }

        // ─── Shared GST Calculation (Invoice + Quotation modules) ─────────────
        // Both GST Invoice and Quotation tabs call this function — never duplicate.
        // gstType: "cgst_sgst" (intra-state) | "igst" (inter-state)
        // Items in: { qty, ratePerUnit, discountPct, gstRate, ...rest }
        // Returns: { items (enriched), taxableTotal, cgstTotal, sgstTotal, igstTotal, grandTotal, gstType }
        function recalcGSTTotals(itemsList, gstType) {
            const isNonGst = gstType === "non_gst";
            const isIntra = gstType === "cgst_sgst";
            const updated = (itemsList || []).map(item => {
                const qty = Number(item.qty || 0);
                const rate = Number(item.ratePerUnit || 0);
                const discountPct = Number(item.discountPct || 0);
                const taxable = Math.round(qty * rate * (1 - discountPct / 100) * 100) / 100;
                const gstRate = isNonGst ? 0 : Number(item.gstRate || 18);
                let cgstRate = 0, sgstRate = 0, igstRate = 0;
                let cgstAmount = 0, sgstAmount = 0, igstAmount = 0;
                if (!isNonGst) {
                    if (isIntra) {
                        cgstRate = gstRate / 2; sgstRate = gstRate / 2;
                        cgstAmount = Math.round(taxable * (cgstRate / 100) * 100) / 100;
                        sgstAmount = Math.round(taxable * (sgstRate / 100) * 100) / 100;
                    } else {
                        igstRate = gstRate;
                        igstAmount = Math.round(taxable * (igstRate / 100) * 100) / 100;
                    }
                }
                return { ...item, gstRate, taxableValue: taxable, cgstRate, cgstAmount, sgstRate, sgstAmount, igstRate, igstAmount, totalAmount: Math.round((taxable + cgstAmount + sgstAmount + igstAmount) * 100) / 100 };
            });
            const taxableTotal = updated.reduce((s, x) => s + (x.taxableValue || 0), 0);
            const cgstTotal = updated.reduce((s, x) => s + (x.cgstAmount || 0), 0);
            const sgstTotal = updated.reduce((s, x) => s + (x.sgstAmount || 0), 0);
            const igstTotal = updated.reduce((s, x) => s + (x.igstAmount || 0), 0);
            const grandTotal = taxableTotal + cgstTotal + sgstTotal + igstTotal;
            return { items: updated, taxableTotal, cgstTotal, sgstTotal, igstTotal, grandTotal, gstType };
        }

                if (expandedRows.length > 0) {
                    const keys = Object.keys(expandedRows[0]).filter(k => k !== "_category");
                    keys.forEach(k => {
                        html += `<th style="padding:6px;background:#1e293b;color:#ffffff;">${k}</th>`;
                    });
                    html += `</tr></thead><tbody>`;

                    expandedRows.forEach(row => {
                        html += `<tr>`;
                        keys.forEach(k => {
                            const val = row[k] !== undefined && row[k] !== null ? row[k] : "";
                            const isNum = typeof val === "number";
                            if (isNum) {
                                html += `<td style="padding:4px;text-align:right;" x:num="${val}">${val}</td>`;
                            } else {
                                html += `<td style="padding:4px;">${val}</td>`;

                    return;
                }

                const compName = state.settings?.companyProfile?.name || "YORS_WATER";
                const sanitizeName = String(compName).replace(/[^a-zA-Z0-9]/g, "_");
                const fileName = `${sanitizeName}_Financial_Export_${today()}.xlsx`;

                const expandedRows = buildExpandedExcelRows(recordsToExport);

                // Strategy 1: Base64 Data URI via SheetJS (.xlsx)
                if (window.XLSX) {
                    try {
                        const wb = XLSX.utils.book_new();

                        if (exportMode === "multi-sheet") {
                            const groups = {};
                            expandedRows.forEach(row => {
                                const cat = row._category || "General";
                                if (!groups[cat]) groups[cat] = [];
                                const cleanRow = { ...row };
                                delete cleanRow._category;
                                groups[cat].push(cleanRow);
                            });

                            Object.keys(groups).forEach(catName => {
                                const wsData = groups[catName];
                                const ws = XLSX.utils.json_to_sheet(wsData);
                                const sheetName = String(catName || 'Export').replace(/[^a-zA-Z0-9 _-]/g, '_').substring(0, 30);
                                XLSX.utils.book_append_sheet(wb, ws, sheetName);
                            });
                        } else {
                            const cleanRows = expandedRows.map(r => {
                                const cleanR = { ...r };
                                delete cleanR._category;
                                return cleanR;
                            });
                            const ws = XLSX.utils.json_to_sheet(cleanRows);

                        }

                        const b64 = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });

                    }
                }

                // Strategy 2: Native Excel Spreadsheet Base64 Data URI (.xls)

                    const cleanRows = expandedRows.map(r => {
                        const cleanR = { ...r };
                        delete cleanR._category;
                        return cleanR;
                    });
                    const htmlStr = generateExcelHTMLString(cleanRows);

                    triggerDataUriDownload(dataUri, fileName.replace(".xlsx", ".xls"));
                    setExportModalOpen(false);
                    alert(`✅ Full Document Details Exported Successfully as Excel File!\n\nFile Name: ${fileName.replace(".xlsx", ".xls")}\nTotal Detail Rows Exported: ${expandedRows.length}`);
                } catch (err2) {

                const keys = Object.keys(expandedRows[0]).filter(k => k !== "_category");
                const csvRows = [keys.map(k => `"${k.replace(/"/g, '""')}"`).join(",")];

                expandedRows.forEach(r => {
                    const rowVals = keys.map(k => {
                        const val = r[k] !== undefined && r[k] !== null ? String(r[k]) : "";

                    csvRows.push(rowVals.join(","));

                const csvString = csvRows.join("\n");

                si.filter(e => e.settleMode !== "rawMaterial").reduce((a, b) => a + getSGST(b) * (b.isReturn ? -1 : 1), 0) +
                te.filter(e => e.side === "dr").reduce((a, b) => a + getSGST(b), 0) +
                ple.filter(e => e.side === "expense").reduce((a, b) => a + getSGST(b), 0) +
                (state.rawMaterialPayments || []).reduce((a, b) => a + getSGST(b), 0) +
                cash.filter(e => e.dir === "out" && !e.sourceId).reduce((a, b) => a + getSGST(b), 0);
            const igstInput =
                si.filter(e => e.settleMode !== "rawMaterial").reduce((a, b) => a + getIGST(b) * (b.isReturn ? -1 : 1), 0) +
                te.filter(e => e.side === "dr").reduce((a, b) => a + getIGST(b), 0) +
                ple.filter(e => e.side === "expense").reduce((a, b) => a + getIGST(b), 0) +
                (state.rawMaterialPayments || []).reduce((a, b) => a + getIGST(b), 0) +
                cash.filter(e => e.dir === "out" && !e.sourceId).reduce((a, b) => a + getIGST(b), 0);

            const totalGstInput = cgstInput + sgstInput + igstInput;

            const getPaidSplit = (e, key) => {
                if (e.cgstAmount !== undefined && key === "cgst") return Number(e.cgstAmount);
                if (e.sgstAmount !== undefined && key === "sgst") return Number(e.sgstAmount);
                if (e.igstAmount !== undefined && key === "igst") return Number(e.igstAmount);
                if (e.cgstAmount === undefined && e.sgstAmount === undefined && e.igstAmount === undefined) {
                    if (key === "cgst" || key === "sgst") return Number(e.amount || 0) / 2;
                }
                return 0;
            };

            const cgstPaid = cash.filter(e => e.payType === "GST Tax Payment").reduce((a, b) => a + getPaidSplit(b, "cgst"), 0);
            const sgstPaid = cash.filter(e => e.payType === "GST Tax Payment").reduce((a, b) => a + getPaidSplit(b, "sgst"), 0);
            const igstPaid = cash.filter(e => e.payType === "GST Tax Payment").reduce((a, b) => a + getPaidSplit(b, "igst"), 0);

            const totalGstPaidToGovt = cgstPaid + sgstPaid + igstPaid;
            const totalGstPayable = totalGstOutput - totalGstInput - totalGstPaidToGovt;

            const cgstPayable = cgstOutput - cgstInput - cgstPaid;
            const sgstPayable = sgstOutput - sgstInput - sgstPaid;
            const igstPayable = igstOutput - igstInput - igstPaid;
            const grossPurchases = si.filter(x => !x.isReturn).reduce((a, b) => a + (Number(b.totalAmount || 0) - Number(b.gstAmount || 0)), 0);
            const purchaseReturnsAmt = si.filter(x => x.isReturn).reduce((a, b) => a + (Number(b.totalAmount || 0) - Number(b.gstAmount || 0)), 0);
            const grossSales = so.filter(x => !x.isReturn).reduce((a, b) => a + (Number(b.totalAmount || 0) - Number(b.gstAmount || 0)), 0);
            const salesReturnsAmt = so.filter(x => x.isReturn).reduce((a, b) => a + (Number(b.totalAmount || 0) - Number(b.gstAmount || 0)), 0);
            const fifoCOGS = Object.values(fifo).reduce((a, b) => a + b.cogs, 0);
            const fifoClosing = Object.values(fifo).reduce((a, b) => a + b.closingValue, 0);
            const openingStockAmt = Number(state.openingStock?.amount || 0);
            // rawMaterialCosts: remaining RM base cost (excl. GST) not yet allocated to stock-in.
            // Uses usedForStockInBase (base-only tracker) — NOT usedForStockIn (total incl. GST) —
            // so the deduction is always in the same unit as r.amount (base excl. GST).
            // GST on raw materials is separately claimed as GST ITC Receivable on the asset side of the Balance Sheet.
            const rawMaterialCosts = (state.rawMaterialPayments || []).reduce((sum, r) => sum + Math.max(0, Number(r.amount || 0) - (r.usedForStockInBase || 0)), 0);
            const tradingDr = totalPurchases + openingStockAmt + rawMaterialCosts + te.filter(e => e.side === "dr" && e.sourceType !== "rawMaterial").reduce((a, b) => a + Number(b.amount), 0);
            const tradingCr = totalSales + fifoClosing + te.filter(e => e.side === "cr").reduce((a, b) => a + Number(b.amount), 0);
            const grossProfit = tradingCr - tradingDr;
            const cashIn = cash.filter(e => e.dir === "in" && !e.isPending).reduce((a, b) => a + Number(b.amount), 0);
            const cashOut = cash.filter(e => e.dir === "out" && !e.isPending).reduce((a, b) => a + Number(b.amount), 0);
            const cashBal = cashIn - cashOut;
            const manualExpense = ple.filter(e => e.side === "expense").reduce((a, b) => a + Number(b.amount), 0);
            const manualIncome = ple.filter(e => e.side === "income").reduce((a, b) => a + Number(b.amount), 0);
            const totalDepreciation = da.reduce((a, b) => a + calcDepreciation(b).totalDepr, 0);
            const deprWDVTotal = da.reduce((a, b) => a + calcDepreciation(b).wdv, 0);
            const deprCostTotal = da.reduce((a, b) => a + Number(b.cost), 0);
            const calcInterestForEntry = (e) => {
                if (!e.interestRate || !e.amount) return { monthly: 0, total: 0, months: 0 };
                const principal = Number(e.amount);
                const rate = Number(e.interestRate) / 100;
                const startDate = new Date(e.date || today());
                const now = new Date();
                let mo = (now.getFullYear() - startDate.getFullYear()) * 12 + (now.getMonth() - startDate.getMonth());
                if (mo < 0) mo = 0;
                const monthly = (principal * rate) / 12;
                const total = monthly * mo;
                return { monthly, total, months: mo };
            };
            const totalLoanInterest = Object.values(state.balanceSheet?.liabilities || {})
                .filter(e => e.subCategory === "Long Term Borrowings" && e.interestRate)
                .reduce((sum, e) => sum + calcInterestForEntry(e).total, 0);
            const loanInterestPaid = (loanId) => {
                return cash.filter(e => e.dir === "out" && e.payType === "Interest on Loan Repayment" && e.linkedId === loanId)
                    .reduce((sum, e) => sum + Number(e.amount || 0), 0);
            };
            const loanInterestOutstanding = (loan) => {
                const accrued = calcInterestForEntry(loan).total;
                const paid = loanInterestPaid(loan.id);
                return Math.max(0, accrued - paid);
            };
            const totalInterestPaid = cash
                .filter(e => e.dir === "out" && e.payType === "Interest on Loan Repayment")
                .reduce((sum, e) => sum + Number(e.amount || 0), 0);
            const outstandingInterestLiab = Math.max(0, totalLoanInterest - totalInterestPaid);
            const loanPrincipalPaid = (loanId) => {
                return cash.filter(e => e.dir === "out" && e.payType === "Loan Repayment" && e.linkedId === loanId)
                    .reduce((sum, e) => sum + Number(e.amount || 0), 0);
            };
            const loanPrincipalOutstanding = (loan) => {
                const original = Number(loan.amount || 0);
                const paid = loanPrincipalPaid(loan.id);
                return Math.max(0, original - paid);
            };
            // P&L is derived ONLY from Trading Account (gross profit) + manual P&L entries + depreciation + loan interest.
            // Cash Book is a receipts/payments register — it does NOT feed P&L to avoid double entry.
            const plIncome = (grossProfit > 0 ? grossProfit : 0) + manualIncome;
            const plExpense = manualExpense + totalDepreciation + totalLoanInterest + (grossProfit < 0 ? Math.abs(grossProfit) : 0);
            const netPL = plIncome - plExpense;

            const creditorFromStock = id => si.filter(x => x.settleMode === "creditor" && x.linkedPartyId === id).reduce((a, b) => a + Number(b.totalAmount) * (b.isReturn ? -1 : 1), 0);
            const creditorFromOther = id => {
                let sum = 0;
                te.forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) {
                        const xAmt = Number(x.totalAmount || x.amount || 0);
                        if (x.side === "dr") sum += xAmt;
                        else if (x.side === "cr") sum -= xAmt;
                    }
                });
                ple.forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) {
                        const xAmt = Number(x.totalAmount || x.amount || 0);
                        if (x.side === "expense") sum += xAmt;
                        else if (x.side === "income") sum -= xAmt;
                    }
                });
                Object.values(state.balanceSheet?.assets || {}).forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) sum += Number(x.amount || 0);
                });
                Object.values(state.balanceSheet?.liabilities || {}).forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) sum += Number(x.amount || 0);
                });
                (state.rawMaterialPayments || []).forEach(x => {
                    if (x.settleMode === "creditor" && x.linkedPartyId === id) sum += Number(x.totalAmount || x.amount || 0);
                });
                return sum;
            };
            const creditorCashPaid = id => cash.filter(e => e.dir === "out" && e.linkedId === id && !e.isPending).reduce((a, b) => a + Number(b.amount), 0);
            const creditorBal = c => Math.max(0, Number(c.amount) + creditorFromStock(c.id) + creditorFromOther(c.id) - creditorCashPaid(c.id));
            const debtorFromStock = id => so.filter(x => x.settleMode === "debtor" && x.linkedPartyId === id).reduce((a, b) => a + Number(b.totalAmount) * (b.isReturn ? -1 : 1), 0);
            const debtorFromOther = id => {
                let sum = 0;
                te.forEach(x => {
                    if (x.settleMode === "debtor" && x.linkedPartyId === id) {
                        const xAmt = Number(x.totalAmount || x.amount || 0);
                        if (x.side === "cr") sum += xAmt;
                        else if (x.side === "dr") sum -= xAmt;
                    }
                });
                ple.forEach(x => {
                    if (x.settleMode === "debtor" && x.linkedPartyId === id) {
                        const xAmt = Number(x.totalAmount || x.amount || 0);
                        if (x.side === "income") sum += xAmt;
                        else if (x.side === "expense") sum -= xAmt;
                    }
                });
                Object.values(state.balanceSheet?.assets || {}).forEach(x => {
                    if (x.settleMode === "debtor" && x.linkedPartyId === id) sum += Number(x.amount || 0);
                });
                Object.values(state.balanceSheet?.liabilities || {}).forEach(x => {
                    if (x.settleMode === "debtor" && x.linkedPartyId === id) sum -= Number(x.amount || 0);
                });
                return sum;
            };
            const debtorCashRcvd = id => cash.filter(e => e.dir === "in" && e.linkedId === id && !e.isPending).reduce((a, b) => a + Number(b.amount), 0);
            const debtorBal = d => Math.max(0, Number(d.amount) + debtorFromStock(d.id) + debtorFromOther(d.id) - debtorCashRcvd(d.id));
            const totalCreditors = creds.reduce((a, b) => a + creditorBal(b), 0);
            const totalDebtors = debs.reduce((a, b) => a + debtorBal(b), 0);
            // Balance Sheet manual entries: exclude Fixed Assets that have depreciation linked
            // (their WDV is shown via the auto depreciation line to avoid double-counting).
            const bsManualAssetsRaw = Object.values(state.balanceSheet?.assets || {});
            const bsManualLiabRaw = Object.values(state.balanceSheet?.liabilities || {}).map(e => {
                if (e.subCategory === "Long Term Borrowings") {
                    return { ...e, amount: loanPrincipalOutstanding(e) };
                }
                return e;
            });
            // IDs of BS entries that sourced cash (to exclude from P&L cash flows)
            const bsEntryIds = new Set([...bsManualAssetsRaw, ...bsManualLiabRaw].map(e => e.id));
            const bsManualAssets = bsManualAssetsRaw.reduce((a, b) => a + Number(b.amount), 0);
            const bsManualLiab = bsManualLiabRaw.reduce((a, b) => a + Number(b.amount), 0);
            // Auto assets: cash balance + closing stock + debtors - accumulated depreciation
            // Cash balance is from cash book (receipts & payments), kept separate from BS manual entries.
            // When GST ITC > Output GST (totalGstPayable < 0), the excess ITC is an asset (receivable from govt), not a negative liability.
            const gstItcReceivable = totalGstPayable < 0 ? Math.abs(totalGstPayable) : 0;
            // --- Step 1: Compute raw auto-sides (without any adjustment) ---
            const bsAutoAssetsRaw = cashBal + (fifoClosing > 0 ? fifoClosing : 0) + (totalDebtors > 0 ? totalDebtors : 0) - totalDepreciation + gstItcReceivable;
            const bsAutoLiabRaw   = (totalCreditors > 0 ? totalCreditors : 0) + netPL + (outstandingInterestLiab > 0 ? outstandingInterestLiab : 0) + (totalGstPayable > 0 ? totalGstPayable : 0);
            const rawBsTotalAssets = bsManualAssets + bsAutoAssetsRaw;
            const rawBsTotalLiab   = bsManualLiab   + bsAutoLiabRaw;
            const rawBsDiff = rawBsTotalAssets - rawBsTotalLiab;
            // --- Step 2: Auto-reconcile creditor opening balances ---
            // Creditors with a non-zero opening balance (money owed before this system was set up) create
            // a liability without a corresponding system asset.  We automatically offset them by adding
            // an equivalent "Opening Capital (Pre-System)" entry to the asset side so the BS always balances.
            const credsOpeningOffset = creds.reduce((a, c) => a + Number(c.amount || 0), 0);
            // --- Step 3: Compute residual after creditor-opening fix ---
            const diffAfterCredsAdj = rawBsDiff + credsOpeningOffset; // if negative, assets still short
            // Any remaining gap (journal-only entries, orphaned cash, etc.) goes into a suspense item
            const bsAdjToAssets = credsOpeningOffset + (diffAfterCredsAdj < -0.01 ? -diffAfterCredsAdj : 0);
            const bsAdjToLiab   = diffAfterCredsAdj > 0.01 ? diffAfterCredsAdj : 0;
            // --- Step 4: Final balanced values (no stored data changed) ---
            /* ── Auto Quotation Number helper ──────────────────────────────────
               QUO-YYYY-0001, sequential, NOT gapless (quotations are not a
               GST-mandated document — gaps are allowed after soft-deletes).
            ────────────────────────────────────────────────────────────────────────── */
            const getNextQuoNo = () => {
                const yr = new Date().getFullYear();
                const prefix = "QUO-" + yr + "-";
                let maxSeq = 0;
                (state.quotations || []).filter(q => !q.deleted).forEach(q => {
                    const no = (q.quotNo || "").trim();
                    if (no.startsWith(prefix)) {
                        const n = parseInt(no.slice(prefix.length), 10);
                        if (!isNaN(n) && n > maxSeq) maxSeq = n;
                    }
                });
                return prefix + String(maxSeq + 1).padStart(4, "0");
            };

            const startNewQuotation = () => {
                const comp = state.settings?.companyProfile || {};
                const defaultValidity = (() => { const d = new Date(); d.setDate(d.getDate() + 30); return d.toISOString().slice(0,10); })();
                setQuotForm({
                    quotNo: getNextQuoNo(), date: today(), validityDate: defaultValidity,
                    clientId: "", clientName: "", clientGstin: "",
                    clientStateCode: comp.stateCode || "19",
                    clientAddress: "", clientPhone: "", gstType: "cgst_sgst",
                    items: [{ itemName: "Packaged Drinking Water", hsnCode: "2201", qty: 100, ratePerUnit: 12, discountPct: 0, gstRate: 18 }],
                    taxableTotal: 0, cgstTotal: 0, sgstTotal: 0, igstTotal: 0, grandTotal: 0,
                    notes: "",
                    terms: "1. Prices are valid till the validity date shown above.\n2. GST as applicable.\n3. Goods once confirmed cannot be returned without prior approval.\n4. Subject to Kolkata jurisdiction only."
                });
                setEditQuotationId(null);
                setShowCreateQuotation(true);
            };

            const bsAutoAssets = bsAutoAssetsRaw + bsAdjToAssets;
            const bsAutoLiab   = bsAutoLiabRaw   + bsAdjToLiab;
            const bsTotalAssets = bsManualAssets + bsAutoAssets, bsTotalLiab = bsManualLiab + bsAutoLiab, bsDiff = bsTotalAssets - bsTotalLiab;

            const upd = fn => setState(p => fn(p));
            const toggleChk = (key, id) => upd(p => ({ ...p, [key]: p[key].map(e => e.id === id ? { ...e, checked: !e.checked, manualCheck: true } : e) }));

            /* ── Auto Bill Number helper ──────────────────────────────────────────
               Scans all existing non-GST stockOut entries for BILL-NNN style
               numbers and returns the next one in sequence (BILL-001, BILL-002…).
               Numbers without the prefix are also counted to avoid gaps.
            ──────────────────────────────────────────────────────────────────── */
            const getNextBillNo = () => {
                const allBillNos = (state.stockOut || [])
                    .map(e => e.billNo || "")
                    .filter(b => b && !b.startsWith("GST-"));
                let maxSeq = 0;
                allBillNos.forEach(b => {
                    const m = b.match(/(?:BILL-?)(\d+)$/i);
                    if (m) { const n = parseInt(m[1], 10); if (n > maxSeq) maxSeq = n; }
                });
                return "BILL-" + String(maxSeq + 1).padStart(3, "0");
            };

            /* ── Auto GST Invoice Number helper ──────────────────────────────────
               Scans ALL existing GST invoice numbers for the current financial
               year (GST-YYYY-NNN), finds the highest sequence number used, and
               returns the next one.  This guarantees:
                 • No repeats even after deletions
                 • Strict sequential order (001, 002, 003 …)
                 • Year resets automatically when the calendar year changes
            ──────────────────────────────────────────────────────────────────── */
            const getNextGstNo = () => {
                const yr = new Date().getFullYear();
                const prefix = "GST-" + yr + "-";
                let maxSeq = 0;
                (state.gstInvoices || []).forEach(inv => {
                    const no = (inv.invoiceNo || "").trim();
                    if (no.startsWith(prefix)) {
                        const n = parseInt(no.slice(prefix.length), 10);
                        if (!isNaN(n) && n > maxSeq) maxSeq = n;
                    }
                });
                return prefix + String(maxSeq + 1).padStart(3, "0");
            };

            const getNextNonGstNo = () => {
                const yr = new Date().getFullYear();
                const prefix = "NGST-" + yr + "-";
                let maxSeq = 0;
                (state.stockOut || []).forEach(so => {
                    const no = (so.billNo || "").trim();
                    if (no.startsWith(prefix)) {
                        const n = parseInt(no.slice(prefix.length), 10);
                        if (!isNaN(n) && n > maxSeq) maxSeq = n;
                    }
                });
                return prefix + String(maxSeq + 1).padStart(3, "0");
            };

            const openM = (t, preset) => {
                const autoBillNo = t === "stockOut" ? getNextBillNo() : "";
                setModal(t);
                setForm({ date: today(), paidAmount: "", settleMode: "cash", linkedPartyId: "", newPartyName: "", newPartyCredit: "", siItems: [{ bottleType: "", category: "normal", batchNo: "", qty: "", ratePerUnit: "" }], soItems: [{ bottleType: "", category: "normal", qty: "", ratePerUnit: "" }], billNo: autoBillNo, _autoBillNo: autoBillNo, ...(preset || {}) });
            };
            const closeM = () => { setModal(null); setForm({}); };

            const [isAdmin, setIsAdmin] = React.useState(false);
            const toggleAdmin = () => {
                if (isAdmin) { setIsAdmin(false); return; }
                const pin = window.prompt("Enter Admin PIN (Default: 0000):");
                if (pin === (state.settings?.adminPin || "0000")) {
                    setIsAdmin(true);
                } else if (pin !== null) {
                    alert("Incorrect PIN");
                }
            };

            const withLog = (p, action, module, entryId, desc) => {
                const log = p.auditLog || [];
                return { ...p, auditLog: [{ id: gid(), ts: new Date().toISOString(), action, module, entryId, desc, user: user.email }, ...log].slice(0, 200) };
            };

            // ── Auto-settle: tick checkbox when balance reaches zero, untick when it rises again ──
            useEffect(() => {
                let changed = false;
                const nextCreds = (state.creditors || []).map(c => {
                    const bal = creditorBal(c);
                    const totalDue = Number(c.amount) + creditorFromStock(c.id) + creditorFromOther(c.id);
                    const shouldSettle = bal === 0 && totalDue > 0;
                    // Only auto-manage if not manually toggled
                    if (!c.manualCheck) {
                        if (shouldSettle !== !!c.checked) { changed = true; return { ...c, checked: shouldSettle, autoSettled: shouldSettle }; }
                    }
                    return { ...c, autoSettled: shouldSettle && !!c.checked };
                });
                const nextDebs = (state.debtors || []).map(d => {
                    const bal = debtorBal(d);
                    const totalDue = Number(d.amount) + debtorFromStock(d.id) + debtorFromOther(d.id);
                    const shouldSettle = bal === 0 && totalDue > 0;
                    if (!d.manualCheck) {
                        if (shouldSettle !== !!d.checked) { changed = true; return { ...d, checked: shouldSettle, autoSettled: shouldSettle }; }
                    }
                    return { ...d, autoSettled: shouldSettle && !!d.checked };
                });
                if (changed) upd(p => ({ ...p, creditors: nextCreds, debtors: nextDebs }));
            }, [cashBal, totalCreditors, totalDebtors, si.length, so.length, cash.length, ple.length, te.length]);
            const buildTSD = (entries, amtField) => { const m = {}; entries.forEach(e => { const d = new Date(e.date), k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); m[k] = (m[k] || 0) + Number(e[amtField] || 0); }); return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0])).map(([l, v]) => ({ l, v })); };

            const resolveSettle = (frm, amount, date, description, entryId, direction) => {
                const { settleMode, linkedPartyId, newPartyName, newPartyCredit, paidAmount } = frm;
                let partyId = null, partyName = "", createdCreditorId = null, createdDebtorId = null;
                const cashEffects = [];
                const paidVal = Number(paidAmount || 0);

                if (settleMode === "cash") {
                    partyName = "Cash";
                    cashEffects.push({ id: gid(), dir: direction, payType: direction === "in" ? "Other Income Receipt" : "Expense Payment", description, amount, date, sourceId: entryId, linkedId: null });
                } else if (settleMode === "creditor") {
                    if (linkedPartyId === "__new__") {
                        createdCreditorId = gid();
                        partyId = createdCreditorId;
                        partyName = newPartyName || "New Creditor";
                    } else {
                        partyId = linkedPartyId;
                        partyName = creds.find(c => c.id === linkedPartyId)?.name || "";
                    }
                    if (paidVal > 0) {
                        cashEffects.push({
                            id: gid(),
                            dir: direction,
                            payType: direction === "in" ? "Debtor Payment" : "Creditor Payment",
                            description: `Partial payment for ${description}`,
                            amount: paidVal,
                            date,
                            sourceId: entryId,
                            linkedId: partyId
                        });
                    }
                } else if (settleMode === "debtor") {
                    if (linkedPartyId === "__new__") {
                        createdDebtorId = gid();
                        partyId = createdDebtorId;
                        partyName = newPartyName || "New Debtor";
                    } else {
                        partyId = linkedPartyId;
                        partyName = debs.find(d => d.id === linkedPartyId)?.name || "";
                    }
                    if (paidVal > 0) {
                        cashEffects.push({
                            id: gid(),
                            dir: direction,
                            payType: direction === "in" ? "Debtor Payment" : "Creditor Payment",
                            description: `Partial receipt for ${description}`,
                            amount: paidVal,
                            date,
                            sourceId: entryId,
                            linkedId: partyId
                        });
                    }
                }
                return { partyId, partyName, createdCreditorId, createdDebtorId, cashEffects };
            };

            const cascadeDelete = (key, id) => {
                if (!isAdmin) { alert("Locked 🔒: Switch to Admin Mode to delete entries."); return; }
                setState(p => {
                    const entry = (p[key] || []).find(e => e.id === id); if (!entry) return p;
                    let np = { ...p, [key]: (p[key] || []).filter(e => e.id !== id) };
                    np.cashEntries = (np.cashEntries || []).filter(e => e.sourceId !== id);
                    if (key === "gstInvoices") {
                        np.stockOut = (np.stockOut || []).filter(x => x.gstInvoiceId !== id);
                    }
                    if (key === "cashEntries") {
                        np.plEntries = (np.plEntries || []).filter(e => e.sourceId !== id);
                        np.tradingEntries = (np.tradingEntries || []).filter(e => e.sourceId !== id);
                    }
                    // Reverse cascade: if deleting a P&L or Trading entry that was auto-created
                    // by a Cash Book entry (has sourceId pointing to a cash entry), remove that cash entry too.
                    if ((key === "plEntries" || key === "tradingEntries") && entry.sourceId) {
                        const srcCash = (np.cashEntries || []).find(e => e.id === entry.sourceId);
                        if (srcCash) {
                            np.cashEntries = (np.cashEntries || []).filter(e => e.id !== entry.sourceId);
                            np = withLog(np, "DELETE", "cashEntries", entry.sourceId, `Auto-removed linked Cash entry for deleted ${key} entry`);
                        }
                    }
                    if (entry.createdCreditorId) np.creditors = (np.creditors || []).filter(c => c.id !== entry.createdCreditorId);
                    if (entry.createdDebtorId) np.debtors = (np.debtors || []).filter(d => d.id !== entry.createdDebtorId);

                    let np = { ...p, depreciationAssets: [...p.depreciationAssets, { id, bsAssetId: form.bsAssetId, name: bsAsset.description, cost: Number(bsAsset.amount), startDate: bsAsset.date, method: form.method, period: form.period, depRate: Number(form.depRate) }], balanceSheet: { ...p.balanceSheet, assets: { ...p.balanceSheet.assets, [bsAsset.id]: { ...bsAsset, linkedDeprId: id, autoFromDepr: true } } } };
                    return withLog(np, "CREATE", "depreciationAssets", id, `Added Depreciation for ${bsAsset.description}`);
                }); closeM();
            };
            const applyOpeningStock = () => {
                upd(p => {
                    let np = { ...p, openingStock: { amount: Number(form.amount || 0), date: form.date || today() } };
                    return withLog(np, "UPDATE", "openingStock", null, `Set Opening Stock to ${form.amount}`);
                }); closeM();
            };
            const deleteOpeningStock = () => {
                if (!isAdmin) { alert("Locked 🔒: Switch to Admin Mode to delete entries."); return; }
                if (!window.confirm("Delete Opening Stock entry? This will reset it to ₹0.")) return;
                upd(p => {
                    let np = { ...p, openingStock: { amount: 0, date: "" } };
                    return withLog(np, "DELETE", "openingStock", null, "Deleted Opening Stock");
                });
            };

            // One-time fix: refund the Preform portion that was over-deducted from Conversion Cost
            // when Preform was temporarily merged into Conversion Cost rates.
            const fixPreformRefund = () => {
                if (!isAdmin) { alert("Locked 🔒: Admin only."); return; }
                if (!window.confirm("This will add back the Preform portion (200ml=₹61.20, 500ml=₹44.88, 1L/Premium=₹36.72 per unit) that was over-deducted from Conversion Cost balance.\n\nThis is a one-time correction — run it only ONCE. Continue?")) return;

                const PREFORM_RATES = { "200ml": 61.20, "500ml": 44.88, "1L": 36.72, "Premium": 36.72 };

                upd(p => {
                    let np = { ...p };
                    let rms = (np.rawMaterialPayments || []).map(r => ({ ...r }));

                    // All non-return stock-ins settled via rawMaterial
                    const allSIs = (np.stockIn || []).filter(si => si.settleMode === "rawMaterial" && !si.isReturn);

                    // Group by linkedRawMaterialId (batch key).
                    // The FIRST item in each batch holds the linkedRawMaterials deductions array;
                    // sibling items share the same linkedRawMaterialId but have empty arrays.
                    const batches = {};
                    allSIs.forEach(si => {
                        const batchKey = si.linkedRawMaterialId || si.id;
                        if (!batches[batchKey]) batches[batchKey] = { leader: null, totalPreform: 0 };
                        // Mark leader — the one that actually carries deduction records
                        if (si.linkedRawMaterials && si.linkedRawMaterials.length > 0) {
                            batches[batchKey].leader = si;
                        }
                        batches[batchKey].totalPreform += (Number(si.qty) || 0) * (PREFORM_RATES[si.bottleType] || 0);
                    });

                    Object.values(batches).forEach(batch => {
                        if (!batch.leader || batch.totalPreform <= 0) return;

                        let preformToRefund = batch.totalPreform;
                        const linkedCCs = (batch.leader.linkedRawMaterials || [])
                            .filter(lrm => lrm.rawMatType === "Conversion Cost");

                        linkedCCs.forEach(lrm => {
                            if (preformToRefund <= 0) return;
                            const refund = Math.min(preformToRefund, lrm.amount);
                            rms = rms.map(r => {
                                if (r.id === lrm.id) {
                                    const newUsed = Math.max(0, (r.usedForStockIn || 0) - refund);
                                    return { ...r, usedForStockIn: newUsed };
                                }
                                return r;
                            });
                            preformToRefund -= refund;
                        });
                    });

                    np.rawMaterialPayments = rms;
                    np = withLog(np, "UPDATE", "rawMaterialPayments", null, "One-time fix: refunded Preform portion from Conversion Cost usedForStockIn");
                    return np;

                                {isAdmin && <button style={BTNP()} onClick={() => openM("trading")}>+ Manual Entry</button>}
                            </div>
                        </div>
                        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
                            <div style={CARD("#64748b,#475569")}><div style={{ fontSize: 9 }}>Opening Stock</div><div style={{ fontSize: 14, fontWeight: 900 }}>{fc(openingStockAmt)}</div></div>
                            <div style={CARD("#6366f1,#8b5cf6")}><div style={{ fontSize: 9 }}>Purchases (Net)</div><div style={{ fontSize: 14, fontWeight: 900 }}>{fc(totalPurchases)}</div></div>
                            <div style={CARD("#f59e0b,#b45309")}><div style={{ fontSize: 9 }}>Purch. Returns</div><div style={{ fontSize: 14, fontWeight: 900 }}>{fc(purchaseReturnsAmt)}</div></div>
                            <div style={CARD("#22c55e,#16a34a")}><div style={{ fontSize: 9 }}>Sales (Net)</div><div style={{ fontSize: 14, fontWeight: 900 }}>{fc(totalSales)}</div></div>
                            <div style={CARD("#ef4444,#b91c1c")}><div style={{ fontSize: 9 }}>Sales Returns</div><div style={{ fontSize: 14, fontWeight: 900 }}>{fc(salesReturnsAmt)}</div></div>
                            <div style={CARD("#8b5cf6,#7c3aed")}><div style={{ fontSize: 9 }}>Closing Stock</div><div style={{ fontSize: 14, fontWeight: 900 }}>{fc(fifoClosing)}</div></div>
                            <div style={CARD(grossProfit >= 0 ? "#0891b2,#0ea5e9" : "#ef4444,#dc2626")}><div style={{ fontSize: 9 }}>Gross P&L</div><div style={{ fontSize: 14, fontWeight: 900 }}>{fabs(grossProfit) + (grossProfit >= 0 ? "▲" : "▼")}</div></div>
                        </div>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                            <div style={{ background: C.mid, borderRadius: 12, padding: 16 }}>
                                <div style={{ fontWeight: 800, color: C.red, fontSize: 12, marginBottom: 6, borderBottom: "1px solid #334155", paddingBottom: 4 }}>Dr — Costs</div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3, alignItems: "center" }}><span style={{ color: C.muted }}>Opening Stock</span><span style={{ display: "flex", gap: 5, alignItems: "center" }}><span style={{ color: C.red, fontWeight: 600 }}>{fc(openingStockAmt)}</span>{openingStockAmt > 0 && isAdmin && <button style={BTND} onClick={deleteOpeningStock} title="Delete Opening Stock">✕</button>}</span></div>
                                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}><span style={{ color: C.muted }}>Purchases (Gross)</span><span style={{ color: C.red, fontWeight: 600 }}>{fc(grossPurchases)}</span></div>
                                {purchaseReturnsAmt > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}><span style={{ color: C.amber }}>Less: Purchase Returns</span><span style={{ color: C.green, fontWeight: 600 }}>({fc(purchaseReturnsAmt)})</span></div>}
                                {(() => {
                                    const rms = state.rawMaterialPayments || [];
                                    const rawMatSummary = RAW_MAT_TYPES.map(type => {
                                        const entries = rms.filter(r => r.rawMatType === type);
                                        const totalAmt = entries.reduce((sum, r) => sum + Number(r.amount), 0);
                                        const usedAmt = entries.reduce((sum, r) => sum + Number(r.usedForStockInBase !== undefined ? r.usedForStockInBase : (r.usedForStockIn || 0)), 0);
                                        const netAmt = totalAmt - usedAmt;
                                        return { type, netAmt };
                                    }).filter(x => x.netAmt > 0);
                                    const otherEntries = te.filter(e => e.side === "dr" && e.sourceType !== "rawMaterial");
                                    return (<>
                                        {rawMatSummary.length > 0 && (
                                            <div style={{ marginTop: 4, marginBottom: 4 }}>
                                                <div style={{ fontSize: 10, color: C.teal, fontWeight: 700, marginBottom: 3, borderBottom: "1px dashed #334155", paddingBottom: 2 }}>🏭 Raw Material Costs</div>
                                                {rawMatSummary.map(x => <div key={x.type} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginBottom: 3, paddingLeft: 8, alignItems: "center" }}><span style={{ color: C.muted }}>{x.type}</span><span style={{ color: C.text, fontWeight: 600 }}>{fc(x.netAmt)}</span></div>)}
                                            </div>
                                        )}
                                        {otherEntries.map(e => <div key={e.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginBottom: 3, alignItems: "center" }}><span style={{ color: C.muted }}>{e.description}{e.paidAmount > 0 && <span style={{ fontSize: 9, color: C.amber, marginLeft: 4, fontWeight: 700 }}>(Partial Cash: {fc(e.paidAmount)})</span>}</span><span style={{ display: "flex", gap: 5 }}>{fc(e.amount)}<button style={BTND} onClick={() => cascadeDelete("tradingEntries", e.id)}>✕</button></span></div>)}
                                    </>);
                                })()}
                                <div style={{ borderTop: "1px solid #334155", paddingTop: 6, fontWeight: 800, color: C.red, textAlign: "right" }}>Total Dr: {fc(tradingDr)}</div>
                                {grossProfit >= 0 && <div style={{ color: C.green, fontWeight: 800, textAlign: "right", fontSize: 11, marginTop: 4 }}>Gross Profit c/d: {fc(grossProfit)}</div>}
                            </div>
                            <div style={{ background: C.mid, borderRadius: 12, padding: 16 }}>
                                <div style={{ fontWeight: 800, color: C.green, fontSize: 12, marginBottom: 6, borderBottom: "1px solid #334155", paddingBottom: 4 }}>Cr — Revenue</div>
                                {[["Sales (Gross)", grossSales], ["Closing Stock (FIFO)", fifoClosing]].map(([l, v]) => <div key={l} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}><span style={{ color: C.muted }}>{l}</span><span style={{ color: C.green, fontWeight: 600 }}>{fc(v)}</span></div>)}
                                {salesReturnsAmt > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}><span style={{ color: C.amber }}>Less: Sales Returns</span><span style={{ color: C.red, fontWeight: 600 }}>({fc(salesReturnsAmt)})</span></div>}
                                {te.filter(e => e.side === "cr").map(e => <div key={e.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginBottom: 3, alignItems: "center" }}><span style={{ color: C.muted }}>{e.description}{e.paidAmount > 0 && <span style={{ fontSize: 9, color: C.amber, marginLeft: 4, fontWeight: 700 }}>(Partial Cash: {fc(e.paidAmount)})</span>}</span><span style={{ display: "flex", gap: 5 }}>{fc(e.amount)}<button style={BTND} onClick={() => cascadeDelete("tradingEntries", e.id)}>✕</button></span></div>)}
                                <div style={{ borderTop: "1px solid #334155", paddingTop: 6, fontWeight: 800, color: C.green, textAlign: "right" }}>Total Cr: {fc(tradingCr)}</div>
                                {grossProfit < 0 && <div style={{ color: C.red, fontWeight: 800, textAlign: "right", fontSize: 11, marginTop: 4 }}>Gross Loss c/d: {fabs(grossProfit)}</div>}
                            </div>
                        </div>
                    </div>}

                    {tab === "Inventory" && (() => {
                        /* ── Apply all filters to get filtered batches per FIFO group ── */
                        const getFilteredBatches = (batches) => {
                            return batches.filter(b => {
                                if (invFilter.godown !== "All" && b.godown !== invFilter.godown) return false;
                                if (invFilter.dateFrom && b.date < invFilter.dateFrom) return false;
                                if (invFilter.dateTo && b.date > invFilter.dateTo) return false;
                                if (invFilter.search && !(b.batchNo || "").toLowerCase().includes(invFilter.search.toLowerCase())) return false;
                                if (invFilter.status !== "All") {
                                    const st = b.remQty === 0 ? "Exhausted" : b.remQty === b.origQty ? "Untouched" : "Partial";
                                    if (invFilter.status !== st) return false;
                                }
                                return true;
                            });
                        };

                        /* ── Compute filtered totals across all FIFO groups ── */
                        const filteredGroups = Object.keys(fifo).filter(k => {
                            const [bt, cat] = k.split("_");
                            if (!fifo[k].inQty && !fifo[k].outQty && (!fifo[k].batches || fifo[k].batches.length === 0)) return false;
                            if (invFilter.bt !== "All" && bt !== invFilter.bt) return false;
                            if (invFilter.cat !== "All" && cat !== invFilter.cat) return false;
                            return true;
                        }).map(k => {
                            const [bt, cat] = k.split("_"), f = fifo[k];
                            const fb = getFilteredBatches(f.batches);
                            const filteredInQty = f.inQty;
                            const filteredOutQty = f.outQty;
                            const filteredClosing = fb.reduce((a, b) => a + b.remQty * b.rate, 0);
                            const filteredCogs = f.cogs;
                            const filteredPurchased = fb.reduce((a, b) => a + b.origQty * b.rate, 0);
                            const filteredBalQty = f.balQty;
                            const unfulfilledQty = f.unfulfilledQty || 0;
                            return { key: k, bt, cat, f, fb, filteredInQty, filteredOutQty, filteredClosing, filteredCogs, filteredPurchased, filteredBalQty, unfulfilledQty };
                        });

                        const fTotalPurchased = filteredGroups.reduce((a, g) => a + g.filteredPurchased, 0);
                        const fTotalSold = filteredGroups.reduce((a, g) => a + g.filteredCogs, 0);
                        const fTotalCOGS = filteredGroups.reduce((a, g) => a + g.filteredCogs, 0);
                        const fTotalClosing = filteredGroups.reduce((a, g) => a + g.filteredClosing, 0);
                        const fTotalUnits = filteredGroups.reduce((a, g) => a + g.filteredBalQty, 0);
                        const fTotalUnfulfilled = filteredGroups.reduce((a, g) => a + g.unfulfilledQty, 0);
                        const hasActiveFilter = invFilter.bt !== "All" || invFilter.cat !== "All" || invFilter.godown !== "All" || invFilter.dateFrom || invFilter.dateTo || invFilter.status !== "All" || invFilter.search;

                        return <div>
                            <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 14, color: C.blue }}>📦 Inventory (FIFO)</div>

                            {/* ── Summary Cards ── */}
                            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
                                {[["Purchased", fc(fTotalPurchased), "#6366f1,#8b5cf6"], ["COGS", fc(fTotalCOGS), "#f59e0b,#d97706"], ["Closing Value", fc(fTotalClosing), "#8b5cf6,#7c3aed"], ["Balance", (fTotalUnits >= 0 ? fTotalUnits : `⚠️ Deficit ${fTotalUnits}`) + " units", fTotalUnits >= 0 ? "#0ea5e9,#0284c7" : "#ef4444,#dc2626"]].map(([l, v, g]) => (
                                    <div key={l} style={CARD(g)}><div style={{ fontSize: 9 }}>{l}{hasActiveFilter ? " (filtered)" : ""}</div><div style={{ fontSize: 13, fontWeight: 900 }}>{v}</div></div>
                                ))}
                            </div>

                            {fTotalUnfulfilled > 0 && (
                                <div style={{ background: "#451a03", border: "1px solid #f59e0b", borderRadius: 10, padding: "10px 14px", marginBottom: 14, color: "#fef3c7", fontSize: 11, fontWeight: 600 }}>
                                    ⚠️ <strong>Stock Deficit Warning:</strong> Total Stock Out exceeds available Stock In by {fTotalUnfulfilled} unit(s)! Please add Stock In entries to replenish inventory.
                                </div>
                            )}

                            {/* ── Filter Bar ── */}
                            <div style={{ background: C.mid, borderRadius: 12, padding: 14, marginBottom: 14, border: "1px solid " + C.border }}>
                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                                    <div style={{ fontSize: 11, fontWeight: 700, color: C.muted }}>🔍 FILTERS</div>
                                    {hasActiveFilter && <button onClick={() => setInvFilter({ bt: "All", cat: "All", godown: "All", dateFrom: "", dateTo: "", status: "All", search: "" })} style={{ ...BTNP("#ef4444"), padding: "4px 12px", fontSize: 10 }}>✕ Clear All</button>}
                                </div>
                                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                                    {/* Dropdowns */}
                                    {[["bt", "Bottle Type", ["All", ...BOTTLE_TYPES]], ["cat", "Category", ["All", "normal", "customized"]], ["godown", "Godown", ["All", ...GODOWNS]], ["status", "Status", ["All", "Untouched", "Partial", "Exhausted"]]].map(([k, label, opts]) => (
                                        <div key={k} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                                            <label style={{ fontSize: 9, color: C.muted, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</label>
                                            <select style={{ ...INP, width: "auto", marginBottom: 0, minWidth: 90, border: invFilter[k] !== "All" ? "1.5px solid #818cf8" : "1.5px solid " + C.border }} value={invFilter[k]} onChange={e => setInvFilter(f => ({ ...f, [k]: e.target.value }))}>{opts.map(o => <option key={o}>{o}</option>)}</select>
                                        </div>
                                    ))}
                                    {/* Date Range */}
                                    <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>From</label>
                                        <input type="date" style={{ ...INP, width: "auto", marginBottom: 0, minWidth: 120, border: invFilter.dateFrom ? "1.5px solid #818cf8" : "1.5px solid " + C.border }} value={invFilter.dateFrom} max="2099-12-31" onChange={e => setInvFilter(f => ({ ...f, dateFrom: e.target.value }))} />
                                    </div>
                                    <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>To</label>
                                        <input type="date" style={{ ...INP, width: "auto", marginBottom: 0, minWidth: 120, border: invFilter.dateTo ? "1.5px solid #818cf8" : "1.5px solid " + C.border }} value={invFilter.dateTo} max="2099-12-31" onChange={e => setInvFilter(f => ({ ...f, dateTo: e.target.value }))} />
                                    </div>
                                    {/* Batch Search */}
                                    <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                                        <label style={{ fontSize: 9, color: C.muted, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>Batch #</label>
                                        <input type="text" placeholder="Search batch…" style={{ ...INP, width: "auto", marginBottom: 0, minWidth: 120, border: invFilter.search ? "1.5px solid #818cf8" : "1.5px solid " + C.border }} value={invFilter.search} onChange={e => setInvFilter(f => ({ ...f, search: e.target.value }))} />
                                    </div>
                                </div>
                                {hasActiveFilter && <div style={{ marginTop: 8, fontSize: 10, color: "#818cf8" }}>
                                    📋 Showing {filteredGroups.reduce((a, g) => a + g.fb.length, 0)} batch(es) across {filteredGroups.filter(g => g.fb.length > 0).length} group(s)
                                </div>}
                            </div>

                            {/* ── FIFO Groups ── */}
                            {filteredGroups.map(({ key: k, bt, cat, f, fb, filteredInQty, filteredOutQty, filteredClosing, filteredCogs, filteredBalQty, unfulfilledQty }) => {
                                return (<div key={k} style={{ background: C.mid, borderRadius: 14, padding: 16, marginBottom: 14, borderLeft: "4px solid " + (filteredBalQty < 0 || unfulfilledQty > 0 ? "#ef4444" : "#818cf8") }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, flexWrap: "wrap", gap: 6 }}>
                                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                                            <span style={{ fontSize: 13, fontWeight: 900, color: "#818cf8" }}>💧 {bt}</span>
                                            <Badge label={cat.toUpperCase()} color={cat === "normal" ? "#0ea5e9" : C.amber} />
                                            {unfulfilledQty > 0 && <Badge label={`⚠️ ${unfulfilledQty} units unfulfilled (Deficit)`} color="#ef4444" />}
                                            {hasActiveFilter && <span style={{ fontSize: 9, color: C.muted, fontStyle: "italic" }}>({fb.length}/{f.batches.length} batches)</span>}
                                        </div>
                                        <div style={{ display: "flex", gap: 8 }}>
                                            {[["In", filteredInQty + " units", C.text], ["Out", filteredOutQty + " units", C.red], ["Bal", filteredBalQty + " units", filteredBalQty < 0 ? C.red : C.green], ["Value", fc(filteredClosing), C.violet], ["COGS", fc(filteredCogs), C.amber]].map(([l, v, c]) => (
                                                <div key={l} style={{ background: C.dark, borderRadius: 7, padding: "4px 9px", fontSize: 11 }}><span style={{ color: C.muted }}>{l}: </span><span style={{ fontWeight: 800, color: c }}>{v}</span></div>
                                            ))}
                                        </div>
                                    </div>
                                    {cat === "customized" && f.inQty === 0 && f.outQty > 0 && (
                                        <div style={{ fontSize: 11, color: C.amber, marginBottom: 8, fontStyle: "italic" }}>
                                            ℹ️ Stock Out for Customized category was fulfilled using Normal category batches.
                                        </div>
                                    )}
                                    {fb.length > 0 ? (
                                        <table style={TBL}><thead><tr>{["Batch", "Date", "Godown", "Orig", "Rate", "Issued", "Rem", "Rem Val", "Status"].map(h => <th key={h} style={THS}>{h}</th>)}</tr></thead>
                                            <tbody>{fb.map(b => {
                                                const issued = b.origQty - b.remQty, pct = b.origQty > 0 ? Math.round((issued / b.origQty) * 100) : 0, st = b.remQty === 0 ? "Exhausted" : b.remQty === b.origQty ? "Untouched" : "Partial " + pct + "%", sc = b.remQty === 0 ? C.red : b.remQty === b.origQty ? C.green : C.amber;
                                                return (<tr key={b.batchNo}><td style={TDS}><span style={{ fontFamily: "monospace", color: "#818cf8", fontSize: 10 }}>{b.batchNo}</span></td><td style={TDS}>{b.date}</td><td style={TDS}><Badge label={b.godown} color="#7c3aed" /></td><td style={TDS}>{b.origQty}</td><td style={TDS}>{fc(b.rate)}</td><td style={{ ...TDS, color: C.red }}>{issued}</td><td style={{ ...TDS, fontWeight: 700, color: b.remQty > 0 ? C.green : C.muted }}>{b.remQty}</td><td style={{ ...TDS, color: C.violet }}>{fc(b.remQty * b.rate)}</td><td style={TDS}><Badge label={st} color={sc} /></td></tr>);
                                            })}</tbody>
                                        </table>
                                    ) : (
                                        <div style={{ fontSize: 11, color: C.muted, padding: "8px 0" }}>No direct Stock In batches recorded for this category.</div>
                                    )}
                                </div>);
                            })}
                            {filteredGroups.every(g => g.fb.length === 0 && !g.f.outQty) && <div style={{ background: C.mid, borderRadius: 12, padding: 32, textAlign: "center", color: C.muted }}>
                                <div style={{ fontSize: 28, marginBottom: 8 }}>🔍</div>
                                <div style={{ fontSize: 13, fontWeight: 600 }}>No batches match your filters</div>
                                <div style={{ fontSize: 11, marginTop: 4 }}>Try adjusting your filter criteria or <span style={{ color: "#818cf8", cursor: "pointer" }} onClick={() => setInvFilter({ bt: "All", cat: "All", godown: "All", dateFrom: "", dateTo: "", status: "All", search: "" })}>clear all filters</span></div>
                            </div>}

                            {/* ── FIFO Debug Inspector ── */}
                            {(() => {
                                const ml200StockIn = si.filter(x => x.bottleType === "200ml");
                                const ml200StockOut = so.filter(x => x.bottleType === "200ml");
                                const fifoDebug200n = fifo["200ml_normal"] || { batches: [], inQty: 0, outQty: 0, balQty: 0, cogs: 0 };
                                const fifoDebug200c = fifo["200ml_customized"] || { batches: [], inQty: 0, outQty: 0, balQty: 0, cogs: 0 };
                                const codeStyle = { fontFamily: "monospace", fontSize: 10, color: "#fcd34d", whiteSpace: "pre-wrap", wordBreak: "break-all", background: "#000", padding: 8, borderRadius: 6, marginTop: 4, maxHeight: 220, overflowY: "auto", display: "block" };
                                return (
                                    <details style={{ background: "#0a0f1e", border: "1px solid #f59e0b", borderRadius: 10, padding: 14, marginTop: 16 }}>
                                        <summary style={{ fontWeight: 800, fontSize: 12, color: "#f59e0b", cursor: "pointer", userSelect: "none" }}>🛠️ FIFO Debug Inspector (200ml) — Click to expand/collapse</summary>
                                        <div style={{ marginTop: 10, color: "#94a3b8", fontSize: 10, fontWeight: 700 }}>📥 200ml STOCK IN entries ({ml200StockIn.length})</div>
                                        <pre style={codeStyle}>{ml200StockIn.length === 0 ? "NO STOCK IN ENTRIES FOR 200ml" : ml200StockIn.map((e, i) => `[${i}] batchNo="${e.batchNo}" godown="${e.godown}" category="${e.category || "normal"}" qty=${e.qty} rate=${e.ratePerUnit} isReturn=${e.isReturn} date=${e.date}`).join("\n")}</pre>

                                        <div style={{ marginTop: 8, color: "#94a3b8", fontSize: 10, fontWeight: 700 }}>📤 200ml STOCK OUT entries ({ml200StockOut.length})</div>
                                        <pre style={codeStyle}>{ml200StockOut.length === 0 ? "NO STOCK OUT ENTRIES FOR 200ml" : ml200StockOut.map((e, i) => `[${i}] godown="${e.godown}" category="${e.category || "normal"}" qty=${e.qty} isReturn=${e.isReturn} date=${e.date} billNo="${e.billNo || ""}"`).join("\n")}</pre>

                                        <div style={{ marginTop: 8, color: "#94a3b8", fontSize: 10, fontWeight: 700 }}>🧮 FIFO Result: 200ml_normal (inQty={fifoDebug200n.inQty} outQty={fifoDebug200n.outQty} balQty={fifoDebug200n.balQty} unfulfilledQty={fifoDebug200n.unfulfilledQty || 0})</div>
                                        <pre style={codeStyle}>{fifoDebug200n.batches.length === 0 ? "NO BATCHES COMPUTED" : fifoDebug200n.batches.map((b, i) => `[${i}] batch="${b.batchNo}" godown="${b.godown}" origQty=${b.origQty} remQty=${b.remQty} issued=${b.origQty - b.remQty} rate=${b.rate}`).join("\n")}</pre>

                                        <div style={{ marginTop: 8, color: "#94a3b8", fontSize: 10, fontWeight: 700 }}>🧮 FIFO Result: 200ml_customized (inQty={fifoDebug200c.inQty} outQty={fifoDebug200c.outQty} balQty={fifoDebug200c.balQty} unfulfilledQty={fifoDebug200c.unfulfilledQty || 0})</div>

                                                            <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px" }}></td>

                                                        </>) : (<>
                                                            <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px" }}></td>
                                                            <td style={{ border: "1px solid #cbd5e1", padding: "4px 6px", textAlign: "right", color: "#7c3aed" }}>{fn(inv.igstTotal)}</td>

                                            <span style={{ fontWeight: 800, color: "#1e3a5f" }}>Declaration: </span>

                                            <div style={{ height: 40, borderBottom: "1px solid #000", margin: "8px 20px" }}></div>

                                    </div>
                                </div>
                                {/* ── END INVOICE ── */}
                            </div>);

                                        <select style={INP} value={gstInvForm.godown} onChange={e => setGstInvForm(prev => ({ ...prev, godown: e.target.value }))}>

                                        <div style={{ fontWeight: 800, fontSize: 13, color: C.blue, margin: "14px 0 12px 0", borderBottom: "1px solid #334155", paddingBottom: 6 }}>👤 Client (Recipient)</div>
                                        <label style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, display: "block", marginBottom: 4 }}>Select Recipient *</label>
                                        <select style={INP} value={gstInvForm.clientId} onChange={e => handleClientSelect(e.target.value)}>

                                                            next.shipToGstin = prev.clientGstin;

                                                            next.shipToAddress = prev.clientAddress;

                                                {gstInvForm.paidAmount && Number(gstInvForm.paidAmount) > 0 && Number(gstInvForm.paidAmount) <= gstInvForm.grandTotal && (
                                                    <div style={{ fontSize: 10, color: C.amber, marginTop: 4 }}>
                                                        Remaining <strong>{fc(gstInvForm.grandTotal - Number(gstInvForm.paidAmount))}</strong> will be added on credit.
                                                    </div>

                                                {gstInvForm.paidAmount && Number(gstInvForm.paidAmount) > gstInvForm.grandTotal && (
                                                    <div style={{ fontSize: 10, color: C.red, marginTop: 4 }}>
                                                        ⚠️ Received amount cannot exceed grand total of {fc(gstInvForm.grandTotal)}.
                                                    </div>

                                            </div>
                                        )}
                                    </div>

                                    <div style={{ display: "grid", gap: 16 }}>
                                        <div style={{ background: C.mid, borderRadius: 14, padding: 16, border: "1px solid " + C.border }}>
                                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, borderBottom: "1px solid #334155", paddingBottom: 6 }}>
